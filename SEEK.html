function drawPrices(el, q){
  const hiddenN = M.prices.filter(p=>p.active===false && (!pClient || pKey(p)===pClient)).length;
  const all = M.prices.filter(p=> pShowHidden ? p.active===false : p.active!==false)
                      .map(p=>({p, c:(clientMap.get(p.client_id)||{}).name||'（自社標準）',
                                 w:(wtMap.get(p.work_type_id)||{}).name||'？',
                                 recent: usedRecently(p.client_id+'|'+p.work_type_id)}));
  const done = all.filter(r=>r.p.confirmed_at).length;
  const later = all.filter(r=>!r.recent && !r.p.confirmed_at).length;
  const sure = r => Number(r.p.mode_share) >= 1;      // 過去がいつもこの単価
  // 直近の実績と食い違っていないか（食い違うものは、まとめて確定に混ぜてはいけない）
  const rec = r => recentPrice ? recentPrice.get(r.p.client_id+'|'+r.p.work_type_id) : null;
  const odd = r => { const v = rec(r); return v && Number(v.value) !== Number(r.p.unit_price); };
  const rowsNC = all
    .filter(r=>!q || r.c.includes(q) || r.w.includes(q))
    .filter(r=> pRecentOnly ? r.recent : true)
    .filter(r=> pSure==='all' ? true
              : pSure==='odd'   ? odd(r)
              : pSure==='solid' ? (sure(r) && !odd(r))
              : (!sure(r) && !odd(r)))
    .filter(r=> pFilter==='all' ? true : pFilter==='done' ? !!r.p.confirmed_at : !r.p.confirmed_at)
    // ばらついているものを見るときは「怪しい順」に。実績が多いのに割れている＝いちばん確認が要る
    .sort((a,b)=> pSure==='shaky'
      ? (Number(a.p.mode_share)-Number(b.p.mode_share)) || (b.p.sample_count-a.p.sample_count)
      : b.p.sample_count-a.p.sample_count);
  const rows = rowsNC.filter(r=>!pClient || pKey(r.p)===pClient);
  const pct = all.length ? Math.round(done/all.length*100) : 0;
  // 左の会社の一覧（いまの絞り込み＝未確定／直近1年／検索 を効かせた数）
  const cstat = new Map();
  all.filter(r=>(pRecentOnly ? r.recent : true) && (!q || r.c.includes(q) || r.w.includes(q)))
     .forEach(r=>{ const k=pKey(r.p); const s=cstat.get(k)||{k, name:r.c, n:0, todo:0, odd:0};
       s.n++; if(!r.p.confirmed_at){ s.todo++; if(odd(r)) s.odd++; } cstat.set(k,s); });
  const clist = [...cstat.values()].sort((a,b)=>b.n-a.n);
  const cur = pClient ? (cstat.get(pClient) || {k:pClient, name:(clientMap.get(pClient)||{}).name||'（自社標準）', n:0, todo:0, odd:0}) : null;
  // 支給区分・GL・柱は、ほとんどの行で空なので列にせず工種の横の札にする（案件の画面と同じ）
  const conds = p => [p.supply_type && p.supply_type!=='材工' ? p.supply_type : '',
                      p.opt_gl_cut ? 'GLカット' : '', p.opt_pole||'']
                     .filter(Boolean).map(c=>`<span class="pill">${esc(c)}</span>`).join('');
  // すべての会社を出すときは、会社ごとに見出しを立ててまとめる（行ごとに会社名をくり返さない）
  const pBody = (list, fn) => {
    if(pClient) return list.map(fn).join('');
    const groups = new Map();
    list.forEach(r=>{ const k=pKey(r.p); if(!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
    return [...groups.entries()].sort((a,b)=>b[1].length-a[1].length).map(([k,g])=>{
      const s = cstat.get(k) || {n:g.length, todo:0, odd:0};
      return `<tr class="pgrp"><td colspan="6"><b>${esc(g[0].c)}</b>
        <span class="muted small">　${s.n}行${g.length<s.n?`（ここに出ているのは ${g.length}行。「この会社だけ見る」で全部）`:''}${s.todo?`・未確定 ${s.todo}`:''}${s.odd?`・<span style="color:var(--danger)">⚠ 直近とずれ ${s.odd}</span>`:''}</span>
        <button class="btn ghost sm" data-pc="${esc(k)}" style="float:right">この会社だけ見る</button></td></tr>`
        + g.map(fn).join('');
    }).join('');
  };

  el.innerHTML = `
  <div class="note">
    この表は<b>過去の見積から機械が拾った初期値</b>です。正解ではありません。<br>
    <b>合っていれば「確定」、違えば単価を直してから「確定」</b>を押してください。
    一から入力する必要はありません。
  </div>
  <div class="row" style="margin:10px 0 6px">
    <div style="flex:1;min-width:220px">
      <div class="small muted">確認できたもの　<b style="color:var(--pri)">${done}</b> / ${all.length} 行（${pct}%）</div>
      <div class="prog"><i style="width:${pct}%"></i></div>
    </div>
    <div class="seg">
      ${[['todo','未確定'],['done','確定済み'],['all','すべて']].map(([k,l])=>
        `<button data-pf="${k}" class="${pFilter===k?'on':''}">${l}</button>`).join('')}
    </div>
    <div class="seg">
      <button data-prec="1" class="${pRecentOnly?'on':''}">直近1年で使うもの</button>
      <button data-prec="0" class="${pRecentOnly?'':'on'}">古いものも</button>
    </div>
    <button class="btn sm" id="pAllOk" ${rows.filter(r=>!r.p.confirmed_at).length?'':'disabled'}>
      表示中の ${rows.filter(r=>!r.p.confirmed_at).length}行 をまとめて確定</button>
  </div>

  ${(()=>{
    /* 確認作業を短くするための仕分け（2026-09-07 大嶺さん「確定作業を短縮したい」）。
       mode_share = その単価が過去の実績のうち何割を占めるか。
       1.0 なら「過去はいつもこの単価だった」＝迷う余地が無い。
       実データでは496行のうち306行が 1.0。ここを先にまとめて片付けてもらう。 */
    const pool  = all.filter(r=>!r.p.confirmed_at && (pRecentOnly ? r.recent : true)
                             && (!pClient || pKey(r.p)===pClient));
    const oddR  = pool.filter(odd);
    const solid = pool.filter(r=>sure(r) && !odd(r));
    const shaky = pool.filter(r=>!sure(r) && !odd(r));
    if(!pool.length) return '';
    return `
    ${oddR.length ? `<div class="err" style="margin-bottom:10px">
      <b>⚠ ${oddR.length}行は、おすすめしている単価が「直近の実績」と違います。</b>
      <span class="small">まとめて確定する前に、ここだけ先に見てください。<br>
        いちばん多かった金額を出しているので、<b>昔の金額に引きずられている</b>ことがあります。
        実データでは<b>推奨125,000／直近はずっと10,000</b>という行がありました。</span>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" id="pOdd">この ${oddR.length}行 を先に見る</button>
      </div></div>`:''}

    <div class="note" style="margin-bottom:10px">
      <b>先に「いつもこの単価」だったものを片付けると早く終わります。</b><br>
      <span class="small">
        <b style="color:var(--ok)">${solid.length}行</b> … 過去の実績が<b>全部この単価</b>で、<b>直近ともずれていない</b>。ほぼ確認だけで済みます<br>
        <b style="color:var(--warn)">${shaky.length}行</b> … <b>ほかの単価も出ている</b>。ここは1行ずつ見てほしいところです
        ${oddR.length?`<br><b style="color:var(--danger)">${oddR.length}行</b> … <b>直近とずれている</b>（上の赤い枠）`:''}
      </span>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" id="pSolid" ${solid.length?'':'disabled'}>
          「いつもこの単価」${solid.length}行 だけ表示</button>
        <button class="btn sm ghost" id="pShaky" ${shaky.length?'':'disabled'}>
          「ばらついている」${shaky.length}行 だけ表示</button>
        ${pSure!=='all' ? `<button class="btn sm ghost" id="pAllSure">全部を表示</button>`:''}
      </div>
    </div>`;
  })()}
  ${pRecentOnly && later ? `<div class="small muted" style="margin:-2px 0 8px">
    ほかに <b>${later}行</b> ありますが、<b>直近1年で1度も使っていない単価</b>なので後回しで構いません。
    次に使うときに画面が「未確定」と出します。「古いものも」で見られます。</div>`:''}
  <div id="pMsg"></div>
  <div class="pwrap">
    <div class="plist">
      <button data-pc="" class="${pClient?'':'on'}"><span>すべての会社</span><span class="c">${clist.reduce((a,s)=>a+s.n,0)}</span></button>
      ${clist.map(s=>`<button data-pc="${esc(s.k)}" class="${pClient===s.k?'on':''}" title="${esc(s.name)}">
        <span class="nm">${esc(s.name)}</span>
        <span class="c">${s.odd?`<i class="bad">⚠${s.odd}</i>`:''}${s.todo?`<i>${s.todo}</i>`:'<i class="ok">✓</i>'}</span></button>`).join('')}
    </div>
    <div style="min-width:0">
      ${cur ? (()=>{
        const c = clientMap.get(pClient), hidden = c && c.active===false;
        return `<div class="phead row" style="gap:10px;align-items:baseline">
          <span><b>${esc(cur.name)}</b> の単価表${hidden?' <span class="tag">見積の顧客一覧から隠しています</span>':''}
          <span class="muted small">　${cur.n}行${cur.todo?`・未確定 ${cur.todo}`:'・すべて確定済み'}</span></span>
          <span class="spacer"></span>
          ${hiddenN||pShowHidden?`<button class="btn ghost sm" id="pHid">${pShowHidden?'← 単価表に戻る':`消した行 ${hiddenN}`}</button>`:''}
          ${c?`<button class="btn ghost sm" id="pHideClient" title="見積をつくるの「顧客」の一覧に出さない（マスタには残る。いつでも戻せます）">${hidden?'顧客一覧に戻す':'この顧客を一覧から隠す'}</button>`:''}
        </div>
        ${pShowHidden?'':`<details class="padd"><summary>＋ この会社に工種を足す</summary>
          <div class="row" style="gap:8px;align-items:flex-end;margin-top:8px;flex-wrap:wrap">
            <label class="f">工種<input id="paName" list="paList" placeholder="打つと候補が出ます（無ければ新しく作ります）" style="width:300px"></label>
            <datalist id="paList">${(M.wts||[]).filter(w=>w.active!==false).map(w=>`<option value="${esc(w.name)}">`).join('')}</datalist>
            <label class="f">単位<input id="paUnit" placeholder="式" style="width:60px"></label>
            <label class="f">単価<input id="paPrice" placeholder="0" style="width:100px;text-align:right"></label>
            <label class="f">原価<input id="paCost" placeholder="空なら原価マスタ" style="width:120px;text-align:right"></label>
            <button class="btn sm" id="paAdd">足す</button>
          </div></details>`}`;
      })() : (pShowHidden?`<div class="phead row"><b>消した行</b><span class="spacer"></span><button class="btn ghost sm" id="pHid">← 単価表に戻る</button></div>`
                         : (hiddenN?`<div class="phead row"><span class="spacer"></span><button class="btn ghost sm" id="pHid">消した行 ${hiddenN}</button></div>`:''))}
      <div class="scroll taller"><table class="tight">
    <thead><tr><th>工種</th><th>単位</th>
      <th class="n">単価</th><th class="n" title="この顧客のときの原価。空なら工種の原価マスタを使います">原価</th><th>過去の実績</th><th></th></tr></thead>
    <tbody>${pBody(rows.slice(0,600), r=>`<tr data-row="${esc(r.p.id)}">
      <td>${esc(r.w)} ${conds(r.p)}</td>
      <td class="small">${esc(r.p.unit||'')}</td>
      <td class="n"><input style="width:100px;text-align:right" data-price="${esc(r.p.id)}"
        value="${Number(r.p.unit_price)}"></td>
      <td class="n">${(()=>{
        // 空なら工種の原価マスタを使う（灰色で見せておく）。入っていれば「この顧客のときの原価」
        const mc = costIdx.get(String(r.w).trim()), has = r.p.cost_unit!=null && r.p.cost_unit!=='';
        const c = has ? Number(r.p.cost_unit) : (mc ? Number(mc.cost_unit) : null), pr = Number(r.p.unit_price);
        const rate = c!=null && pr ? Math.round(c/pr*100) : null;
        return `<input style="width:90px;text-align:right${has?';font-weight:700':''}" data-cost="${esc(r.p.id)}"
          value="${has?Number(r.p.cost_unit):''}" placeholder="${mc?Number(mc.cost_unit):''}"
          title="この顧客のときの原価。空なら工種の原価マスタ（${mc?yen(mc.cost_unit):'なし'}）を使います">
          <div class="small" style="color:${rate==null?'var(--muted)':rate>100?'var(--danger)':rate>80?'var(--warn)':'var(--muted)'}">${
            rate==null?'':(has?'この顧客 ':'マスタ ')+rate+'%'}</div>`;
      })()}</td>
      <td class="small">${(()=>{
        // 「83件すべてこの単価」なのか「12件中8件」なのかで、見る手間がまるで違う
        const n = Number(r.p.sample_count), s = Number(r.p.mode_share);
        let h;
        if(!s) h = `<span class="muted">${n}件</span>`;
        else if(s >= 1) h = `<span style="color:var(--ok);font-weight:700">${n}件すべてこの単価</span>`;
        else { const same = Math.round(n*s);
          h = `<span style="color:var(--warn);font-weight:700">${n}件中 ${same}件</span>`
            + `<span class="muted">（ほかの単価も ${n-same}件）</span>`; }
        // 直近の実績。ずれているときは、その場で合わせられるようにする
        const v = rec(r);
        if(v){
          const same = Number(v.value) === Number(r.p.unit_price);
          h += ` <span style="color:${same?'var(--muted)':'var(--danger)'}">`
             + `直近3件はずっと <b>${yen(v.value)}</b>${same?'（一致）':''}</span>`;
          if(!same) h += ` <button class="btn sm" data-fitrecent="${esc(r.p.id)}"
              data-v="${Number(v.value)}">直近に合わせる</button>`;
        }
        return h;
      })()}</td>
      <td style="white-space:nowrap">${pShowHidden
        ? `<button class="btn sm" data-revive="${esc(r.p.id)}">単価表に戻す</button>`
        : (r.p.confirmed_at
        ? `<span class="tag b">確定</span> <button class="btn ghost sm" data-undo="${esc(r.p.id)}">戻す</button>`
        : `<button class="btn sm" data-ok="${esc(r.p.id)}">確定</button>`)
        + ` <button class="btn ghost sm" data-pdel="${esc(r.p.id)}" title="単価表から消す（見積で出なくなる。あとで戻せます）">消す</button>`}</td></tr>`)
      || '<tr><td colspan="6" class="muted">該当する行がありません</td></tr>'}</tbody></table></div>
    </div>
  </div>
  ${rows.length>600?`<div class="small muted" style="margin-top:8px">表示は先頭600行（該当 ${rows.length}行）。絞り込んでお使いください</div>`:''}`;

  const msg = m => document.getElementById('pMsg').innerHTML = m;
  const find = id => M.prices.find(x=>x.id===id);

  el.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{ pFilter=b.dataset.pf; drawMaster(); });
  el.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{ pClient=b.dataset.pc; pShowHidden=false; drawMaster(); });
  // 消す（active=false）／戻す。消しても行は残るので、いつでも戻せる
  el.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=async()=>{
    const row=find(b.dataset.pdel); const nm=(wtMap.get(row.work_type_id)||{}).name||'';
    if(!confirm(`「${nm}」（${yen(row.unit_price)}）を単価表から消します。\n見積をつくるで出なくなります。「消した行」からいつでも戻せます。`)) return;
    b.disabled=true;
    try{ await savePrice(row,{active:false}); reindex(); drawMaster();
         const pm=document.getElementById('pMsg'); if(pm) pm.innerHTML=`<div class="ok">「${esc(nm)}」を消しました（「消した行」から戻せます）</div>`; }
    catch(e){ b.disabled=false; msg(`<div class="err">${esc(e.message)}</div>`); }
  });
  el.querySelectorAll('[data-revive]').forEach(b=>b.onclick=async()=>{
    const row=find(b.dataset.revive); b.disabled=true;
    try{ await savePrice(row,{active:true}); reindex();
         // 消した行がもう無ければ、単価表に戻る
         if(!M.prices.some(p=>p.active===false && (!pClient || pKey(p)===pClient))) pShowHidden=false;
         drawMaster(); }
    catch(e){ b.disabled=false; msg(`<div class="err">${esc(e.message)}</div>`); }
  });
  const ph=document.getElementById('pHid'); if(ph) ph.onclick=()=>{ pShowHidden=!pShowHidden; drawMaster(); };
  const phc=document.getElementById('pHideClient'); if(phc) phc.onclick=async()=>{
    const c=clientMap.get(pClient); if(!c) return; const hide = c.active!==false;
    if(hide && !confirm(`「${c.name}」を、見積をつくるの顧客の一覧から隠します。\nマスタと過去の案件には残ります。いつでも戻せます。`)) return;
    phc.disabled=true;
    try{ await patchClient(c,{active:!hide}); reindex(); drawMaster(); }
    catch(e){ phc.disabled=false; msg(`<div class="err">${esc(e.message)}</div>`); }
  };
  const paName=document.getElementById('paName');
  if(paName) paName.onchange=()=>{ const w=(M.wts||[]).find(x=>String(x.name).trim()===paName.value.trim());
    const u=document.getElementById('paUnit'); if(w && u && !u.value) u.value=w.default_unit||''; };
  const paAdd=document.getElementById('paAdd'); if(paAdd) paAdd.onclick=async()=>{
    const name=paName.value.trim(), unit=document.getElementById('paUnit').value.trim();
    const price=numIn(document.getElementById('paPrice').value), ct=document.getElementById('paCost').value.trim();
    const cost = ct==='' ? null : numIn(ct);
    if(!name) return msg('<div class="err">工種を入れてください</div>');
    if(!(price>=0) || !isFinite(price)) return msg('<div class="err">単価を入れてください</div>');
    if(cost!==null && (!isFinite(cost) || cost<0)) return msg('<div class="err">原価は0以上の数字か、空にしてください</div>');
    const isNew = !(M.wts||[]).some(x=>String(x.name).trim()===name);
    if(isNew && !confirm(`「${name}」は工種の一覧にありません。新しい工種として作って、この会社の単価表に足します。よろしいですか。`)) return;
    paAdd.disabled=true;
    try{ const r=await addPriceRow(pClient==='_'?null:pClient, name, unit, price, cost);
         drawMaster();
         const pm=document.getElementById('pMsg'); if(pm) pm.innerHTML=`<div class="ok">「${esc(r.w.name)}」を ${yen(price)} で${r.revived?'単価表に戻して直しました':'足しました'}${isNew?'（工種も新しく作りました）':''}。見積をつくるですぐ使えます。</div>`; }
    catch(e){ paAdd.disabled=false; msg(`<div class="err">${esc(e.message)}</div>`); }
  };
  el.querySelectorAll('[data-prec]').forEach(b=>b.onclick=()=>{ pRecentOnly=b.dataset.prec==='1'; drawMaster(); });
  const sw=(id,v)=>{ const b=document.getElementById(id); if(b) b.onclick=()=>{ pSure=v; drawMaster(); }; };
  sw('pSolid','solid'); sw('pShaky','shaky'); sw('pAllSure','all'); sw('pOdd','odd');
  // 「直近に合わせる」…単価を直近の実績に書き換えて保存する（確定はしない。目で見てから押してもらう）
  el.querySelectorAll('[data-fitrecent]').forEach(b=>b.onclick=async()=>{
    const row = find(b.dataset.fitrecent); if(!row) return;
    const v = Number(b.dataset.v);
    const before = Number(row.unit_price);
    b.disabled = true;
    try{
      await savePrice(row,{unit_price:v});
      msg(`<div class="ok">${esc(yen(before))} → <b>${esc(yen(v))}</b> にしました。`
        + `よければ「確定」を押してください</div>`);
      drawMaster();
    }catch(e){ msg(`<div class="err">${esc(e.message)}</div>`); b.disabled=false; }
  });

  // 単価を直したら、その場で保存する（確定はしない＝直しただけの状態を残す）
  el.querySelectorAll('[data-price]').forEach(inp=>inp.onchange=async()=>{
    const row=find(inp.dataset.price); const v=numIn(inp.value);
    if(!isFinite(v) || v<0){ inp.value=Number(row.unit_price); msg('<div class="err">単価は0以上の数字で入れてください（カンマは入れても大丈夫です）</div>'); return; }
    if(v===Number(row.unit_price)) return;
    const before=Number(row.unit_price);
    inp.disabled=true;
    try{ await savePrice(row,{unit_price:v, source:'手入力'});
         msg(`<div class="ok">${esc((wtMap.get(row.work_type_id)||{}).name||'')} の単価を ${yen(before)} → <b>${yen(v)}</b> に直しました</div>`); }
    catch(e){ inp.value=before; msg(`<div class="err">${esc(e.message)}</div>`); }
    finally{ inp.disabled=false; }
  });

  // 原価（この顧客のとき）。空にすると工種の原価マスタに戻る
  el.querySelectorAll('[data-cost]').forEach(inp=>inp.onchange=async()=>{
    const row=find(inp.dataset.cost); const t=inp.value.trim();
    const v = t==='' ? null : numIn(t);
    if(v!==null && (!isFinite(v) || v<0)){ inp.value=row.cost_unit??''; msg('<div class="err">原価は0以上の数字で入れてください（空にすると工種の原価マスタを使います）</div>'); return; }
    const before = row.cost_unit==null||row.cost_unit==='' ? null : Number(row.cost_unit);
    if(v===before) return;
    inp.disabled=true;
    try{ await savePrice(row,{cost_unit:v});
         const nm=(wtMap.get(row.work_type_id)||{}).name||'';
         const done=`<div class="ok">${esc(nm)} の原価を ${v==null?'空（工種の原価マスタを使う）':'<b>'+yen(v)+'</b>'} にしました</div>`;
         drawMaster();                            // 原価率を出し直す（描き直すと知らせが消えるので、あとから出す）
         const pm=document.getElementById('pMsg'); if(pm) pm.innerHTML=done; }
    catch(e){ inp.value=before??''; msg(`<div class="err">${esc(e.message)}</div>`); }
    finally{ inp.disabled=false; }
  });
  el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{
    const row=find(b.dataset.ok);
    const inp=el.querySelector(`[data-price="${CSS.escape(row.id)}"]`);
    const v=numIn(inp.value);
    b.disabled=true;
    try{
      await savePrice(row, Object.assign({confirmed_at:new Date().toISOString()},
        v!==Number(row.unit_price)&&isFinite(v)&&v>=0 ? {unit_price:v, source:'手入力'} : {}));
      drawMaster(); refreshMasterHead();
    }catch(e){ b.disabled=false; msg(`<div class="err">${esc(e.message)}</div>`); }
  });
  el.querySelectorAll('[data-undo]').forEach(b=>b.onclick=async()=>{
    const row=find(b.dataset.undo); b.disabled=true;
    try{ await savePrice(row,{confirmed_at:null}); drawMaster(); refreshMasterHead(); }
    catch(e){ b.disabled=false; msg(`<div class="err">${esc(e.message)}</div>`); }
  });

  const allBtn=document.getElementById('pAllOk');
  if(allBtn) allBtn.onclick=async()=>{
    const todo=rows.filter(r=>!r.p.confirmed_at).map(r=>r.p);
    if(!todo.length) return;
    if(!confirm(`いま表示している ${todo.length}行 を「確定」にします。\n`
      +`画面で直した単価はそのまま保存されます。よろしいですか。`)) return;
    allBtn.disabled=true;
    let ok=0; const ng=[];
    for(const row of todo){
      allBtn.textContent=`確定中… ${ok+ng.length+1}/${todo.length}`;
      try{ await savePrice(row,{confirmed_at:new Date().toISOString()}); ok++; }
      catch(e){ ng.push(((wtMap.get(row.work_type_id)||{}).name||row.id)+'：'+e.message); }
    }
    drawMaster(); refreshMasterHead();
    document.getElementById('pMsg').innerHTML =
      `<div class="${ng.length?'err':'ok'}">${ok}行を確定しました。`
      + (ng.length?`<br><b>${ng.length}行は確定できませんでした。</b><br>${ng.slice(0,5).map(esc).join('<br>')}`:'')
      + `</div>`;
  };
}

/* ============================================================
   顧客マスタのレビュー（名寄せの確認・分割・統合）
   ------------------------------------------------------------
   Excelの「御中」欄の100通りの書き方を81社にまとめてある。
   まとめ方が正しいかは村山さんにしか分からないので、画面で直せるようにする。
     ・確認できた社に印をつける（data.reviewed_at）
     ・違う会社を一緒にしていたら「分ける」
     ・同じ会社が2つに分かれていたら「まとめる」
   ============================================================ */
let cFilter = 'todo';   // todo=未確認 / merged=表記ゆれあり / all=すべて
// まとめられて使わなくなった会社は、選択肢に出さない（マスタ画面には残す）
const activeClients = () => M.clients.filter(c=>c.active!==false);
const clientJobs = c => M.jobs.filter(j=>j.client_id===c.id);
const variantsOf = c => (c.name_variants||[]).filter(Boolean);

async function patchClient(c, patch){
  const res = await fetch(SB_URL+'/rest/v1/seek_clients?id=eq.'+encodeURIComponent(c.id),{
    method:'PATCH', headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify(patch)});
  if(!res.ok) throw new Error('保存できませんでした（'+res.status+'）'+(await res.text()).slice(0,120));
  const rows=await res.json(); if(!rows.length) throw new Error('対象が見つかりませんでした');
  Object.assign(c, rows[0]); return c;
}
// 案件の付け替え。client_id と、表示用のスナップショット client_name の両方を直す
async function moveJobs(jobs, toClient){
  let ok=0; const ng=[];
  for(const j of jobs){
    try{
      const res=await fetch(SB_URL+'/rest/v1/seek_jobs?id=eq.'+encodeURIComponent(j.id)
        +'&version=eq.'+Number(j.version),{
        method:'PATCH', headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
        body: JSON.stringify({client_id: toClient.id, client_name: toClient.name})});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const rows=await res.json(); if(!rows.length) throw new Error('別の端末で更新されています');
      Object.assign(j, rows[0]); ok++;
    }catch(e){ ng.push((j.title||j.id)+'：'+e.message); }
  }
  return {ok, ng};
}

          ? vs.map(v=>`${esc(v)} <button class="btn ghost sm" data-split="${esc(c.id)}"

function openMerge(from){
  const cands = M.clients.filter(c=>c.id!==from.id)
    .map(c=>({c, score: similar(from.name, c.name)}))
    .sort((a,b)=>b.score-a.score).slice(0, 40);
  document.getElementById('dlgT').textContent = `「${from.name}」を別の会社にまとめる`;
  document.getElementById('dlgB').innerHTML = `
    <div class="note"><b>${esc(from.name)}</b>（案件 ${clientJobs(from).length}件）を、選んだ会社に吸収させます。<br>
      案件と「Excelでの書き方」は移ります。<b>単価表は、相手にまだ無い行だけ移ります</b>
      （同じ工種の単価が両方にある場合は、相手側の単価を残します）。<br>
      元の会社は<b>使わない状態</b>にします（消しません）。</div>
    <div class="row" style="margin:10px 0">
      <label class="f" style="flex:1;min-width:280px">まとめ先
        <select id="mgTo">${cands.map(({c,score})=>
          `<option value="${esc(c.id)}">${esc(c.name)}（案件${clientJobs(c).length}件）${
            score>0.5?'　← 名前が似ています':''}</option>`).join('')}</select></label>
      <button class="btn" id="mgGo">まとめる</button>
    </div>
    <div id="mgMsg"></div>`;
  dlg.showModal();
  document.getElementById('mgGo').onclick=async()=>{
    const to=M.clients.find(c=>c.id===document.getElementById('mgTo').value);
    if(!to) return;
    const jobs=clientJobs(from);
    if(!confirm(`「${from.name}」を「${to.name}」にまとめます。\n\n`
      +`・案件 ${jobs.length}件 を「${to.name}」に付け替えます\n`
      +`・「${from.name}」は使わない状態になります\n\nよろしいですか。`)) return;
    const btn=document.getElementById('mgGo'); btn.disabled=true;
    const msg=m=>document.getElementById('mgMsg').innerHTML=m;
    try{
      // 単価表: 相手にまだ無い組合せだけ移す（あるものは相手を残す＝上書きしない）
      const key=p=>[p.work_type_id,p.supply_type,p.opt_gl_cut?1:0,p.opt_pole||''].join('|');
      const has=new Set(M.prices.filter(p=>p.client_id===to.id).map(key));
      const mine=M.prices.filter(p=>p.client_id===from.id);
      let moved=0, kept=0;
      for(const p of mine){
        if(has.has(key(p))){ kept++; continue; }
        const r=await fetch(SB_URL+'/rest/v1/seek_price_lists?id=eq.'+encodeURIComponent(p.id),{
          method:'PATCH', headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
          body: JSON.stringify({client_id: to.id})});
        if(r.ok){ const rows=await r.json(); if(rows.length){ Object.assign(p, rows[0]); moved++; } }
      }
      const r=await moveJobs(jobs, to);
      await patchClient(to,{name_variants:[...new Set([...variantsOf(to), ...variantsOf(from)])]});
      await patchClient(from,{active:false,
        data:Object.assign({},from.data,{merged_into:to.id, reviewed_at:new Date().toISOString()})});
      reindex();
      msg(`<div class="${r.ng.length?'err':'ok'}">
        案件 ${r.ok}件 を「${esc(to.name)}」にまとめました。単価表は ${moved}行を移し、${kept}行は相手側を残しました。
        ${r.ng.length?`<br><b>${r.ng.length}件は付け替えられませんでした。</b><br>${r.ng.slice(0,5).map(esc).join('<br>')}`:''}</div>`);
      drawMaster();
    }catch(e){ msg(`<div class="err">${esc(e.message)}</div>`); }
    finally{ btn.disabled=false; }
  };
}
// 名前の似ている度合い（片方がもう片方を含む＝強い手がかり）
function similar(a,b){
  a=String(a); b=String(b);
  if(!a||!b) return 0;
  if(a===b) return 1;
  if(a.includes(b)||b.includes(a)) return .9;
  const s=new Set(a); let hit=0; for(const ch of new Set(b)) if(s.has(ch)) hit++;
  return hit/Math.max(s.size,1);
}

/* ============================================================
   仕入先（外注業者）とその単価
   ------------------------------------------------------------
   全体フロー §1-2 工程3。外注先は【受注後の手配】ではなく
   【見積を作る段階】で選んでいる、という 2026-09-05 の指摘に対応する入口。

   いま現物があるのは オパス（区画線）1社だけ。名前だけの推測では入れない。
   ============================================================ */
/* 外注先・仕入先の登録と直し（2026-09-30 大嶺さん「外注先マスタにメールアドレス入れれるようにして」）。
   メールは、受注したときに外注へ図面やオープン日を送る（これから作る）ときに使う */
const SUP_FIELDS = [['name','呼び名','例：仲村工業'],['formal_name','正式名称','例：株式会社仲村工業'],['category','区分','例：電気・ライン・看板・土木'],
                    ['contact','担当者',''],['email','メール','例：info@example.co.jp'],['tel','TEL',''],['fax','FAX',''],['note','メモ','']];
let supEdit = null;        // 直している外注先の id（'new' は新しく足す）
function supForm(s){

      <input data-sf="${k}" value="${esc((s&&s[k])||'')}" placeholder="${esc(ph)}"${k==='email'?' type="email"':''}></label>`).join('')}
    <div class="row" style="gap:8px;align-items:flex-end">

}
async function saveSupplier(s, vals){
  if(!String(vals.name||'').trim()) throw new Error('呼び名を入れてください');
  if(vals.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(vals.email)) throw new Error('メールアドレスの形が正しくありません');
  const body = Object.assign({}, vals);
  Object.keys(body).forEach(k=>{ if(body[k]==='') body[k]=null; }); body.name=String(vals.name).trim();
  const url = s ? SB_URL+'/rest/v1/seek_suppliers?id=eq.'+encodeURIComponent(s.id) : SB_URL+'/rest/v1/seek_suppliers';
  if(!s) Object.assign(body, {id:'s-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), org_id:'seek', active:true});
  const res = await fetch(url, { method: s?'PATCH':'POST',
    headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}), body: JSON.stringify(s?body:[body]) });
  if(!res.ok) throw new Error('保存できませんでした（'+res.status+'）'+(await res.text()).slice(0,120));
  const row=(await res.json())[0];
  if(s) Object.assign(s,row); else (M.suppliers=M.suppliers||[]).push(row);
  return row;
}
function drawSuppliers(el, q){
  const sups = (M.suppliers||[]).filter(s=>!q || (s.name+' '+(s.formal_name||'')+' '+(s.category||'')+' '+(s.email||'')).includes(q));

const BACKUP_TABLES = [

  ['seek_job_item_costs','明細の原価','item_id'],
  ['seek_clients','顧客','id'], ['seek_work_types','工種','id'],

async function makeBackup(onProgress){
  const out = { _meta:{ version:APP_VERSION, at:new Date().toISOString(),
                        by:(sbSession()||{}).email||'', org:'seek' } };
  for(const [t,label,ord] of BACKUP_TABLES){
    if(onProgress) onProgress(label);
    out[t] = await sbFetchAll(t, 'select=*&order='+ord+'.asc');
  }
  return out;
}
function downloadFile(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: type||'application/json'}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

async function restoreBackup(data){
  const n = BACKUP_TABLES.reduce((a,[t])=>a+(data[t]||[]).length, 0);
  if(!confirm(`控えの ${n.toLocaleString()}行 で、いまのデータを上書きします。\n`
    + `同じIDの行は控えの内容に置き換わります。\n\n`
    + `控えの日時: ${(data._meta.at||'').slice(0,16).replace('T',' ')}\n\n`
    + `よろしいですか。`)) return;
  const log = document.getElementById('bkRestoreLog');
  const b = document.getElementById('bkRestore'); b.disabled = true;
  let ok = 0; const ng = [];
  // 親から順に入れる（顧客→工種→…→案件→明細→原価）。外部キーの順番を守るため
  const order = ['seek_clients','seek_work_types','seek_bank_accounts','seek_settings',
                 'seek_suppliers','seek_supplier_prices','seek_equipment','seek_cost_prices',
                 'seek_price_lists','seek_jobs','seek_job_items','seek_job_item_costs','seek_worklogs'];
  for(const t of order){
    const rows = data[t]; if(!rows || !rows.length) continue;
    const label = (BACKUP_TABLES.find(x=>x[0]===t)||[])[1] || t;
    log.innerHTML = `<div class="small muted" style="margin-top:8px">${esc(label)} を戻しています…</div>`;
    // 1,000行ずつ送る。まとめて送るとタイムアウトする
    for(let i=0; i<rows.length; i+=500){
      const part = rows.slice(i, i+500);
      try{
        const res = await fetch(SB_URL+'/rest/v1/'+t+'?on_conflict='+
            ((BACKUP_TABLES.find(x=>x[0]===t)||[])[2]||'id'), {
          method:'POST',
          headers: await H({'Content-Type':'application/json',
                            Prefer:'resolution=merge-duplicates,return=minimal'}),
          body: JSON.stringify(part) });
        if(!res.ok) throw new Error(res.status+' '+(await res.text()).slice(0,120));
        ok += part.length;
      }catch(e){ ng.push(label+'：'+e.message); }
    }
  }
  log.innerHTML = `<div class="${ng.length?'err':'ok'}" style="margin-top:10px">
    ${ok.toLocaleString()}行を戻しました。
    ${ng.length?`<br><b>${ng.length}か所で失敗しました。</b><br>${ng.slice(0,5).map(esc).join('<br>')}`:''}
    <br><span class="small">画面を読み直してください。</span></div>`;
  b.disabled = false;
}

/* ============================================================
   原価のマスタ（機器の標準原価 ／ 工種ごとの直接原価単価）
   ------------------------------------------------------------
   現行Excelの「見積り」シート右側（売上原価計算）と、
   標準(MP)/(とめ)/(TG)/(新全) の4シートをデータ化したもの。
   ★村山さん専用。顧客別単価表と同じ扱い。

   工種ごとの原価単価は「実績の最頻値」＝初期値であって正解ではない。
   顧客別単価表と同じく confirmed_at を null で入れてあり、ここで確定してもらう。
   ============================================================ */
let costTab = 'wt';      // wt=工種の原価単価 / eq=機器の標準原価
let costFilter = 'todo'; // todo=未確定 / check=要確認 / done=確定済み / all=全部
let cRecentOnly = true;  // 既定で「直近1年で使うものだけ」

async function saveCostPrice(row, patch){
  const res = await fetch(SB_URL+'/rest/v1/seek_cost_prices?id=eq.'+encodeURIComponent(row.id),{
    method:'PATCH',
    headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify(patch)
  });
  if(!res.ok) throw new Error('保存できませんでした（'+res.status+'）'+(await res.text()).slice(0,120));
  const rows = await res.json();
  if(!rows.length) throw new Error('対象の行が見つかりませんでした');
  Object.assign(row, rows[0]);
  return row;
}

function drawCostPrices(el, all0){
  // 直近1年で使っていない工種は後回しでよい（次に使うときに未確定と出る）
  const all   = cRecentOnly ? all0.filter(c=>usedRecently((c.name||'').trim())) : all0;
  const later = all0.filter(c=>!c.confirmed_at && !usedRecently((c.name||'').trim())).length;
  // 単価表と同じ仕分け。「過去がいつもこの原価」なら見比べる相手がいない＝迷う余地が無い。
  const same = c => Number(c.mode_count) >= Number(c.sample_count) && Number(c.sample_count) > 0;
  const share = c => { const n=Number(c.sample_count)||0; return n ? Number(c.mode_count)/n : 0; };
  const todo = all.filter(c=>!c.confirmed_at && c.is_stable);
  const check= all.filter(c=>!c.confirmed_at && !c.is_stable);
  const done = all.filter(c=>c.confirmed_at);
  const solid = all.filter(c=>!c.confirmed_at && same(c));
  const shaky = all.filter(c=>!c.confirmed_at && !same(c));
  const pick = (costFilter==='todo'?todo : costFilter==='check'?check : costFilter==='done'?done
              : costFilter==='solid'?solid : costFilter==='shaky'?shaky : all)
    .slice()
    // ばらついているものを見るときは、いちばん割れているものから
    .sort((a,b)=> (costFilter==='shaky'||costFilter==='check')
      ? (share(a)-share(b)) || (Number(b.sample_count)-Number(a.sample_count))
      : Number(b.sample_count)-Number(a.sample_count));
  el.innerHTML = `
  <div class="row" style="margin-bottom:10px">
    <div class="seg">
      ${[['todo','未確定 '+todo.length],['check','要確認 '+check.length],
         ['done','確定済み '+done.length],['all','すべて '+all.length]].map(([k,l])=>
        `<button data-cf="${k}" class="${costFilter===k?'on':''}">${l}</button>`).join('')}

    <span class="muted small">見積りシートの「直接原価（単価）」の実績から、いちばん多かった金額を入れてあります。</span>
  </div>
  ${cRecentOnly && later ? `<div class="small muted" style="margin:-2px 0 8px">
    ほかに <b>${later}件</b> ありますが、<b>直近1年で1度も使っていない工種</b>なので後回しで構いません。</div>`:''}

  ${(solid.length || shaky.length) ? `<div class="note" style="margin-bottom:10px">
    <b>先に「いつもこの原価」だったものを片付けると早く終わります。</b><br>
    <span class="small">
      <b style="color:var(--ok)">${solid.length}件</b> … 過去の実績が<b>全部この原価</b>。ほぼ確認だけで済みます<br>
      <b style="color:var(--warn)">${shaky.length}件</b> … <b>ほかの金額も出ている</b>。1件ずつ見てほしいところです
      ${check.length?`（うち <b>${check.length}件</b> は<b>ばらつきが大きい</b>。Excelで機器代が混ざっている分）`:''}
    </span>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" data-cf="solid" ${solid.length?'':'disabled'}>
        「いつもこの原価」${solid.length}件 だけ表示</button>
      <button class="btn sm ghost" data-cf="shaky" ${shaky.length?'':'disabled'}>
        「ばらついている」${shaky.length}件 だけ表示</button>
      ${costFilter!=='all' ? `<button class="btn sm ghost" data-cf="all">全部を表示</button>`:''}
    </div>
  </div>`:''}
  ${costFilter==='check'?`<div class="note">
    <b>案件ごとに金額がばらついている工種です。</b>いちばん多かった金額を出していますが、
    そのまま使ってよいか分かりません。<b>直すか、確定にしてください。</b></div>`:''}
  <div class="scroll taller"><table class="tight">
    <thead><tr><th>工種</th><th>単位</th><th class="n">直接原価（単価）</th>
      <th>過去の実績</th><th></th></tr></thead>
    <tbody>${pick.slice(0,400).map(c=>`<tr>
      <td>${esc(c.name)}</td>
      <td class="small">${esc(c.unit||'')}</td>
      <td class="n"><input data-cost="${esc(c.id)}" value="${Number(c.cost_unit)}"
        style="width:110px;text-align:right"></td>
      <td class="small">${(()=>{
        // 単価表と同じ見せ方に揃える。「108件」だけでは判断できない。
        const n=Number(c.sample_count)||0, m=Number(c.mode_count)||0, v=Number(c.variant_count)||0;
        if(!n) return '<span class="muted">実績なし</span>';
        if(m>=n) return `<span style="color:var(--ok);font-weight:700">${n}件すべてこの原価</span>`;
        return `<span style="color:var(--warn);font-weight:700">${n}件中 ${m}件</span>`
             + `<span class="muted">（${v}通りの金額が出ている）</span>`;
      })()}</td>
      <td style="white-space:nowrap">${c.confirmed_at
        ? `<span class="muted small">${esc(String(c.confirmed_at).slice(0,10))} 確定</span>
           <button class="btn ghost sm" data-cundo="${esc(c.id)}">戻す</button>`
        : `<button class="btn ghost sm" data-cok="${esc(c.id)}">これでOK</button>`}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="muted">該当なし</td></tr>'}</tbody></table></div>
  ${pick.length>400?`<div class="muted small">表示は先頭400件です（該当 ${pick.length}件）</div>`:''}
  <div class="small muted" style="margin-top:8px">
    人工は工種ではなく設定に入れています ―
    <b>15,000円/人日</b>（実データ487件中472件が15,000の倍数。半日を含めると100%）。<br>
    ⚠ Excelの備考「N人M日」は金額と合っていないので使っていません（一致59件／不一致365件）。</div>`;

  el.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{ costFilter=b.dataset.cf; drawMaster(); });
  el.querySelectorAll('[data-crec]').forEach(b=>b.onclick=()=>{ cRecentOnly=b.dataset.crec==='1'; drawMaster(); });
  el.querySelectorAll('[data-cost]').forEach(inp=>inp.onchange=async()=>{
    const row=(M.costPrices||[]).find(x=>x.id===inp.dataset.cost); if(!row) return;
    const v=numIn(inp.value); if(!Number.isFinite(v)||v<0){ inp.value=Number(row.cost_unit); return; }
    inp.disabled=true;
    try{ await saveCostPrice(row,{cost_unit:v, source:'手入力', updated_at:new Date().toISOString()}); setBar('原価を直しました'); }
    catch(e){ alert(e.message); inp.value=Number(row.cost_unit); }
    inp.disabled=false;
  });
  el.querySelectorAll('[data-cok]').forEach(b=>b.onclick=async()=>{
    const row=(M.costPrices||[]).find(x=>x.id===b.dataset.cok); if(!row) return;
    b.disabled=true;
    try{ await saveCostPrice(row,{confirmed_at:new Date().toISOString()}); drawMaster(); refreshMasterHead(); }
    catch(e){ alert(e.message); b.disabled=false; }
  });
  el.querySelectorAll('[data-cundo]').forEach(b=>b.onclick=async()=>{
    const row=(M.costPrices||[]).find(x=>x.id===b.dataset.cundo); if(!row) return;
    b.disabled=true;
    try{ await saveCostPrice(row,{confirmed_at:null}); drawMaster(); refreshMasterHead(); }
    catch(e){ alert(e.message); b.disabled=false; }
  });
}

/* ============================================================
   帳票・印鑑（マスタ → 設定）
   ------------------------------------------------------------
   会社印の画像・登録番号（インボイス）・担当者印の名前を seek_settings.data に持つ。
   ★会社印は SEEK.html に書かない（公開ページなので、書くと誰でも持ち出せる）。
     DBの seek_settings は事務・管理者しか読めない（第1段のRLS）。
   画像は、まわりの白や透明の余白を自動で切り落としてから保存する
   （帳票の印鑑の枠は、Excelの印影そのものの大きさで測ってあるため）。
   ============================================================ */
async function trimSealImage(file){
  const url = await new Promise((ok,ng)=>{ const r=new FileReader(); r.onload=()=>ok(r.result);
    r.onerror=()=>ng(new Error('画像を読めませんでした')); r.readAsDataURL(file); });
  const img = await new Promise((ok,ng)=>{ const i=new Image(); i.onload=()=>ok(i);
    i.onerror=()=>ng(new Error('画像として開けませんでした（PNGかJPEGにしてください）')); i.src=url; });
  const cv=document.createElement('canvas'); cv.width=img.naturalWidth; cv.height=img.naturalHeight;
  const g=cv.getContext('2d'); g.drawImage(img,0,0);
  const {data,width:w,height:h}=g.getImageData(0,0,cv.width,cv.height);
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const k=(y*w+x)*4;
    const ink = data[k+3]>40 && !(data[k]>235 && data[k+1]>235 && data[k+2]>235);   // 白と透明は余白
    if(ink){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<0) throw new Error('印影が見つかりませんでした（真っ白な画像です）');
  const cw=x1-x0+1, ch=y1-y0+1, sc=Math.min(1, 480/Math.max(cw,ch));
  const out=document.createElement('canvas'); out.width=Math.round(cw*sc); out.height=Math.round(ch*sc);
  out.getContext('2d').drawImage(cv, x0,y0,cw,ch, 0,0,out.width,out.height);
  return out.toDataURL('image/png');
}
async function saveSettings(patch){
  const data = Object.assign({}, M.settings||{}, patch);
  const res = await fetch(SB_URL+'/rest/v1/seek_settings?id=eq.1',{
    method:'PATCH', headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify({data}) });
  if(!res.ok) throw new Error('保存できませんでした（'+res.status+'）'+(await res.text()).slice(0,160));
  const rows = await res.json();
  if(!rows.length) throw new Error('設定の行が見つかりませんでした（権限が無い可能性があります）');
  M.settings = rows[0].data || data;
}

    <div class="hint"><b>人工（外注）の1人日あたりの単価です。</b><br>
      <span class="small">見積を作る画面で外注先を選ぶと、ここの単価が入ります。
      変えても、保存済みの案件の原価は変わりません（案件にはその時の単価が残ります）。</span></div>
    ${msg}
    <div class="card" style="margin-top:12px">
      <h2>外注先ごとの単価</h2>
      <div class="scroll"><table class="tight" style="max-width:560px">
        <thead><tr><th>外注先</th><th class="n">単価（円／人日）</th><th></th></tr></thead>
        <tbody>${rows.map((r,i)=>`<tr>
          <td><input data-ln="${i}" value="${esc(r.name)}" placeholder="外注先の名前" style="width:220px"></td>
          <td class="n"><input data-lu="${i}" value="${esc(r.unit_price)}" placeholder="15000" style="width:110px;text-align:right"></td>
          <td><button class="btn ghost sm" data-ld="${i}" title="この行を消す">×</button></td></tr>`).join('')
          || '<tr><td colspan="3" class="muted small">まだ登録がありません。</td></tr>'}</tbody></table></div>
      <div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap">
        <button class="btn ghost sm" id="lAdd">＋ 外注先を足す</button>
        ${miss.length?`<span class="muted small" style="margin-left:8px">案件で使った未登録の外注先：</span>
          ${miss.slice(0,8).map(n=>`<button class="btn ghost sm" data-lq="${esc(n)}">＋ ${esc(n)}</button>`).join('')}`:''}
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>既定の単価</h2>
      <label class="f">外注先を入れないときの単価（円／人日）
        <input id="lDef" value="${def}" style="width:110px;text-align:right"></label>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn" id="lSave">保存する</button></div>`;
    const sync = () => {                        // 描き直す前に、打った内容を拾っておく
      el.querySelectorAll('[data-ln]').forEach(x=>rows[+x.dataset.ln].name=x.value);
      el.querySelectorAll('[data-lu]').forEach(x=>rows[+x.dataset.lu].unit_price=x.value);
      def = document.getElementById('lDef').value;
    };
    document.getElementById('lAdd').onclick=()=>{ sync(); rows.push({name:'',unit_price:''}); draw(); };
    el.querySelectorAll('[data-lq]').forEach(b=>b.onclick=()=>{ sync(); rows.push({name:b.dataset.lq, unit_price:''}); draw(); });
    el.querySelectorAll('[data-ld]').forEach(b=>b.onclick=()=>{ sync(); rows.splice(+b.dataset.ld,1); draw(); });
    document.getElementById('lSave').onclick = async () => {
      sync();
      const clean=[], seen=new Set();
      for(const r of rows){
        const n=String(r.name||'').trim(); if(!n) continue;
        const u=numIn(r.unit_price);
        if(!(u>0)) return draw(`<div class="err">「${esc(n)}」の単価を入れてください（1人日あたりの円）</div>`);
        if(seen.has(n)) return draw(`<div class="err">「${esc(n)}」が2回入っています</div>`);
        seen.add(n); clean.push({name:n, unit_price:u});
      }
      const d=numIn(def);
      if(!(d>0)) return draw('<div class="err">既定の単価を入れてください</div>');
      try{ await saveSettings({ labor: Object.assign({}, L0, {unit_price:d, vendors:clean}) });
           rows = clean.map(x=>Object.assign({},x)); def=d;
           draw('<div class="ok">保存しました。次に作る見積から使われます。</div>'); }
      catch(err){ draw(`<div class="err">${esc(err.message)}</div>`); }
    };
  };
  draw();
}

/* ============================================================
   工種の一覧と「同じかもしれない工種」（2026-09-30 大嶺さん
   「半角・全角とかで同じような工種が増えてる。同じ可能性のあるのはピックアップして」）
   ------------------------------------------------------------
   3段階で拾う（実データ346工種で: 字の違いだけ4組／工・工事6組／括弧の中が違う36組）
     ① 字の違いだけ … 全角半角（Ｐ/P）・空白・長音 を揃えると同じ
     ② 工・工事     … ①に加えて、末尾の「工事」「工」を除くと同じ（バリカー撤去 と バリカー撤去工事）
     ③ 括弧の中     … （支給）（柱含む）（抜き）などを除くと同じ。別物のこともあるので村山さんが決める
   「まとめる」＝残す工種を1つ選ぶと、ほかの工種の単価表の行を残す方へ移し（同じ顧客で残す方に行があれば、
   こちらの行は消した行にする）、ほかの工種は選択肢から外す（active=false・data.merged_into）。
   ★過去の見積の明細は書き換えない（品名はそのまま・合計も変わらない）。
   「別物なので出さない」はその組を settings.wtDupIgnore に覚える。
   ============================================================ */
const wtN1 = s => String(s||'').normalize('NFKC').replace(/[\s　]/g,'').replace(/[‐‑‒–—―ｰ−-]/g,'ー').toLowerCase();
const wtN2 = s => wtN1(s).replace(/(工事|工)$/,'').replace(/(工事|工)(\()/,'$2');
const wtN3 = s => wtN1(s).replace(/[（(][^）)]*[）)]/g,'').replace(/※.*/,'').replace(/(工事|工)$/,'');
const wtKey = a => a.map(w=>w.id).sort().join('|');
function wtDupGroups(){
  const ws=(M.wts||[]).filter(w=>w.active!==false), ign=new Set(((M.settings||{}).wtDupIgnore)||[]);
  const grp=fn=>{ const g=new Map(); ws.forEach(w=>{ const k=fn(w.name); (g.get(k)||g.set(k,[]).get(k)).push(w); });
                  return [...g.values()].filter(a=>a.length>1); };
  const A=grp(wtN1), sA=new Set(A.map(wtKey));
  const B=grp(wtN2).filter(a=>!sA.has(wtKey(a))), sB=new Set(B.map(wtKey));
  const C=grp(wtN3).filter(a=>!sA.has(wtKey(a)) && !sB.has(wtKey(a)));
  const keep=a=>!ign.has(wtKey(a));
  const byUse=a=>a.slice().sort((x,y)=>(y.sample_count||0)-(x.sample_count||0));
  return { A:A.filter(keep).map(byUse), B:B.filter(keep).map(byUse), C:C.filter(keep).map(byUse) };
}
async function mergeWorkTypes(keep, drops){
  const same=(p,q)=>p.client_id===q.client_id && (p.supply_type||'材工')===(q.supply_type||'材工') && !!p.opt_gl_cut===!!q.opt_gl_cut && (p.opt_pole||'')===(q.opt_pole||'');
  let moved=0, hidden=0;
  for(const d of drops){
    for(const p of M.prices.filter(p=>p.work_type_id===d.id && p.active!==false)){
      const k = M.prices.find(q=>q.work_type_id===keep.id && same(p,q));     // 消した行も含めて（一意の制約があるため）
      if(!k){ await savePrice(p,{work_type_id:keep.id}); moved++; }
      else if(k.active===false){ await savePrice(k,{active:true, unit_price:p.unit_price, cost_unit:p.cost_unit, unit:p.unit});
                                 await savePrice(p,{active:false}); moved++; }
      else { await savePrice(p,{active:false}); hidden++; }
    }
    const res = await fetch(SB_URL+'/rest/v1/seek_work_types?id=eq.'+encodeURIComponent(d.id), { method:'PATCH',
      headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
      body: JSON.stringify({active:false, data:Object.assign({}, d.data||{}, {merged_into:keep.id, merged_at:new Date().toISOString()})}) });
    if(!res.ok) throw new Error(d.name+' を外せませんでした（'+res.status+'）');
    Object.assign(d, (await res.json())[0] || {active:false});
  }
  reindex();
  return {moved, hidden};
}
let wtDupTab = 'A';
function drawWorkTypes(el, q){
  const G = wtDupGroups(), list = G[wtDupTab]||[];
  const prN = id => M.prices.filter(p=>p.work_type_id===id && p.active!==false).length;
  const rows = (M.wts||[]).filter(w=>w.active!==false && (!q || w.name.includes(q)));
  const merged = (M.wts||[]).filter(w=>w.active===false && w.data && w.data.merged_into);
  el.innerHTML = `
  <div class="card">
    <div class="row" style="align-items:baseline"><h2 style="margin:0">同じかもしれない工種</h2>
      <span class="muted small">書き方の違いで同じ工種が2つ以上になっているものです。残す名前を選んで「まとめる」と、選択肢がすっきりします（過去の見積は変わりません）</span></div>
    <div class="seg" style="margin:10px 0">
      <button data-wdt="A" class="${wtDupTab==='A'?'on':''}">字の違いだけ ${G.A.length}</button>
      <button data-wdt="B" class="${wtDupTab==='B'?'on':''}">工・工事の違い ${G.B.length}</button>
      <button data-wdt="C" class="${wtDupTab==='C'?'on':''}">括弧の中が違う ${G.C.length}</button></div>
    <div class="small muted" style="margin-bottom:8px">${wtDupTab==='A'?'全角・半角（Ｐ と P）や空白だけが違うもの。ほぼ確実に同じです'
      : wtDupTab==='B'?'「工事」が付いているかどうかだけが違うもの。たいてい同じです'
      : '（支給）（柱含む）（抜き）など、括弧の中だけが違うもの。<b>別の工事のこともある</b>ので、同じものだけまとめてください'}</div>
    <div id="wdMsg"></div>
    ${list.length ? list.map((g,gi)=>`<div class="wdup">
      ${g.map((w,wi)=>`<label class="wd-row"><input type="radio" name="wd${gi}" value="${esc(w.id)}" ${wi===0?'checked':''}>
        <b>${esc(w.name)}</b><span class="muted small">実績 ${w.sample_count||0}件・単価表 ${prN(w.id)}行</span></label>`).join('')}
      <div class="row" style="gap:6px;margin-top:6px">
        <button class="btn sm" data-wdmerge="${gi}">選んだ名前にまとめる</button>
        <button class="btn ghost sm" data-wdign="${gi}">別物なので出さない</button></div></div>`).join('')
      : '<div class="muted small">このなかには、もうありません。</div>'}
  </div>
  <div class="card" style="margin-top:12px">
    <div class="row"><b>工種 ${rows.length}種</b><span class="muted small">名前は「直す」で変えられます（過去の見積の品名は変わりません）</span></div>
    <div class="scroll tall" style="margin-top:6px"><table class="tight"><thead><tr><th>工種</th><th>分類</th><th>既定の単位</th>
      <th class="n">実績</th><th class="n">単価表</th><th></th></tr></thead><tbody>
      ${rows.slice(0,600).map(w=>`<tr><td>${esc(w.name)}</td><td>${esc(w.category||'')}</td>
        <td>${esc(w.default_unit||'')}</td><td class="n">${w.sample_count||0}</td><td class="n">${prN(w.id)}</td>
        <td><button class="btn ghost sm" data-wtren="${esc(w.id)}">直す</button></td></tr>`).join('')}</tbody></table></div>
    ${merged.length?`<div class="small muted" style="margin-top:8px">まとめて外した工種 ${merged.length}種：${merged.slice(0,30).map(w=>esc(w.name)+' → '+esc((wtMap.get(w.data.merged_into)||{}).name||'')).join('、')}</div>`:''}
  </div>`;
  const wmsg = m => { const b=document.getElementById('wdMsg'); if(b) b.innerHTML=m; };
  el.querySelectorAll('[data-wdt]').forEach(b=>b.onclick=()=>{ wtDupTab=b.dataset.wdt; drawMaster(); });
  el.querySelectorAll('[data-wdmerge]').forEach(b=>b.onclick=async()=>{
    const g=list[+b.dataset.wdmerge], kid=(el.querySelector(`input[name="wd${b.dataset.wdmerge}"]:checked`)||{}).value;
    const keep=g.find(w=>w.id===kid), drops=g.filter(w=>w.id!==kid);
    if(!confirm(`「${keep.name}」にまとめます。\n\n外す：${drops.map(w=>w.name).join('、')}\n\n外す方の単価表の行は「${keep.name}」へ移ります（同じ顧客にもう行があれば、外す方の行は「消した行」にします）。\n過去の見積の品名と金額は変わりません。よろしいですか。`)) return;
    b.disabled=true;
    try{ const r=await mergeWorkTypes(keep, drops); drawMaster();
         wmsg(`<div class="ok">「${esc(keep.name)}」にまとめました（単価表の行 ${r.moved}行を移し、${r.hidden}行は重なるので消した行にしました）</div>`); }
    catch(e){ b.disabled=false; wmsg(`<div class="err">${esc(e.message)}</div>`); }
  });
  el.querySelectorAll('[data-wdign]').forEach(b=>b.onclick=async()=>{
    const g=list[+b.dataset.wdign]; b.disabled=true;
    try{ await saveSettings({wtDupIgnore: [...(((M.settings||{}).wtDupIgnore)||[]), wtKey(g)]}); drawMaster(); }
    catch(e){ b.disabled=false; wmsg(`<div class="err">${esc(e.message)}</div>`); }
  });
  el.querySelectorAll('[data-wtren]').forEach(b=>b.onclick=async()=>{
    const w=wtMap.get(b.dataset.wtren); const nm=prompt('新しい名前（過去の見積の品名は変わりません）', w.name);
    if(nm===null || !nm.trim() || nm.trim()===w.name) return;
    try{
      const res=await fetch(SB_URL+'/rest/v1/seek_work_types?id=eq.'+encodeURIComponent(w.id), { method:'PATCH',
        headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}), body: JSON.stringify({name:nm.trim()}) });
      if(res.status===409) throw new Error('同じ名前の工種がもうあります。「同じかもしれない工種」でまとめてください');
      if(!res.ok) throw new Error('直せませんでした（'+res.status+'）');
      Object.assign(w,(await res.json())[0]); reindex(); drawMaster();
    }catch(e){ alert(e.message); }
  });
}

/* ============================================================
   起動
   ============================================================ */
const gate=document.getElementById('gate');
function showGate(msg){
  gate.classList.remove('hidden');
  document.getElementById('shell').classList.add('hidden');
  document.getElementById('bar').classList.add('hidden');
  if(msg) document.getElementById('gMsg').innerHTML = `<div class="err">${esc(msg)}</div>`;
  if(!SB_URL||!SB_KEY) document.getElementById('gateCfg').classList.remove('hidden');
  const c=(()=>{ try{ return JSON.parse(localStorage.getItem(LS.cfg)||'null'); }catch(e){ return null; } })();
  if(c){ document.getElementById('gUrl').value=c.url||''; document.getElementById('gKey').value=c.key||''; }
}
function showApp(){
  gate.classList.add('hidden');
  ['shell','bar'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
  const s=sbSession();
  document.getElementById('who').textContent = s? s.email : '';
}
document.getElementById('gCfgBtn').onclick=()=>document.getElementById('gateCfg').classList.toggle('hidden');
document.getElementById('gBtn').onclick=async()=>{
  const u=document.getElementById('gUrl').value.trim(), k=document.getElementById('gKey').value.trim();
  if(u&&k){ SB_URL=u.replace(/\/+$/,''); SB_KEY=k;
    try{ localStorage.setItem(LS.cfg, JSON.stringify({url:SB_URL,key:SB_KEY})); }catch(e){} }
  if(!SB_URL||!SB_KEY){ document.getElementById('gMsg').innerHTML='<div class="err">'
      +'<b>先に接続先を入れてください。</b>下の「Supabase Project URL」と「publishable key」の2つです。'
      +'</div>';
    document.getElementById('gateCfg').classList.remove('hidden'); return; }
  const btn=document.getElementById('gBtn'); btn.disabled=true; btn.textContent='ログイン中…';
  try{
    await sbLogin(document.getElementById('gMail').value.trim(), document.getElementById('gPw').value);
    document.getElementById('gPw').value='';    // パスワードは画面にもコードにも残さない
    await boot();
  }catch(e){
    document.getElementById('gMsg').innerHTML=`<div class="err">${esc(e.message)}</div>`;
  }finally{ btn.disabled=false; btn.textContent='ログイン'; }
};
async function boot(){
  try{
    await loadAll();
    resetMake();          // 既定の振込先・見積日はマスタを読んでから決める
    showApp();
    render();
  }catch(e){
    showGate(e.message);
  }
}
(async ()=>{
  if(SB_URL && SB_KEY && sbSession() && await sbToken()) await boot();
  else showGate();
})();
</script>
