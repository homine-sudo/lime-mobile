/* 法定福利費と端数値引き
   ------------------------------------------------------------
   紙の御見積書3枚（2026-09-05 受領）はいずれも ちょうど4.00% だった:
     DP古島 1,426,000→57,040 ／ DP首里寒川 1,745,000→69,800 ／ DP名護 1,881,500→75,260
   さらに Excel実データ全件で確かめた（福利費の行がある案件 199件）:
     ちょうど4.00%  173件（86.9%）／ 中央値 4.00%・四分位も 4.00%
     ちょうど1.00%    7件  ← この率で出している案件もある。ボタンの値は手で直せる
   基準は「諸経費・法定福利費を除いた工事の小計」。
   値引きは端数落とし（1,553,040→▲40 / 2,041,760→▲1,760）だった。
   ------------------------------------------------------------ */
const WELFARE_RATE = 0.04;
const isExpenseLine = l => {
  if(l.section!=null) return Number(l.section)===2;
  const w = l.work_type_id ? wtMap.get(l.work_type_id) : null;
  return (w && w.category==='経費') || EXPENSE_RE.test(l.name||'');
};
function addWelfare(){
  const wt = M.wts.find(w=>/^法定福利費$/.test(w.name)) || M.wts.find(w=>/福利/.test(w.name));
  const base = mk.lines.filter(l=>!isExpenseLine(l)).reduce((a,l)=>a+Number(l.amount||0),0);
  if(base<=0){ alert('先に工事の明細を入れてください。\n法定福利費は「諸経費を除いた工事の小計」の4%です。'); return; }
  const amt = Math.round(base*WELFARE_RATE);
  const at = mk.lines.findIndex(l=>/福利/.test(l.name||''));
  const line = { work_type_id: wt?wt.id:null, name: wt?wt.name:'法定福利費', section:2,
                 supply_type:'材工', opt_gl_cut:false, opt_pole:'',
                 qty:1, unit:'式', unit_price:amt, amount:amt, cost_unit:null, cost_amount:null,
                 memo:'工事小計 '+yen(base)+' の4%' };
  if(at>=0){ line.id = mk.lines[at].id; mk.lines[at]=line; } else mk.lines.push(line);
  drawMake();
}
function roundDown(){
  const sub = mk.lines.reduce((a,l)=>a+Number(l.amount||0),0);
  if(sub<=0) return;
  const target = Math.floor(sub/1000)*1000;          // 千円未満を落とす
  const d = target - sub;                             // 実データと同じくマイナス値で入れる
  if(d===0){ alert('すでに千円単位です（端数はありません）。'); return; }
  mk.discount = d; drawMake();
}
/* 「この見積が通れば何％残るか」を出す欄 */
function drawProfit(){
  const p = profitOf(mk.lines, mk.discount, mk.labor_days);
  const yenc = n => yen(Math.round(n));
  const days = Number(mk.labor_days||0);
  const laborRow = `<div class="row" style="gap:6px;align-items:center;margin-bottom:8px">

  if(!p.known){

      <div class="note" style="margin:0">原価がまだ入っていないので、粗利は出せません。<br>

        原価0のまま「粗利100%」と出すのは嘘になるので出しません。</span></div>
    </div>`;
  }
  const gpr = p.gpr===null?0:p.gpr*100;
  const target = 20;                                  // 要件定義 §1工程10「粗利20%超で良し」
  const tone = gpr>=target ? 'ok' : (gpr>=0 ? 'note' : 'err');
  const barW = Math.max(0, Math.min(100, gpr));
  const missing = p.total - p.filled;
  const col = gpr>=target?'var(--ok)':(gpr>=0?'var(--warn)':'var(--danger)');
  return `<div class="profit">

    <div class="bigrate" style="color:${col}">
      <span class="num">${gpr.toFixed(1)}<small>%</small></span>
      <span class="lbl">粗利率<br><span class="muted">原価率 ${(p.cr*100).toFixed(1)}%</span></span>
    </div>
    <div style="height:8px;background:var(--line);border-radius:4px;margin:2px 0 6px;position:relative">
      <div style="height:100%;width:${barW}%;border-radius:4px;background:${col}"></div>
      <div style="position:absolute;left:${target}%;top:-3px;width:2px;height:14px;background:var(--charcoal)"></div>
    </div>
    <div class="small" style="margin-bottom:10px">目安 <b>20%</b>（縦線）。${
      gpr>=target ? '目安を超えています。'
      : gpr>=0 ? '<b>20%に届いていません。</b>'
      : '<b style="color:var(--danger)">赤字です。</b>'}</div>
    ${laborRow}
    <div class="ptot" style="margin:0">
      <div><span>売上（税抜）</span><span>${yenc(p.sales)}</span></div>
      <div><span>原価（明細）</span><span>${yenc(p.itemCost)}</span></div>
      <div><span>原価（人工 ${days||0}人日）</span><span>${yenc(p.labor)}</span></div>
      <div class="g"><span>粗利</span><span>${yenc(p.gp)}</span></div>
    </div>
    ${missing>0?`<div class="small muted" style="margin-top:8px">
      ⚠ 明細 ${p.total}行のうち <b>${missing}行は原価が入っていません</b>。

    ${(()=>{
      const over=mk.lines.filter(l=>l._costOverRate);
      return over.length?`<div class="small" style="margin-top:6px;color:var(--danger)">
        ⚠ ${over.length}行は、Excelの原価が<b>単価より高い</b>ため自動で入れていません（機器代が工事の行に入っています）
        （${over.slice(0,3).map(l=>esc(l.name)).join('・')}${over.length>3?' ほか':''}）。
        実際の原価を手で入れてください。</div>`:'';
    })()}

}
function applyPicks(){
  if(!mk.client_id){ alert('先に顧客を選んでください'); return; }
  const qty = mk.read && mk.read.qty;
  const hitOf = id => (mk.read && mk.read.hits.find(h=>h.id===id)) || null;
  const order = candidatesFor(mk.read?mk.read.kind:'', new Set()).map(x=>x.w.id);
  [...mk.picks].sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(id=>{
    if(mk.lines.some(l=>l.work_type_id===id)) return;      // 二重に足さない
    const w = wtMap.get(id); if(!w) return;
    const h = hitOf(id);
    const l = { work_type_id:id, name:w.name, section: w.category==='経費' ? 2 : 1,
                supply_type:(h&&h.supply)||'材工', opt_gl_cut:false, opt_pole:'',
                qty:1, unit:w.default_unit||'台', unit_price:0, amount:0, cost_unit:null, cost_amount:null };
    applyPrice(l);                                          // 支給区分まで見て単価表を引く
    // 数量は「依頼の箇条書きに書いてあった数」を最優先。
    // 箇条書きが1行も無いメールのときだけ、単位が「台」の行に全体台数を入れる
    //   （実測95%で案件名の台数＝明細の数量。ただし箇条書きがあるのに
    //     そこに書いていない行へ入れると、精算機やP看板まで7台にしてしまう）
    const hasList = !!(mk.read && mk.read.items && mk.read.items.length);
    if(h && h.qty){ l.qty = h.qty; if(h.unit) l.unit = h.unit; }
    else if(qty && l.unit==='台' && !hasList) l.qty = qty;
    l.amount = Number(l.qty||0)*Number(l.unit_price||0);
    mk.lines.push(l);
  });
  mk.picks.clear();
  // 明細に落としたら①はもう用済み。畳んで②を画面に出す
  mkFolded = true; render();
  document.getElementById('mkbody').scrollIntoView({behavior:'smooth', block:'start'});
}
/* 同じ現場に既に見積が無いか、作っている最中に知らせる
   （要件定義 D「重複見積の警告」／課題「二重見積」。
     ダッシュボードの一覧は"後から気づく"ためのもので、本来はここで止めたい） */
function findDupes(clientId, title){
  if(!clientId || !title) return [];
  const norm = s => String(s||'').replace(/^仮\s*[）)]\s*/,'').replace(/[\s　]/g,'').trim();
  const t = norm(title);
  if(t.length < 4) return [];
  if(/月分|レンタル|預かり|支援料|保守|管理費|応援/.test(t)) return [];   // 毎月くり返す費目は対象外
  return M.jobs.filter(j=> j.client_id===clientId && norm(j.title)===t && j.id!==(mk.job&&mk.job.id));
}
function drawDup(){
  const el = document.getElementById('mkdup'); if(!el) return;
  const hits = findDupes(mk.client_id, (document.getElementById('mkt')||{}).value || mk.title);
  if(!hits.length){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="err" style="margin-top:10px">
    <b>同じ現場の見積が ${hits.length}件 すでにあります。</b>作り直しになっていないかご確認ください。<br>
    ${hits.slice(0,5).map(j=>`<span style="display:inline-block;margin-top:4px">
      ${esc(j.quoted_at||'—')}　<b>${yen(j.total_ex_tax)}円</b>　${esc(j.status)}
      <button class="btn ghost sm" data-open="${esc(j.id)}">開く</button></span>`).join('<br>')}
    ${hits.length>5?`<br><span class="muted small">ほか ${hits.length-5}件</span>`:''}
  </div>`;
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openJob(b.dataset.open));
}

function aMake(){
  const sel=document.getElementById('mkc');
  sel.onchange=()=>{ mk.client_id=sel.value; if(!mk.job) mk.lines=[]; mk.msg=''; drawMake(); drawRead(); drawDup(); };
  document.getElementById('mkt').oninput=e=>{ mk.title=e.target.value; drawDup(); };

  // 事務側の項目
  const bind=(id,key)=>{ const el=document.getElementById(id);
    if(el) el.onchange=el.oninput=e=>{ mk[key]=e.target.value; }; };
  bind('mkstatus','status'); bind('mkqd','quoted_at'); bind('mkid','invoiced_at');
  bind('mkdd','delivered_at'); bind('mkud','due_date'); bind('mkpt','payment_terms');

  pa.oninput=e=>{ mk.paste=e.target.value; };

    }
    if(mk.read.title && !document.getElementById('mkt').value){

    if(mk.read.site && !mk.site_address){
      mk.site_address = mk.read.site;
      const sa=document.getElementById('mksa'); if(sa) sa.value = mk.site_address;
    }
    drawMake(); drawRead();
  }
  document.getElementById('mkread').onclick=doRead;
  document.getElementById('mkclear').onclick=()=>{
    mk.paste=''; mk.read=null; mk.picks=new Set(); pa.value=''; drawRead();
  };
  drawMake(); drawRead(); drawDup();

  loadInbox().then(drawInbox);

function priceFor(cid, wid, supply, gl, pole){
  const list = priceIdx.get(cid+'/'+wid) || [];
  return list.find(p=>p.supply_type===supply && !!p.opt_gl_cut===!!gl && (p.opt_pole||'')===(pole||''))
      || list.find(p=>p.supply_type===supply)
      || list.slice().sort((a,b)=>b.sample_count-a.sample_count)[0] || null;
}
/* 原価マスタ（実績の最頻値）から、その工種の直接原価単価を引く。
   村山さんが手で入れた原価があれば触らない。入っていない行だけ埋める。 */
function costFor(l){
  const nm = (l.name || (wtMap.get(l.work_type_id)||{}).name || '').trim();
  return nm ? costIdx.get(nm) || null : null;
}
function applyPrice(l){
  if(!l.work_type_id) return;
  const w = wtMap.get(l.work_type_id);
  // 単価表に載せていない費目（諸経費など、案件ごとに金額が変わるもの）は
  // 過去実績の中央値を「参考」として添えるだけにする。自動では入れない。
  l._median = (w && w.data && w.data.median) || null;
  const p = priceFor(mk.client_id, l.work_type_id, l.supply_type, l.opt_gl_cut, l.opt_pole);
  if(p){ l.unit_price=Number(p.unit_price); l.unit=p.unit||l.unit; l._sample=p.sample_count;
         l._exact = (p.supply_type===l.supply_type && !!p.opt_gl_cut===!!l.opt_gl_cut && (p.opt_pole||'')===(l.opt_pole||'')); }
  else { l._sample=0; l._exact=false; }
  // 原価マスタの値を入れる。ただし入れてよいものだけ。
  //
  // ⚠ 現行Excelは「機器代を工事の行にまとめて入れている」ことがある。
  //   例: 精算機撤去工事 …… 売価 16,500 に対して原価 200,000（原価率1212%）
  //   これを自動で入れると、粗利が -115% のような数字になって使いものにならない。
  //   （実際に実物のメールから作った見積で再現した）
  //   だから **その工種の過去の原価率の中央値が100%を超えるものは自動で入れない。**
  //   参考として画面に出すだけにして、村山さんに入れてもらう。
  //   もう1つ、行ごとの歯止め: マスタの原価がこの行の単価より高いなら入れない。
  //   工種としての原価率が正常でも、お客様ごとの単価が低いと逆転することがある
  //   （例: ロック板設置工事 原価54,000 に対し 大和ハウスの単価32,000）。
  const cq = costFor(l);
  l._costMaster = cq || null;
  const price = Number(l.unit_price||0);
  l._costOverRate = !!(cq && (
        (cq.median_rate!=null && Number(cq.median_rate) > 1)
     || (price > 0 && Number(cq.cost_unit) > price)));
  const empty = (l.cost_unit===null || l.cost_unit===undefined || l.cost_unit==='' || Number(l.cost_unit)===0);
  if(cq && empty && !l._costOverRate){
    l.cost_unit = Number(cq.cost_unit);
    l._costGuess = true;              // 実績からの推定。手で入れた値と見分ける
  }
}
/* この見積が通ったら、いくら残るか
   ------------------------------------------------------------
   売上（税抜）− 原価 = 粗利。原価は次の2つ。
     ・明細ごとの原価単価 × 数量（原価マスタから入るか、村山さんが手で入れる）
     ・人工 ＝ 人日 × 15,000円（実データ487件中472件が15,000の倍数で裏が取れている）
   採算の目安は 要件定義 §1工程10「粗利20%超で良し」。
   ⚠ 原価が1行も入っていない見積では粗利を出さない。0円を原価として
      「粗利100%」と出すと嘘になる（移行データで実際にそうなる案件が多い）。 */
const LABOR_UNIT = () => Number((M.settings&&M.settings.labor&&M.settings.labor.unit_price) || 15000);
function profitOf(lines, discount, laborDays){
  const sales = lines.reduce((a,l)=>a+Number(l.amount||0),0) + Number(discount||0);
  const itemCost = lines.reduce((a,l)=>a+Number(l.cost_unit||0)*Number(l.qty||0),0);
  const labor = Number(laborDays||0) * LABOR_UNIT();
  const cost = itemCost + labor;
  const filled = lines.filter(l=>Number(l.cost_unit||0)>0).length;
  return { sales, itemCost, labor, cost, filled, total:lines.length,
           gp: sales-cost, gpr: sales>0 ? (sales-cost)/sales : null,
           cr: sales>0 ? cost/sales : null,
           known: filled>0 || labor>0 };
}

/* 画面を作り直すと、いま打っている入力欄が「別の要素」に差し替わる。

   → 作り直しの前に「どこを触っていたか」と「カーソルの位置」を覚えて、作り直したあとに戻す。 */
/* 人が打った数字を読む。
   Excelを8年使ってきた人は「12,000」とカンマを打つ。日本語入力のままだと「１２０００」になる。
   素の Number() はどちらも NaN になるので、村山さんには

   単価表343行・原価190行を1行ずつ見てもらうので、ここで弾くと作業が止まる。
   2026-09-08 の点検で実測（12,000 と打つ → 拒否されて元の値に戻る）。 */
const ZEN = '０１２３４５６７８９．，－';
function numIn(v){
  const s = String(v == null ? '' : v)
    .replace(/[０-９．，－]/g, c => '0123456789.,-'[ZEN.indexOf(c)])
    .replace(/[,\s¥￥円]/g, '');
  return s === '' ? NaN : Number(s);

function keepFocus(redraw){
  const a = document.activeElement;
  const id = a && a.id;
  const li = (a && a.dataset) ? a.dataset.li : null;
  const f  = (a && a.dataset) ? a.dataset.f  : null;
  /* 打っている「文字そのもの」を覚えておく。
     作り直しは値を数字に直してから書き戻すので、途中の "1." が "1" に化ける。
     　例）人工に 1.5 と打つ → "1." が "1" にされる → 次の "5" で "15" ＝ 10倍
     　　　15,000円/人日なので 22,500円 のつもりが 225,000円 になる。黙って間違う。
     2026-09-08 村山さんとの打合せ前の点検で発見。数量・単価・原価単価も同じだった。
     チェックボックスは value が "on" なので触らない。 */
  const raw = (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')
               && a.type !== 'checkbox' && a.type !== 'radio') ? a.value : null;
  let s = null, e = null;
  try{ s = a.selectionStart; e = a.selectionEnd; }catch(_){}

  redraw();

  let n = null;
  if(id) n = document.getElementById(id);
  else if(li != null && f) n = document.querySelector(`[data-li="${li}"][data-f="${f}"]`);
  if(n && n !== a && typeof n.focus === 'function'){
    if(raw != null && n.value !== raw) n.value = raw;
    n.focus();
    // select には selectionStart が無い。数値欄でも例外になるブラウザがあるので握りつぶす
    try{ if(s != null) n.setSelectionRange(s, e); }catch(_){}
  }
}

    <td class="n">${yen(l.amount)}</td>

        if(l._costGuess) return `<div class="small muted" style="white-space:nowrap">実績${m.sample_count}件${m.is_stable?'':'・ばらつき'}</div>`;
        return `<div class="small muted" style="white-space:nowrap">実績 ${yen(m.cost_unit)}</div>`;

async function doSave(){
  if(mk.saving) return;
  const c = clientMap.get(mk.client_id);
  if(!c){ mk.msg='<div class="err">顧客を選んでください</div>'; return drawMake(); }
  if(!mk.lines.length){ mk.msg='<div class="err">明細が1行もありません</div>'; return drawMake(); }
  // 二重見積を「後から気づく」のではなく、保存する前に止める
  const dup = findDupes(mk.client_id, (document.getElementById('mkt')||{}).value || mk.title);
  if(dup.length && !confirm(
      `「${c.name}」の同じ案件名の見積が ${dup.length}件 すでにあります。\n\n`
      + dup.slice(0,5).map(j=>`  ${j.quoted_at||'—'}  ${yen(j.total_ex_tax)}円  ${j.status}`).join('\n')
      + `\n\nそれでも新しく作りますか。`)) { return; }
  mk.saving=true; mk.msg=''; drawMake(); setBar('保存中…');
  const job = { org_id:'seek', status: mk.status || '見積提出',
    client_id:c.id, client_name:c.name,
    title: (document.getElementById('mkt')||{}).value || mk.title || '',
    quoted_at: mk.quoted_at || today(),
    invoiced_at: mk.invoiced_at || '', delivered_at: mk.delivered_at || '', due_date: mk.due_date || '',
    payment_terms: mk.payment_terms || '現金',
    tax_rate: mk.tax_rate, discount: Number(mk.discount||0),
    bank_account_id: mk.bank_account_id || (M.banks.find(b=>b.is_default)||M.banks[0]||{}).id || null,
    site_postal_code: mk.site_postal_code || '', site_address: mk.site_address || '',
    site_building: mk.site_building || '',
    open_date: mk.open_date || '', paid_at: mk.paid_at || '',
    note: mk.note || '',
    // 人工は見積の明細ではない（お客様に出す見積書には載せない）ので data に持つ。
    // 移行データも同じ場所に入れてある（_SEEK_05_labor.sql）
    // 0のときも必ず送る。送らないと、DB側は合成（||）なので
    // 「人工を消したのに前の値が残る」ことになる。
    data: { labor_person_days: Number(mk.labor_days||0),
            labor_cost: Number(mk.labor_days||0)*LABOR_UNIT() } };
  if(mk.job){ job.id = mk.job.id; job.version = mk.job.version; }
  else { job.amounts_locked = false; }
  const wasEdit = !!mk.job;
  const picked = Array.from((document.getElementById('mkfiles')||{}).files || []);
  try{
    const saved = await saveJob(job, mk.lines);
    const at = M.jobs.findIndex(x=>x.id===saved.id);
    if(at>=0) M.jobs[at]=saved; else M.jobs.unshift(saved);
    // 案件は保存できた。添付はこのあと。ここで失敗しても案件は残るので、
    // 「保存できた／添付は入らなかった」を分けて出す（できていないことを成功と言わない）
    let fileMsg = '';
    if(picked.length){
      const ok=[], ng=[];
      for(const f of picked){
        try{ await uploadFile(saved.id, f, '図面'); ok.push(f.name); }
        catch(e){ ng.push(e.message); }
      }
      if(ok.length) fileMsg += `<br>図面 ${ok.length}件を添付しました（${ok.map(esc).join(' / ')}）`;
      if(ng.length) fileMsg += `<br><b>図面 ${ng.length}件は添付できませんでした。</b>`
        + `案件は保存できているので、「案件を探す」から開いて追加してください。`
        + `<br>${ng.map(esc).join('<br>')}`;
    }
    // 受信箱から来た案件は、メールの添付を案件に付け替えて、受信箱から外す。
    // ここで失敗しても案件は残っているので、失敗したことをそのまま出す。
    if(mk.fromInbox){
      const src = mk.fromInbox;
      try{
        const n = await attachInboxFiles(saved.id, src);
        if(n) fileMsg += `<br>メールの添付 ${n}件を案件に付けました`;
        await setInboxStatus(src, '案件にした', saved.id);
      }catch(e){
        fileMsg += `<br><b>メールの添付を案件に付けられませんでした。</b>${esc(e.message)}`;
      }
    }
    const msg = `<div class="${picked.length && fileMsg.includes('できませんでした')?'note':'ok'}">
      ${wasEdit?'更新しました':'保存しました'}。案件番号 <b>${esc(saved.job_no||'')}</b>　状態 <b>${esc(saved.status)}</b><br>
      合計（税抜） <b>${yen(saved.total_ex_tax)}</b> 円　総合計 <b>${yen(saved.total_in_tax)}</b> 円
      <span class="muted">（合計はサーバーが明細から計算した値です）</span>${fileMsg}</div>`;
    if(wasEdit){
      // 編集を続けられるように、保存後の姿（新しい version）で持ち直す
      mk.job = saved; mk.status = saved.status;
      const fresh = await loadItems(saved.id, true);
      mk.lines = fresh.map(it=>({ id:it.id, work_type_id:it.work_type_id, name:it.name,
        supply_type:it.supply_type||'材工', opt_gl_cut:!!it.opt_gl_cut, opt_pole:it.opt_pole||'',
    section:Number(it.section)===2?2:1,
        qty:Number(it.qty||0), unit:it.unit||'', unit_price:Number(it.unit_price||0),
        amount:Number(it.amount||0), memo:it.memo||'',
        cost_unit:it._cost_unit, cost_amount:it._cost_amount,
        _median:(wtMap.get(it.work_type_id)||{}).data?.median||null }));
    }else{
      copiedFrom = null;
      resetMake();
    }
    mk.msg = msg;
    setBar(wasEdit?'更新しました':'保存しました'); setMeta();
  }catch(e){
    mk.msg = `<div class="err">保存できませんでした。<b>${esc(e.message)}</b><br>
      入力内容はこの画面に残っています。もう一度お試しください。</div>`;
    sbLog({ng:1, note:String(e.message).slice(0,120)});
    setBar('保存に失敗しました');
  }finally{
    mk.saving=false; drawMake();
  }
}

/* ---------- マスタ ---------- */
let mTab='price', mQ='';
/* ============================================================
   マスタ画面
   ------------------------------------------------------------
   7つのタブが1列に並んでいたが、性格がばらばらだった:
     ・村山さんに1行ずつ確認してもらうもの（単価表496・原価270・顧客81）
     ・見るだけのもの（工種346・仕入先）
     ・設定（振込先・メール取込）
   混ざっていると「自分が何をすればいいか」が分からない。3つに分けて、
   確認が要るものには **残り何件か** をタブに出す。
   ============================================================ */
/* 件数は「直近1年で実際に使ったもの」だけを数える。
   1年使っていない単価まで先に確認してもらう必要はない（次に使うときに未確定と出る）。
   これで 847件 → 576件 になった（2026-09-07 実測）。 */
const MTABS = [
  ['確認する', [
    ['price','顧客別単価表', ()=>(M.prices||[]).filter(p=>!p.confirmed_at
        && usedRecently(p.client_id+'|'+p.work_type_id)).length],
    ['cost', '原価',         ()=>(M.costPrices||[]).filter(c=>!c.confirmed_at
        && usedRecently((c.name||'').trim())).length],
    ['client','顧客',        ()=>(M.clients||[]).filter(c=>!(c.data&&c.data.reviewed_at)
        && recentClient(c.id)).length],
  ]],
  ['見る', [
    ['wt',  '工種',   ()=>null],
    ['sup', '仕入先', ()=>null],
  ]],
  ['設定', [
    ['bank','振込先',     ()=>null],
    ['gas', 'メール取込', ()=>null],
    ['user','利用者',     ()=>null],
  ]],
];
const MTAB_ALL = MTABS.flatMap(([,ts])=>ts);
const SEARCHABLE = new Set(['price','cost','sup','wt','client']);   // 絞り込みが効くタブ

/* 見出し（残り件数のまとめ＋タブ）。確定を押すたびに数字が減るよう、ここだけ描き直す。
   render() を呼ぶと画面が先頭まで戻ってしまい、1行ずつ確認していく作業の邪魔になる。 */
function masterHead(){
  const todo = MTABS[0][1].map(([k,l,fn])=>({k,l,n:fn()||0}));
  const total = todo.reduce((a,x)=>a+x.n,0);
  return `${total>0?`<div class="hint" style="margin-bottom:12px">
      <b>村山さんに確認してもらうもの：あと ${total.toLocaleString()}件</b>
      <span class="small">${todo.filter(x=>x.n).map(x=>`${x.l} ${x.n.toLocaleString()}`).join('　/　')}</span><br>
      <span class="small muted">Excelの実績から機械的に出した初期値です。
        1行ずつ「これでOK」を押すか、直してください。まとめて確定もできます。</span>
    </div>`:''}
    <div class="row" style="align-items:flex-end;gap:18px">
      ${MTABS.map(([g,ts])=>`<div>
        <div class="muted small" style="margin-bottom:3px">${g}</div>
        <div class="seg">${ts.map(([k,l,fn])=>{
          const n=fn();
          return `<button data-mt="${k}" class="${mTab===k?'on':''}">${l}${
            n ? `<span class="tabn">${n.toLocaleString()}</span>` : ''}</button>`;
        }).join('')}</div></div>`).join('')}
      <span class="spacer"></span>
      ${SEARCHABLE.has(mTab)
        ? `<label class="f" style="min-width:200px">絞り込み<input id="mq" value="${esc(mQ)}" placeholder="名前で検索"></label>`
        : ''}
    </div>`;
}
function vMaster(){
  return `<div class="card">
    <div id="mhead">${masterHead()}</div>
    <div id="mres" style="margin-top:12px"></div></div>`;
}
/* 確定したあと、残り件数のまとめとタブのバッジを描き直す。
   これが無いと「あと847件」が減らず、どこまで進んだか分からない。 */
function refreshMasterHead(){
  const h=document.getElementById('mhead'); if(!h) return;
  const scroll=window.scrollY;
  // 絞り込み欄(#mq)に打っている最中に呼ばれることがある（原価の読み込みが終わった時など）。
  // そのまま作り直すと欄が別物になり、打っていた文字とフォーカスが消える。
  keepFocus(()=>{ h.innerHTML=masterHead(); bindMasterHead(); });
  window.scrollTo(0,scroll);
}
function bindMasterHead(){
  document.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{ mTab=b.dataset.mt; render(); });
  const q=document.getElementById('mq');
  if(q) q.oninput=()=>{ mQ=q.value; drawMaster(); };
}
function aMaster(){ bindMasterHead(); drawMaster(); }
/* ============================================================
   顧客別単価表のレビュー（村山さん専用）
   ------------------------------------------------------------
   単価表496行は、過去の見積から機械的に拾った「初期値」であって正解ではない。
   だから confirmed_at を null のまま入れてある。
   ここで村山さんが「合っている／違うから直す」を1行ずつ、または まとめて確定できるようにする。
   ============================================================ */
let pFilter = 'todo';    // todo=未確定だけ / done=確定済み / all=全部
// 既定で「直近1年で使うものだけ」。10/1から実際に使う単価に集中してもらうため。
// 古いものも見られる（隠していない）。
let pRecentOnly = true;
// solid=「いつもこの単価」だけ / shaky=ばらついているものだけ / all=全部
let pSure = 'all';
async function savePrice(row, patch){
  const res = await fetch(SB_URL+'/rest/v1/seek_price_lists?id=eq.'+encodeURIComponent(row.id),{
    method:'PATCH',
    headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify(patch)
  });
  if(!res.ok) throw new Error('保存できませんでした（'+res.status+'）'+(await res.text()).slice(0,120));
  const rows = await res.json();
  if(!rows.length) throw new Error('対象の行が見つかりませんでした');
  Object.assign(row, rows[0]);
  return row;
}
function drawPrices(el, q){
  const all = M.prices.map(p=>({p, c:(clientMap.get(p.client_id)||{}).name||'（自社標準）',
                                 w:(wtMap.get(p.work_type_id)||{}).name||'？',
                                 recent: usedRecently(p.client_id+'|'+p.work_type_id)}));
  const done = all.filter(r=>r.p.confirmed_at).length;
  const later = all.filter(r=>!r.recent && !r.p.confirmed_at).length;
  const sure = r => Number(r.p.mode_share) >= 1;      // 過去がいつもこの単価
  // 直近の実績と食い違っていないか（食い違うものは、まとめて確定に混ぜてはいけない）
  const rec = r => recentPrice ? recentPrice.get(r.p.client_id+'|'+r.p.work_type_id) : null;
  const odd = r => { const v = rec(r); return v && Number(v.value) !== Number(r.p.unit_price); };
  const rows = all
    .filter(r=>!q || r.c.includes(q) || r.w.includes(q))
    .filter(r=> pRecentOnly ? r.recent : true)
    .filter(r=> pSure==='all' ? true
              : pSure==='odd'   ? odd(r)
              : pSure==='solid' ? (sure(r) && !odd(r))
              : (!sure(r) && !odd(r)))
    .filter(r=> pFilter==='all' ? true : pFilter==='done' ? !!r.p.confirmed_at : !r.p.confirmed_at)
    // ばらついているものを見るときは「怪しい順」に。実績が多いのに割れている＝いちばん確認が要る
    .sort((a,b)=> pSure==='shaky'
      ? (Number(a.p.mode_share)-Number(b.p.mode_share)) || (b.p.sample_count-a.p.sample_count)
      : b.p.sample_count-a.p.sample_count);
  const pct = all.length ? Math.round(done/all.length*100) : 0;

  el.innerHTML = `
  <div class="note">
    この表は<b>過去の見積から機械が拾った初期値</b>です。正解ではありません。<br>
    <b>合っていれば「確定」、違えば単価を直してから「確定」</b>を押してください。
    一から入力する必要はありません。
  </div>
  <div class="row" style="margin:10px 0 6px">
    <div style="flex:1;min-width:220px">
      <div class="small muted">確認できたもの　<b style="color:var(--pri)">${done}</b> / ${all.length} 行（${pct}%）</div>
      <div class="prog"><i style="width:${pct}%"></i></div>
    </div>
    <div class="seg">
      ${[['todo','未確定'],['done','確定済み'],['all','すべて']].map(([k,l])=>
        `<button data-pf="${k}" class="${pFilter===k?'on':''}">${l}</button>`).join('')}
    </div>
    <div class="seg">
      <button data-prec="1" class="${pRecentOnly?'on':''}">直近1年で使うもの</button>
      <button data-prec="0" class="${pRecentOnly?'':'on'}">古いものも</button>
    </div>
    <button class="btn sm" id="pAllOk" ${rows.filter(r=>!r.p.confirmed_at).length?'':'disabled'}>
      表示中の ${rows.filter(r=>!r.p.confirmed_at).length}行 をまとめて確定</button>
  </div>

  ${(()=>{
    /* 確認作業を短くするための仕分け（2026-09-07 大嶺さん「確定作業を短縮したい」）。
       mode_share = その単価が過去の実績のうち何割を占めるか。
       1.0 なら「過去はいつもこの単価だった」＝迷う余地が無い。
       実データでは496行のうち306行が 1.0。ここを先にまとめて片付けてもらう。 */
    const pool  = all.filter(r=>!r.p.confirmed_at && (pRecentOnly ? r.recent : true));
    const oddR  = pool.filter(odd);
    const solid = pool.filter(r=>sure(r) && !odd(r));
    const shaky = pool.filter(r=>!sure(r) && !odd(r));
    if(!pool.length) return '';
    return `
    ${oddR.length ? `<div class="err" style="margin-bottom:10px">
      <b>⚠ ${oddR.length}行は、おすすめしている単価が「直近の実績」と違います。</b>
      <span class="small">まとめて確定する前に、ここだけ先に見てください。<br>
        いちばん多かった金額を出しているので、<b>昔の金額に引きずられている</b>ことがあります。
        実データでは<b>推奨125,000／直近はずっと10,000</b>という行がありました。</span>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" id="pOdd">この ${oddR.length}行 を先に見る</button>
      </div></div>`:''}

    <div class="note" style="margin-bottom:10px">
      <b>先に「いつもこの単価」だったものを片付けると早く終わります。</b><br>
      <span class="small">
        <b style="color:var(--ok)">${solid.length}行</b> … 過去の実績が<b>全部この単価</b>で、<b>直近ともずれていない</b>。ほぼ確認だけで済みます<br>
        <b style="color:var(--warn)">${shaky.length}行</b> … <b>ほかの単価も出ている</b>。ここは1行ずつ見てほしいところです
        ${oddR.length?`<br><b style="color:var(--danger)">${oddR.length}行</b> … <b>直近とずれている</b>（上の赤い枠）`:''}
      </span>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" id="pSolid" ${solid.length?'':'disabled'}>
          「いつもこの単価」${solid.length}行 だけ表示</button>
        <button class="btn sm ghost" id="pShaky" ${shaky.length?'':'disabled'}>
          「ばらついている」${shaky.length}行 だけ表示</button>
        ${pSure!=='all' ? `<button class="btn sm ghost" id="pAllSure">全部を表示</button>`:''}
      </div>
    </div>`;
  })()}
  ${pRecentOnly && later ? `<div class="small muted" style="margin:-2px 0 8px">
    ほかに <b>${later}行</b> ありますが、<b>直近1年で1度も使っていない単価</b>なので後回しで構いません。
    次に使うときに画面が「未確定」と出します。「古いものも」で見られます。</div>`:''}
  <div id="pMsg"></div>
  <div class="scroll tall"><table>
    <thead><tr><th>顧客</th><th>工種</th><th>支給区分</th><th>GL</th><th>柱</th><th>単位</th>
      <th class="n">単価</th><th>過去の実績</th><th></th></tr></thead>
    <tbody>${rows.slice(0,400).map((r,i)=>`<tr data-row="${esc(r.p.id)}">
      <td>${esc(r.c)}</td><td>${esc(r.w)}</td><td class="small">${esc(r.p.supply_type)}</td>
      <td class="small">${r.p.opt_gl_cut?'○':''}</td><td class="small">${esc(r.p.opt_pole||'')}</td>
      <td class="small">${esc(r.p.unit||'')}</td>
      <td class="n"><input style="width:100px;text-align:right" data-price="${esc(r.p.id)}"
        value="${Number(r.p.unit_price)}"></td>
      <td class="small">${(()=>{
        // 「83件すべてこの単価」なのか「12件中8件」なのかで、見る手間がまるで違う
        const n = Number(r.p.sample_count), s = Number(r.p.mode_share);
        let h;
        if(!s) h = `<span class="muted">${n}件</span>`;
        else if(s >= 1) h = `<span style="color:var(--ok);font-weight:700">${n}件すべてこの単価</span>`;
        else { const same = Math.round(n*s);
          h = `<span style="color:var(--warn);font-weight:700">${n}件中 ${same}件</span>`
            + `<span class="muted">（ほかの単価も ${n-same}件）</span>`; }
        // 直近の実績。ずれているときは、その場で合わせられるようにする
        const v = rec(r);
        if(v){
          const same = Number(v.value) === Number(r.p.unit_price);
          h += `<br><span style="color:${same?'var(--muted)':'var(--danger)'}">`
             + `直近3件はずっと <b>${yen(v.value)}</b>${same?'（一致）':''}</span>`;
          if(!same) h += ` <button class="btn sm" data-fitrecent="${esc(r.p.id)}"
              data-v="${Number(v.value)}">直近に合わせる</button>`;
        }
        return h;
      })()}</td>
      <td>${r.p.confirmed_at
        ? `<span class="tag b">確定</span> <button class="btn ghost sm" data-undo="${esc(r.p.id)}">戻す</button>`

  const msg = m => document.getElementById('pMsg').innerHTML = m;

  el.querySelectorAll('[data-fitrecent]').forEach(b=>b.onclick=async()=>{

    b.disabled = true;

      await savePrice(row,{unit_price:v});
      msg(`<div class="ok">${esc(yen(before))} → <b>${esc(yen(v))}</b> にしました。`

      drawMaster();
    }catch(e){ msg(`<div class="err">${esc(e.message)}</div>`); b.disabled=false; }
  });

  // 単価を直したら、その場で保存する（確定はしない＝直しただけの状態を残す）
  el.querySelectorAll('[data-price]').forEach(inp=>inp.onchange=async()=>{
    const row=find(inp.dataset.price); const v=numIn(inp.value);
    if(!isFinite(v) || v<0){ inp.value=Number(row.unit_price); msg('<div class="err">単価は0以上の数字で入れてください（カンマは入れても大丈夫です）</div>'); return; }
    if(v===Number(row.unit_price)) return;
    const before=Number(row.unit_price);
    inp.disabled=true;
    try{ await savePrice(row,{unit_price:v, source:'手入力'});
         msg(`<div class="ok">${esc((wtMap.get(row.work_type_id)||{}).name||'')} の単価を ${yen(before)} → <b>${yen(v)}</b> に直しました</div>`); }
    catch(e){ inp.value=before; msg(`<div class="err">${esc(e.message)}</div>`); }
    finally{ inp.disabled=false; }
  });

  el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{
    const row=find(b.dataset.ok);
    const inp=el.querySelector(`[data-price="${CSS.escape(row.id)}"]`);
    const v=numIn(inp.value);
    b.disabled=true;
    try{
      await savePrice(row, Object.assign({confirmed_at:new Date().toISOString()},
        v!==Number(row.unit_price)&&isFinite(v)&&v>=0 ? {unit_price:v, source:'手入力'} : {}));
      drawMaster(); refreshMasterHead();
    }catch(e){ b.disabled=false; msg(`<div class="err">${esc(e.message)}</div>`); }
  });
  el.querySelectorAll('[data-undo]').forEach(b=>b.onclick=async()=>{
    const row=find(b.dataset.undo); b.disabled=true;
    try{ await savePrice(row,{confirmed_at:null}); drawMaster(); refreshMasterHead(); }
    catch(e){ b.disabled=false; msg(`<div class="err">${esc(e.message)}</div>`); }
  });

  const allBtn=document.getElementById('pAllOk');
  if(allBtn) allBtn.onclick=async()=>{
    const todo=rows.filter(r=>!r.p.confirmed_at).map(r=>r.p);
    if(!todo.length) return;
    if(!confirm(`いま表示している ${todo.length}行 を「確定」にします。\n`
      +`画面で直した単価はそのまま保存されます。よろしいですか。`)) return;
    allBtn.disabled=true;
    let ok=0; const ng=[];
    for(const row of todo){
      allBtn.textContent=`確定中… ${ok+ng.length+1}/${todo.length}`;
      try{ await savePrice(row,{confirmed_at:new Date().toISOString()}); ok++; }
      catch(e){ ng.push(((wtMap.get(row.work_type_id)||{}).name||row.id)+'：'+e.message); }

      `<div class="${ng.length?'err':'ok'}">${ok}行を確定しました。`
      + (ng.length?`<br><b>${ng.length}行は確定できませんでした。</b><br>${ng.slice(0,5).map(esc).join('<br>')}`:'')
      + `</div>`;
  };
}

/* ============================================================
   顧客マスタのレビュー（名寄せの確認・分割・統合）
   ------------------------------------------------------------
   Excelの「御中」欄の100通りの書き方を81社にまとめてある。
   まとめ方が正しいかは村山さんにしか分からないので、画面で直せるようにする。
     ・確認できた社に印をつける（data.reviewed_at）
     ・違う会社を一緒にしていたら「分ける」
     ・同じ会社が2つに分かれていたら「まとめる」
   ============================================================ */
let cFilter = 'todo';   // todo=未確認 / merged=表記ゆれあり / all=すべて
// まとめられて使わなくなった会社は、選択肢に出さない（マスタ画面には残す）
const activeClients = () => M.clients.filter(c=>c.active!==false);
const clientJobs = c => M.jobs.filter(j=>j.client_id===c.id);
const variantsOf = c => (c.name_variants||[]).filter(Boolean);

async function patchClient(c, patch){
  const res = await fetch(SB_URL+'/rest/v1/seek_clients?id=eq.'+encodeURIComponent(c.id),{
    method:'PATCH', headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify(patch)});
  if(!res.ok) throw new Error('保存できませんでした（'+res.status+'）'+(await res.text()).slice(0,120));
  const rows=await res.json(); if(!rows.length) throw new Error('対象が見つかりませんでした');
  Object.assign(c, rows[0]); return c;
}
// 案件の付け替え。client_id と、表示用のスナップショット client_name の両方を直す
async function moveJobs(jobs, toClient){
  let ok=0; const ng=[];
  for(const j of jobs){
    try{
      const res=await fetch(SB_URL+'/rest/v1/seek_jobs?id=eq.'+encodeURIComponent(j.id)
        +'&version=eq.'+Number(j.version),{
        method:'PATCH', headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
        body: JSON.stringify({client_id: toClient.id, client_name: toClient.name})});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const rows=await res.json(); if(!rows.length) throw new Error('別の端末で更新されています');
      Object.assign(j, rows[0]); ok++;
    }catch(e){ ng.push((j.title||j.id)+'：'+e.message); }
  }
  return {ok, ng};
}

function openMerge(from){
  const cands = M.clients.filter(c=>c.id!==from.id)
    .map(c=>({c, score: similar(from.name, c.name)}))
    .sort((a,b)=>b.score-a.score).slice(0, 40);
  document.getElementById('dlgT').textContent = `「${from.name}」を別の会社にまとめる`;
  document.getElementById('dlgB').innerHTML = `
    <div class="note"><b>${esc(from.name)}</b>（案件 ${clientJobs(from).length}件）を、選んだ会社に吸収させます。<br>
      案件と「Excelでの書き方」は移ります。<b>単価表は、相手にまだ無い行だけ移ります</b>
      （同じ工種の単価が両方にある場合は、相手側の単価を残します）。<br>
      元の会社は<b>使わない状態</b>にします（消しません）。</div>
    <div class="row" style="margin:10px 0">
      <label class="f" style="flex:1;min-width:280px">まとめ先
        <select id="mgTo">${cands.map(({c,score})=>
          `<option value="${esc(c.id)}">${esc(c.name)}（案件${clientJobs(c).length}件）${
            score>0.5?'　← 名前が似ています':''}</option>`).join('')}</select></label>
      <button class="btn" id="mgGo">まとめる</button>
    </div>
    <div id="mgMsg"></div>`;
  dlg.showModal();
  document.getElementById('mgGo').onclick=async()=>{
    const to=M.clients.find(c=>c.id===document.getElementById('mgTo').value);
    if(!to) return;
    const jobs=clientJobs(from);
    if(!confirm(`「${from.name}」を「${to.name}」にまとめます。\n\n`
      +`・案件 ${jobs.length}件 を「${to.name}」に付け替えます\n`
      +`・「${from.name}」は使わない状態になります\n\nよろしいですか。`)) return;
    const btn=document.getElementById('mgGo'); btn.disabled=true;
    const msg=m=>document.getElementById('mgMsg').innerHTML=m;
    try{
      // 単価表: 相手にまだ無い組合せだけ移す（あるものは相手を残す＝上書きしない）
      const key=p=>[p.work_type_id,p.supply_type,p.opt_gl_cut?1:0,p.opt_pole||''].join('|');
      const has=new Set(M.prices.filter(p=>p.client_id===to.id).map(key));
      const mine=M.prices.filter(p=>p.client_id===from.id);
      let moved=0, kept=0;
      for(const p of mine){
        if(has.has(key(p))){ kept++; continue; }
        const r=await fetch(SB_URL+'/rest/v1/seek_price_lists?id=eq.'+encodeURIComponent(p.id),{
          method:'PATCH', headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
          body: JSON.stringify({client_id: to.id})});
        if(r.ok){ const rows=await r.json(); if(rows.length){ Object.assign(p, rows[0]); moved++; } }
      }
      const r=await moveJobs(jobs, to);
      await patchClient(to,{name_variants:[...new Set([...variantsOf(to), ...variantsOf(from)])]});
      await patchClient(from,{active:false,
        data:Object.assign({},from.data,{merged_into:to.id, reviewed_at:new Date().toISOString()})});
      reindex();
      msg(`<div class="${r.ng.length?'err':'ok'}">
        案件 ${r.ok}件 を「${esc(to.name)}」にまとめました。単価表は ${moved}行を移し、${kept}行は相手側を残しました。
        ${r.ng.length?`<br><b>${r.ng.length}件は付け替えられませんでした。</b><br>${r.ng.slice(0,5).map(esc).join('<br>')}`:''}</div>`);
      drawMaster();
    }catch(e){ msg(`<div class="err">${esc(e.message)}</div>`); }
    finally{ btn.disabled=false; }
  };
}
// 名前の似ている度合い（片方がもう片方を含む＝強い手がかり）
function similar(a,b){
  a=String(a); b=String(b);
  if(!a||!b) return 0;
  if(a===b) return 1;
  if(a.includes(b)||b.includes(a)) return .9;
  const s=new Set(a); let hit=0; for(const ch of new Set(b)) if(s.has(ch)) hit++;
  return hit/Math.max(s.size,1);
}

/* ============================================================
   仕入先（外注業者）とその単価
   ------------------------------------------------------------
   全体フロー §1-2 工程3。外注先は【受注後の手配】ではなく
   【見積を作る段階】で選んでいる、という 2026-09-05 の指摘に対応する入口。
   seek_price_lists は「お客様に出す単価」、こちらは「外注業者に払う施工単価」。

function drawSuppliers(el, q){

      <span class="small">単価の現物をもらえた外注先から入れていきます
      （いまは オパス＝区画線 の単価見積だけが現物としてあります）。</span></div>`;
    return;
  }
  const prices = M.supplierPrices||[];
  el.innerHTML = `

/* ============================================================
   原価のマスタ（機器の標準原価 ／ 工種ごとの直接原価単価）
   ------------------------------------------------------------
   現行Excelの「見積り」シート右側（売上原価計算）と、
   標準(MP)/(とめ)/(TG)/(新全) の4シートをデータ化したもの。
   ★村山さん専用。顧客別単価表と同じ扱い。

   工種ごとの原価単価は「実績の最頻値」＝初期値であって正解ではない。
   顧客別単価表と同じく confirmed_at を null で入れてあり、ここで確定してもらう。
   ============================================================ */
let costTab = 'wt';      // wt=工種の原価単価 / eq=機器の標準原価
let costFilter = 'todo'; // todo=未確定 / check=要確認 / done=確定済み / all=全部
let cRecentOnly = true;  // 既定で「直近1年で使うものだけ」

async function saveCostPrice(row, patch){
  const res = await fetch(SB_URL+'/rest/v1/seek_cost_prices?id=eq.'+encodeURIComponent(row.id),{
    method:'PATCH',
    headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify(patch)
  });
  if(!res.ok) throw new Error('保存できませんでした（'+res.status+'）'+(await res.text()).slice(0,120));
  const rows = await res.json();
  if(!rows.length) throw new Error('対象の行が見つかりませんでした');
  Object.assign(row, rows[0]);
  return row;
}

function drawCosts(el, q){
  const eq = (M.equipment||[]).filter(e=>!q || (e.name+' '+e.maker_group).includes(q));
  const cp = (M.costPrices||[]).filter(c=>!q || c.name.includes(q));
  if(!(M.equipment||[]).length && !(M.costPrices||[]).length){
    el.innerHTML = `<div class="note">原価のマスタがまだ入っていません。<br>
      <span class="small">DBに <code>_SEEK_02d_costs.sql</code> を流すと入ります。</span></div>`;
    return;
  }
  const seg = [['wt','工種ごとの原価単価 '+cp.length],['eq','機器の標準原価 '+eq.length]];
  el.innerHTML = `
  <div class="row" style="margin-bottom:12px">
    <div class="seg">${seg.map(([k,l])=>
      `<button data-ct="${k}" class="${costTab===k?'on':''}">${l}</button>`).join('')}</div>
    <span class="muted small">お客様に出す単価ではなく、<b>こちらの原価</b>です。

  const body = document.getElementById('costBody');
  costTab==='eq' ? drawEquip(body, eq) : drawCostPrices(body, cp);
}

function drawCostPrices(el, all0){
  // 直近1年で使っていない工種は後回しでよい（次に使うときに未確定と出る）
  const all   = cRecentOnly ? all0.filter(c=>usedRecently((c.name||'').trim())) : all0;
  const later = all0.filter(c=>!c.confirmed_at && !usedRecently((c.name||'').trim())).length;
  // 単価表と同じ仕分け。「過去がいつもこの原価」なら見比べる相手がいない＝迷う余地が無い。
  const same = c => Number(c.mode_count) >= Number(c.sample_count) && Number(c.sample_count) > 0;
  const share = c => { const n=Number(c.sample_count)||0; return n ? Number(c.mode_count)/n : 0; };
  const todo = all.filter(c=>!c.confirmed_at && c.is_stable);
  const check= all.filter(c=>!c.confirmed_at && !c.is_stable);
  const done = all.filter(c=>c.confirmed_at);
  const solid = all.filter(c=>!c.confirmed_at && same(c));
  const shaky = all.filter(c=>!c.confirmed_at && !same(c));
  const pick = (costFilter==='todo'?todo : costFilter==='check'?check : costFilter==='done'?done
              : costFilter==='solid'?solid : costFilter==='shaky'?shaky : all)
    .slice()
    // ばらついているものを見るときは、いちばん割れているものから
    .sort((a,b)=> (costFilter==='shaky'||costFilter==='check')
      ? (share(a)-share(b)) || (Number(b.sample_count)-Number(a.sample_count))
      : Number(b.sample_count)-Number(a.sample_count));
  el.innerHTML = `
  <div class="row" style="margin-bottom:10px">
    <div class="seg">
      ${[['todo','未確定 '+todo.length],['check','要確認 '+check.length],
         ['done','確定済み '+done.length],['all','すべて '+all.length]].map(([k,l])=>
        `<button data-cf="${k}" class="${costFilter===k?'on':''}">${l}</button>`).join('')}
    </div>
    <div class="seg">
      <button data-crec="1" class="${cRecentOnly?'on':''}">直近1年で使うもの</button>
      <button data-crec="0" class="${cRecentOnly?'':'on'}">古いものも</button>
    </div>
    <span class="muted small">見積りシートの「直接原価（単価）」の実績から、いちばん多かった金額を入れてあります。</span>
  </div>
  ${cRecentOnly && later ? `<div class="small muted" style="margin:-2px 0 8px">
    ほかに <b>${later}件</b> ありますが、<b>直近1年で1度も使っていない工種</b>なので後回しで構いません。</div>`:''}

  ${(solid.length || shaky.length) ? `<div class="note" style="margin-bottom:10px">
    <b>先に「いつもこの原価」だったものを片付けると早く終わります。</b><br>
    <span class="small">
      <b style="color:var(--ok)">${solid.length}件</b> … 過去の実績が<b>全部この原価</b>。ほぼ確認だけで済みます<br>
      <b style="color:var(--warn)">${shaky.length}件</b> … <b>ほかの金額も出ている</b>。1件ずつ見てほしいところです
      ${check.length?`（うち <b>${check.length}件</b> は<b>ばらつきが大きい</b>。Excelで機器代が混ざっている分）`:''}
    </span>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" data-cf="solid" ${solid.length?'':'disabled'}>
        「いつもこの原価」${solid.length}件 だけ表示</button>
      <button class="btn sm ghost" data-cf="shaky" ${shaky.length?'':'disabled'}>
        「ばらついている」${shaky.length}件 だけ表示</button>
      ${costFilter!=='all' ? `<button class="btn sm ghost" data-cf="all">全部を表示</button>`:''}
    </div>
  </div>`:''}
  ${costFilter==='check'?`<div class="note">
    <b>案件ごとに金額がばらついている工種です。</b>いちばん多かった金額を出していますが、
    そのまま使ってよいか分かりません。<b>直すか、確定にしてください。</b></div>`:''}
  <div class="scroll tall"><table>
    <thead><tr><th>工種</th><th>単位</th><th class="n">直接原価（単価）</th>
      <th>過去の実績</th><th></th></tr></thead>
    <tbody>${pick.slice(0,400).map(c=>`<tr>
      <td>${esc(c.name)}</td>
      <td class="small">${esc(c.unit||'')}</td>
      <td class="n"><input data-cost="${esc(c.id)}" value="${Number(c.cost_unit)}"
        style="width:110px;text-align:right"></td>
      <td class="small">${(()=>{
        // 単価表と同じ見せ方に揃える。「108件」だけでは判断できない。
        const n=Number(c.sample_count)||0, m=Number(c.mode_count)||0, v=Number(c.variant_count)||0;
        if(!n) return '<span class="muted">実績なし</span>';
        if(m>=n) return `<span style="color:var(--ok);font-weight:700">${n}件すべてこの原価</span>`;
        return `<span style="color:var(--warn);font-weight:700">${n}件中 ${m}件</span>`
             + `<span class="muted">（${v}通りの金額が出ている）</span>`;
      })()}</td>
      <td style="white-space:nowrap">${c.confirmed_at
        ? `<span class="muted small">${esc(String(c.confirmed_at).slice(0,10))} 確定</span>
           <button class="btn ghost sm" data-cundo="${esc(c.id)}">戻す</button>`
        : `<button class="btn ghost sm" data-cok="${esc(c.id)}">これでOK</button>`}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="muted">該当なし</td></tr>'}</tbody></table></div>
  ${pick.length>400?`<div class="muted small">表示は先頭400件です（該当 ${pick.length}件）</div>`:''}
  <div class="small muted" style="margin-top:8px">
    人工は工種ではなく設定に入れています ―
    <b>15,000円/人日</b>（実データ487件中472件が15,000の倍数。半日を含めると100%）。<br>
    ⚠ Excelの備考「N人M日」は金額と合っていないので使っていません（一致59件／不一致365件）。</div>`;

  el.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{ costFilter=b.dataset.cf; drawMaster(); });
  el.querySelectorAll('[data-crec]').forEach(b=>b.onclick=()=>{ cRecentOnly=b.dataset.crec==='1'; drawMaster(); });
  el.querySelectorAll('[data-cost]').forEach(inp=>inp.onchange=async()=>{
    const row=(M.costPrices||[]).find(x=>x.id===inp.dataset.cost); if(!row) return;
    const v=numIn(inp.value); if(!Number.isFinite(v)||v<0){ inp.value=Number(row.cost_unit); return; }
    inp.disabled=true;
    try{ await saveCostPrice(row,{cost_unit:v, source:'手入力', updated_at:new Date().toISOString()}); setBar('原価を直しました'); }
    catch(e){ alert(e.message); inp.value=Number(row.cost_unit); }
    inp.disabled=false;
  });
  el.querySelectorAll('[data-cok]').forEach(b=>b.onclick=async()=>{
    const row=(M.costPrices||[]).find(x=>x.id===b.dataset.cok); if(!row) return;
    b.disabled=true;
    try{ await saveCostPrice(row,{confirmed_at:new Date().toISOString()}); drawMaster(); refreshMasterHead(); }
    catch(e){ alert(e.message); b.disabled=false; }
  });
  el.querySelectorAll('[data-cundo]').forEach(b=>b.onclick=async()=>{
    const row=(M.costPrices||[]).find(x=>x.id===b.dataset.cundo); if(!row) return;
    b.disabled=true;
    try{ await saveCostPrice(row,{confirmed_at:null}); drawMaster(); refreshMasterHead(); }
    catch(e){ alert(e.message); b.disabled=false; }
  });
}

function drawMaster(){
  const el=document.getElementById('mres'); if(!el) return;
  const q=mQ.trim();
  // 「直近1年で使ったか」は明細から出す。ダッシュボードを開かずにマスタへ来た場合、
  // まだ読んでいないので一度だけ読んで描き直す（読むまでは全件を出す＝少なく見せない）。
  if(!lastUse){
    loadCosts().then(()=>{ recentClientSet=null; drawMaster(); refreshMasterHead(); }).catch(()=>{});
  }
  if(mTab==='price'){
    drawPrices(el, q);
  } else if(mTab==='wt'){
    const rows=M.wts.filter(w=>!q||w.name.includes(q));
    el.innerHTML=`<div class="row"><b>${rows.length}種</b></div>
      <div class="scroll tall"><table><thead><tr><th>工種</th><th>分類</th><th>既定の単位</th>
      <th class="n">実績</th></tr></thead><tbody>
      ${rows.slice(0,600).map(w=>`<tr><td>${esc(w.name)}</td><td>${esc(w.category||'')}</td>
        <td>${esc(w.default_unit||'')}</td><td class="n">${w.sample_count}</td></tr>`).join('')}</tbody></table></div>`;
  } else if(mTab==='cost'){
    drawCosts(el, q);
  } else if(mTab==='gas'){
    drawGasSetup(el);
  } else if(mTab==='user'){
    drawUsers(el);
  } else if(mTab==='sup'){
    drawSuppliers(el, q);
  } else if(mTab==='client'){
    drawClients(el, q);
  } else {
    el.innerHTML=`<div class="scroll"><table><thead><tr><th>銀行</th><th>支店</th><th>種別</th><th>口座番号</th>
      <th>名義</th><th>既定</th></tr></thead><tbody>
      ${M.banks.map(b=>`<tr><td>${esc(b.bank_name)}</td><td>${esc(b.branch_name||'')}</td>
        <td>${esc(b.account_type||'')}</td><td>${esc(b.account_no||'')}</td><td>${esc(b.holder||'')}</td>
        <td>${b.is_default?'<span class="tag b">既定</span>':''}</td></tr>`).join('')}</tbody></table></div>`;
  }
}

/* ============================================================
   起動
   ============================================================ */
const gate=document.getElementById('gate');
function showGate(msg){
  gate.classList.remove('hidden');
  document.getElementById('shell').classList.add('hidden');
  document.getElementById('bar').classList.add('hidden');
  if(msg) document.getElementById('gMsg').innerHTML = `<div class="err">${esc(msg)}</div>`;
  if(!SB_URL||!SB_KEY) document.getElementById('gateCfg').classList.remove('hidden');
  const c=(()=>{ try{ return JSON.parse(localStorage.getItem(LS.cfg)||'null'); }catch(e){ return null; } })();
  if(c){ document.getElementById('gUrl').value=c.url||''; document.getElementById('gKey').value=c.key||''; }
}
function showApp(){
  gate.classList.add('hidden');
  ['shell','bar'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
  const s=sbSession();
  document.getElementById('who').textContent = s? s.email : '';
}
document.getElementById('gCfgBtn').onclick=()=>document.getElementById('gateCfg').classList.toggle('hidden');
document.getElementById('gBtn').onclick=async()=>{
  const u=document.getElementById('gUrl').value.trim(), k=document.getElementById('gKey').value.trim();
  if(u&&k){ SB_URL=u.replace(/\/+$/,''); SB_KEY=k;
    try{ localStorage.setItem(LS.cfg, JSON.stringify({url:SB_URL,key:SB_KEY})); }catch(e){} }
  if(!SB_URL||!SB_KEY){ document.getElementById('gMsg').innerHTML='<div class="err">'
      +'<b>先に接続先を入れてください。</b>下の「Supabase Project URL」と「publishable key」の2つです。'
      +'</div>';
    document.getElementById('gateCfg').classList.remove('hidden'); return; }
  const btn=document.getElementById('gBtn'); btn.disabled=true; btn.textContent='ログイン中…';
  try{
    await sbLogin(document.getElementById('gMail').value.trim(), document.getElementById('gPw').value);
    document.getElementById('gPw').value='';    // パスワードは画面にもコードにも残さない
    await boot();
  }catch(e){
    document.getElementById('gMsg').innerHTML=`<div class="err">${esc(e.message)}</div>`;
  }finally{ btn.disabled=false; btn.textContent='ログイン'; }
};
async function boot(){
  try{
    await loadAll();
    resetMake();          // 既定の振込先・見積日はマスタを読んでから決める
    showApp();
    render();
  }catch(e){
    showGate(e.message);
  }
}
(async ()=>{
  if(SB_URL && SB_KEY && sbSession() && await sbToken()) await boot();
  else showGate();
})();
</script>
