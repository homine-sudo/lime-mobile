<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEEK 見積〜請求</title>
<style>
/* ============================================================
   SEEK DENSO — デザイントークン
   ------------------------------------------------------------
   考え方: 赤（ブランド色）を画面全体に使うと"パンフレット"に見える。
   業務システムらしさは「色数が少ない・地が冷たいグレー・
   操作色と警告色が分かれている」ことから来る。

     --brand … ロゴと識別だけ。面には使わない
     --pri   … 操作の色（ボタン・選択中・リンク・グラフの主系列）＝ 藍
     --danger… 本当に危ないときだけ（赤）
   ============================================================ */
:root{
  /* ブランド（識別のみ） */
  --brand:#b31b26; --brand-2:#d8323e; --brand-dark:#8e141d;
  --brand-soft:#fdecee; --brand-line:#f2ccd0;

  /* 操作色 */
  --pri:#1c5fa8; --pri-2:#2f7fd0; --pri-dark:#164a83;
  --pri-soft:#eef4fb; --pri-line:#c6dcf2;

  /* 地と文字（冷たいグレー） */
  --bg:#f2f4f7; --panel:#fff; --panel-2:#f8fafc; --line:#dfe4ea; --line-soft:#eef1f5;
  --ink:#141a21; --ink-2:#3b4550; --muted:#6b7683;

  /* サイドバー（濃紺グレー） */
  --nav-bg:#141b24; --nav-bg-2:#1b2430; --nav-ink:#c7d0da; --nav-ink-2:#8794a3;
  --nav-line:#242f3c;

  --charcoal:#5a6673;
  --accent:#1c5fa8; --accent-soft:#eef4fb;
  --warn:#8a5a00; --warn-soft:#fdf6e7; --warn-line:#ecdcb2;
  --danger:#b3261e; --danger-soft:#fdeeed; --danger-line:#f0c9c6;
  --ok:#0f6b4a; --ok-soft:#eaf5f0; --ok-line:#c2e0d3;

  --r-xs:6px; --r-sm:8px; --r:11px; --r-lg:14px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(20,28,40,.05);
  --sh-2:0 4px 14px -4px rgba(20,28,40,.12), 0 2px 5px -2px rgba(20,28,40,.05);
  --sh-3:0 24px 48px -12px rgba(20,28,40,.26);
  --ring:0 0 0 3px rgba(28,95,168,.18);
  --side:232px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand:#e8636d; --brand-2:#ff7d86; --brand-dark:#b31b26;
    --brand-soft:#2b1518; --brand-line:#54242a;

    --pri:#5aa2f0; --pri-2:#7cb8f7; --pri-dark:#2f7fd0;
    --pri-soft:#12243a; --pri-line:#1f3d5e;

    --bg:#0d1117; --panel:#151b23; --panel-2:#1a212b; --line:#252d38; --line-soft:#1d242d;
    --ink:#e6eaf0; --ink-2:#b4bdc9; --muted:#8792a1;

    --nav-bg:#0b0f15; --nav-bg-2:#141b24; --nav-ink:#c1cbd7; --nav-ink-2:#7d8a99;
    --nav-line:#1c242e;

    --charcoal:#7e8b99;
    --accent:#5aa2f0; --accent-soft:#12243a;
    --warn:#e0a53a; --warn-soft:#2a2313; --warn-line:#473a1a;
    --danger:#f0736a; --danger-soft:#2c1614; --danger-line:#552a26;
    --ok:#3fbd85; --ok-soft:#0f2a20; --ok-line:#1d4635;

    --sh-1:0 1px 2px rgba(0,0,0,.35);
    --sh-2:0 8px 20px -6px rgba(0,0,0,.55);
    --sh-3:0 28px 56px -14px rgba(0,0,0,.7);
    --ring:0 0 0 3px rgba(90,162,240,.25);
  }
}
*{box-sizing:border-box}
::selection{background:var(--pri-soft);color:var(--pri)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Inter","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:14px;line-height:1.65;
  font-feature-settings:"palt" 1;
  -webkit-font-smoothing:antialiased}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-xs)}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ---------- アプリの骨格（左にナビ・右に内容） ---------- */
/* サイドバーは position:fixed。
   sticky + height:100vh にすると、スクロール時に画面全体が描画されなくなる環境があった
   （実機で確認。合成レイヤが大きくなりすぎるのが原因と思われる）。 */
.app{display:block;min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);overflow-y:auto;
  background:var(--nav-bg);border-right:1px solid var(--nav-line);
  display:flex;flex-direction:column;padding:18px 12px 14px;gap:6px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 16px;margin-bottom:2px;
  border-bottom:1px solid var(--nav-line)}
/* ロゴは白地の正方形なので、濃紺のサイドバーではタイルとして置く */
.brand img{height:30px;width:30px;display:block;flex-shrink:0;
  background:#fff;border-radius:7px;padding:2px;object-fit:contain}
.brand .mark{font-size:15px;font-weight:800;letter-spacing:.11em;color:#fff;white-space:nowrap}
.brand .mark b{color:var(--brand-2);font-weight:900}
.brand .sysname{font-size:10.5px;color:var(--nav-ink-2);letter-spacing:.06em;margin-top:2px}
nav{display:flex;flex-direction:column;gap:2px;margin-top:10px}
nav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;padding:9px 11px;border-radius:var(--r-sm);cursor:pointer;
  color:var(--nav-ink);font:inherit;font-size:13.5px;font-weight:600;
  transition:background .16s var(--ease),color .16s var(--ease)}
nav button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
nav button:hover{background:var(--nav-bg-2);color:#fff}
nav button.on{background:var(--nav-bg-2);color:#fff}
nav button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--brand-2)}
nav button.on svg{opacity:1;color:var(--pri-2)}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--nav-line);
  display:flex;flex-direction:column;gap:8px}
.side-foot .who{font-size:11.5px;color:var(--nav-ink-2);word-break:break-all;line-height:1.45}
.side-foot .ver{font-size:10px;color:var(--nav-ink-2);opacity:.6;letter-spacing:.04em}
.side-foot .btn.ghost{background:transparent;border-color:var(--nav-line);color:var(--nav-ink)}
.side-foot .btn.ghost:hover{background:var(--nav-bg-2);color:#fff;border-color:var(--nav-ink-2)}
.content{min-width:0;margin-left:var(--side);display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:14px 26px;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.topbar h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.01em}
.topbar .crumb{font-size:11.5px;color:var(--muted);letter-spacing:.05em;margin-bottom:1px}
@media(max-width:900px){
  .content{margin-left:0}
  .side{position:static;width:auto;height:auto;overflow:visible;
    flex-direction:row;align-items:center;flex-wrap:wrap;
    border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  .brand{border-bottom:0;padding:0 12px 0 0;margin:0}
  /* 横並びのときはボタンを内容幅に。width:100% のままだと1つずつ折り返してしまう */
  nav{flex-direction:row;flex-wrap:nowrap;margin:0;gap:2px;overflow-x:auto;flex:1;min-width:0}
  nav button{width:auto;white-space:nowrap;padding:8px 12px}
  .side-foot{margin-left:auto;flex-direction:row;align-items:center;border-top:0;padding-top:0;gap:10px}
  .side-foot .who,.side-foot .ver{display:none}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:16px}
}

/* ---- ダッシュボード ---- */
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:13px;margin-bottom:18px}
.big .b{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 19px;box-shadow:var(--sh-1);position:relative;overflow:hidden;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.big .b::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--pri),var(--pri-2))}
.big .b.warn::before{background:linear-gradient(180deg,var(--warn),#d19a2e)}
.big .b:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.big .b .v{font-size:29px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.15}
.big .b .v em{font-style:normal;font-size:13px;font-weight:700;color:var(--muted);margin-left:4px;letter-spacing:0}
.big .b .l{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.03em;font-weight:600}
.big .b .s{font-size:11px;color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px solid var(--line-soft);line-height:1.6}
.chartwrap{overflow-x:auto;padding-bottom:2px}
.bars{display:flex;align-items:flex-end;gap:10px;height:178px;padding-top:8px;min-width:540px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:36px}
.bars .stack{width:100%;max-width:38px;display:flex;flex-direction:column;justify-content:flex-end;
  border-radius:5px 5px 2px 2px;overflow:hidden;transition:filter .16s var(--ease),transform .16s var(--ease)}
.bars .col:hover .stack{filter:brightness(1.12);transform:scaleY(1.02);transform-origin:bottom}
.bars .p{background:linear-gradient(180deg,var(--pri-2),var(--pri))}
.bars .c{background:var(--charcoal);opacity:.5}
.bars .lb{font-size:10px;color:var(--muted);white-space:nowrap}
.bars .vl{font-size:10.5px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.rank{width:100%} .rank td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.rank .barcell{width:34%}
.rank .bar{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pri-2));min-width:3px;
  transition:width .4s var(--ease)}
.rank .bar.alt{background:var(--charcoal);opacity:.45}
.legend2{display:flex;gap:18px;font-size:11px;color:var(--muted);margin-top:12px;flex-wrap:wrap;align-items:center}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}

/* 全体工程表 */
/* 予定表（ダッシュボード先頭） */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid .cw{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:2px 0}
.calgrid .cw.sun{color:var(--danger)} .calgrid .cw.sat{color:var(--pri)}
.cday{min-height:56px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:4px 5px;text-align:left;
  font:inherit;color:inherit;cursor:pointer}
.cday:disabled{cursor:default;background:var(--panel-2);opacity:.85}
.cday.off{border:none;background:none}
.cday .dn{font-size:12px;font-weight:700;color:var(--ink-2)}
.cday.sun .dn{color:var(--danger)} .cday.sat .dn{color:var(--pri)}
.cday.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cday.today .dn{color:var(--brand);font-weight:900}
.cday.pick{background:var(--pri-soft);border-color:var(--pri)}
.cday .ds{display:flex;flex-wrap:wrap;gap:3px;font-size:12px;font-style:normal;line-height:1.2}
.cday .ds i{font-style:normal;font-size:11px;font-weight:800}
.callegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.callegend i{font-style:normal;margin-right:3px}
.pipe{display:flex;align-items:stretch;gap:5px;overflow-x:auto;padding:6px 2px 4px}
.pipe .stg{flex:1;min-width:104px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px 13px 10px;cursor:pointer;
  transition:transform .16s var(--ease),box-shadow .16s var(--ease),border-color .16s var(--ease)}
.pipe .stg:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--pri-line)}
.pipe .stg.off{opacity:.4;cursor:default}
.pipe .stg.off:hover{transform:none;box-shadow:none;border-color:var(--line)}
.pipe .nm{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.03em;font-weight:600}
.pipe .ct{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25;letter-spacing:-.02em}
.pipe .ct span{font-size:11px;font-weight:700;color:var(--muted);margin-left:3px;letter-spacing:0}
.pipe .am{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pipe .ind{margin-top:9px;height:44px;display:flex;align-items:flex-end}
.pipe .ind div{width:100%;background:linear-gradient(180deg,var(--pri-2),var(--pri));border-radius:3px;
  transition:height .4s var(--ease)}
.pipe .arw{display:flex;align-items:center;color:var(--line);font-size:18px;font-weight:700;user-select:none}
.spacer{flex:1}
main{padding:22px 26px 84px;max-width:1320px;width:100%}
@media(max-width:900px){ main{padding:16px 16px 84px} }

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh-1)}
.card h2{font-size:12px;margin:0 0 14px;color:var(--muted);font-weight:700;
  letter-spacing:.09em;text-transform:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh-1)}
.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
.kpi .s{font-size:11px;color:var(--muted);margin-top:6px}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;letter-spacing:.05em;
  position:sticky;top:0;z-index:2;background:var(--panel);
  border-bottom:1px solid var(--line);padding-top:8px;padding-bottom:8px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{transition:background .12s var(--ease)}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--pri-soft)}
.scroll{overflow-x:auto;border-radius:var(--r-sm)}
.tall{max-height:58vh;overflow:auto}
/* タブに出す「残り何件」。数が多いほど目に入るように、色は控えめだが太字にする */
.seg button .tabn{display:inline-block;margin-left:5px;padding:0 5px;border-radius:8px;
  background:var(--pri);color:#fff;font-size:10px;font-weight:700;line-height:15px;
  font-variant-numeric:tabular-nums}
.seg button.on .tabn{background:#fff;color:var(--pri)}

input,select,textarea{font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:var(--panel);color:var(--ink);max-width:100%;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:var(--ring)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--pri);cursor:pointer}
input[type=file]{padding:6px 9px;font-size:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.row{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end}

button.btn{background:var(--pri);color:#fff;border:0;border-radius:var(--r-sm);
  padding:9px 17px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;letter-spacing:.02em;
  box-shadow:0 1px 2px rgba(28,95,168,.25);
  transition:transform .12s var(--ease),filter .16s var(--ease),box-shadow .16s var(--ease)}
button.btn:hover{filter:brightness(1.08);box-shadow:0 3px 10px rgba(28,95,168,.28)}
button.btn:active{transform:translateY(1px);box-shadow:none}
button.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none;transform:none}
button.btn.ghost{background:var(--panel);color:var(--ink-2);border:1px solid var(--line);
  font-weight:600;box-shadow:none}
button.btn.ghost:hover{background:var(--panel-2);border-color:var(--muted);filter:none;box-shadow:none;color:var(--ink)}
button.btn.sm{padding:6px 12px;font-size:12px;border-radius:var(--r-xs)}

/* 区分けボタン（未確定／確定済み など） */
.seg{display:inline-flex;background:var(--line-soft);border:1px solid var(--line);
  border-radius:var(--r-pill);padding:3px;gap:2px}
.seg button{background:none;border:0;padding:5px 13px;border-radius:var(--r-pill);cursor:pointer;
  font:inherit;font-size:12px;font-weight:600;color:var(--muted);
  transition:background .16s var(--ease),color .16s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--pri);box-shadow:var(--sh-1)}

.tag{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;
  letter-spacing:.02em;line-height:1.5;border:1px solid transparent}
.tag.q{background:var(--pri-soft);color:var(--pri);border-color:var(--pri-line)}
.tag.b{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.tag.w{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.muted{color:var(--muted)} .small{font-size:12px}
.note,.err,.ok{padding:11px 15px;border-radius:var(--r-sm);font-size:12.5px;margin:12px 0;
  border:1px solid transparent;line-height:1.7}
.note{background:var(--warn-soft);border-color:var(--warn-line);color:var(--ink)}
.err{background:var(--danger-soft);border-color:var(--danger-line);color:var(--ink)}
.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ink)}
.note b,.err b{color:var(--ink)}
.mask{color:var(--muted);font-style:normal;font-size:11px;opacity:.7}
.pill{display:inline-block;border:1px solid var(--line);border-radius:var(--r-pill);
  padding:2px 9px;font-size:11px;color:var(--muted);margin-right:5px;background:var(--panel-2)}

/* 進捗バー */
.prog{height:7px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri-2));
  border-radius:99px;transition:width .4s var(--ease)}
.ptot{margin-left:auto;width:280px;margin-top:12px}
.ptot div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.ptot div.g{font-weight:700;font-size:14px;border-bottom:2px solid var(--ink);border-top:1px solid var(--ink)}

/* 合計と粗利を横に並べる。
   村山さんがいちばん見たいのは粗利率なのに、縦に積むと画面の外（1,400px下）へ行ってしまう。
   狭い画面では縦に落として、粗利を先に出す。 */
.totwrap{display:flex;gap:18px;align-items:flex-start;justify-content:flex-end;
  margin-top:12px;flex-wrap:wrap}
.totwrap .ptot{margin-top:0}
.profit{width:340px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
  background:var(--bg)}
.profit .phead{font-weight:700;font-size:13px;margin-bottom:8px}
.profit .bigrate{display:flex;align-items:baseline;gap:10px}
.profit .bigrate .num{font-size:34px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums}
.profit .bigrate .num small{font-size:16px;font-weight:700;margin-left:2px}
.profit .bigrate .lbl{font-size:11px;line-height:1.4;color:var(--charcoal)}
@media (max-width:1100px){

<!-- 見積依頼メールの自動取込に使う Google Apps Script のテンプレート。
     マスタ →「メール取込」から丸ごとコピーして script.google.com に貼る。
     type="text/plain" なのでブラウザは実行しない。 -->
<script type="text/plain" id="gasTpl">
/**
 * SEEK 見積依頼メールの自動取込
 * Gmail のラベル → ここ → Supabase (seek_inbox / Storage)
 *
 * 作成 2026-09-05 ／ 設計: Phase2設計相談_メール自動取込_2026-09-05.md
 *
 * ■ この GAS がやること
 *   ラベルの付いたメールを読んで Supabase に入れ、「取込済」ラベルを付ける。それだけ。
 *   判断（見積依頼かどうか・どの顧客か）はしない。SEEK.html 側でやる。
 *
 * ■ 公開しない
 *   doGet / doPost を作っていない。トリガーで動くだけなので公開URLが存在しない。
 *   （GAS は doGet/doPost でリクエストヘッダを読めず、リファラで守れないため。
 *     穴を作らないことで回避している）
 *
 * ■ Gmail の権限
 *   読み取りとラベル付けだけ。送信も削除もしない。
 *
 * ────────────────────────────────────────────────
 * ■ 設置手順
 *  1) script.google.com で新しいプロジェクトを作り、このファイルを丸ごと貼る
 *  2) プロジェクトの設定 → スクリプト プロパティ に3つ登録する
 *       SB_URL       https://xxxxx.supabase.co
 *       SB_KEY       service_role キー   ★ここにしか置かない。SEEK.html には絶対に書かない
 *       SEEK_LABEL   見積依頼            （省略時は「見積依頼」）
 *  3) Gmail でラベル「見積依頼」を作り、フィルタで自動的に付くようにする
 *     （例: 差出人が取引先ドメイン、または件名に「見積」を含む）
 *  4) この画面で run_once を1回実行して、Gmail へのアクセスを承認する
 *  5) トリガー → 時間主導 → 分ベース → 5分おき → 関数 pullMail
 * ────────────────────────────────────────────────
 */

var DONE_LABEL = 'SEEK取込済';
var MAX_PER_RUN = 10;                 // GAS の実行時間は1回6分。詰まらせない
var MAX_ATTACH  = 20 * 1024 * 1024;   // 1ファイル20MBまで
// 実物のメールで来たもの: 図面PDF / 現地写真のzip（2026-09-04 の2通で確認）
var OK_MIME = /^(application\/pdf|image\/(png|jpe?g|heic|gif)|application\/(zip|x-zip-compressed)|application\/vnd\.(openxmlformats|ms-excel))/i;

function prop_(k, def) {
  var v = PropertiesService.getScriptProperties().getProperty(k);
  return (v === null || v === '') ? def : v;
}

/** 手で1回動かして承認する用。取り込みはせず、何件見つかるかだけ出す */
function run_once() {
  var label = prop_('SEEK_LABEL', '見積依頼');
  var q = 'label:' + label + ' -label:' + DONE_LABEL + ' newer_than:7d';
  var threads = GmailApp.search(q, 0, 20);
  Logger.log('検索: ' + q);
  Logger.log('見つかったスレッド: ' + threads.length);
  Logger.log('SB_URL: ' + (prop_('SB_URL', '') ? '設定あり' : '★未設定'));
  Logger.log('SB_KEY: ' + (prop_('SB_KEY', '') ? '設定あり' : '★未設定'));
}

/** 5分おきのトリガーから呼ぶ本体 */
function pullMail() {
  var sbUrl = prop_('SB_URL', ''), sbKey = prop_('SB_KEY', '');
  if (!sbUrl || !sbKey) { Logger.log('SB_URL / SB_KEY が未設定です'); return; }

  var label = prop_('SEEK_LABEL', '見積依頼');
  var done  = GmailApp.getUserLabelByName(DONE_LABEL) || GmailApp.createLabel(DONE_LABEL);
  var threads = GmailApp.search('label:' + label + ' -label:' + DONE_LABEL + ' newer_than:30d', 0, MAX_PER_RUN);

  var ok = 0, ng = 0;
  for (var i = 0; i < threads.length; i++) {
    var th = threads[i];
    var msgs = th.getMessages();
    var allOk = true;
    for (var m = 0; m < msgs.length; m++) {
      try { if (!pushOne_(sbUrl, sbKey, th, msgs[m])) allOk = false; }
      catch (e) { allOk = false; ng++; Logger.log('失敗: ' + msgs[m].getSubject() + ' / ' + e); }
    }
    // 全部入ったスレッドにだけ「取込済」を付ける。
    // 付けなければ次回また拾う＝取りこぼさない
    if (allOk) { th.addLabel(done); ok++; }
  }
  Logger.log('取込 ' + ok + 'スレッド / 失敗 ' + ng + '件');
}

function pushOne_(sbUrl, sbKey, thread, msg) {
  var msgId = msg.getId();
  var id = 'in-' + msgId;

  // すでに入っていれば何もしない（ラベル付けだけ失敗した前回の残り）
  var chk = UrlFetchApp.fetch(
    sbUrl + '/rest/v1/seek_inbox?select=id&gmail_msg_id=eq.' + encodeURIComponent(msgId),
    { method: 'get', headers: hdr_(sbKey), muteHttpExceptions: true });
  if (chk.getResponseCode() === 200 && JSON.parse(chk.getContentText()).length) return true;

  // ---- 本文。プレーンが無ければHTMLを改行を残して落とす ----
  var body = msg.getPlainBody();
  if (!body || !body.replace(/\s/g, '')) body = htmlToText_(msg.getBody());

  // ---- 差出人 "山城 將平 <yamashiro@dh-parking.co.jp>" を分ける ----
  var from = msg.getFrom(), fname = from, fmail = '';
  var fm = from.match(/^\s*"?(.*?)"?\s*<([^>]+)>\s*$/);
  if (fm) { fname = fm[1].trim(); fmail = fm[2].trim(); }
  else if (from.indexOf('@') >= 0) { fname = ''; fmail = from.trim(); }

  // ---- 添付を Storage へ ----
  var atts = [], list = msg.getAttachments({ includeInlineImages: false });
  for (var a = 0; a < list.length; a++) {
    var f = list[a];
    if (f.getSize() > MAX_ATTACH) { Logger.log('大きすぎるので飛ばす: ' + f.getName()); continue; }
    if (!OK_MIME.test(f.getContentType() || '')) { Logger.log('対象外: ' + f.getName() + ' ' + f.getContentType()); continue; }
    var ext = (f.getName().match(/\.[A-Za-z0-9]{1,8}$/) || [''])[0].toLowerCase();
    // 日本語のファイル名をパスに使うと事故るので、キーは安全な文字だけ。元の名前は DB に持つ
    var key = 'inbox/' + id + '/a' + a + ext;
    var up = UrlFetchApp.fetch(sbUrl + '/storage/v1/object/seek-files/' + key, {
      method: 'post',
      contentType: f.getContentType() || 'application/octet-stream',
      payload: f.getBytes(),
      headers: { Authorization: 'Bearer ' + sbKey, 'x-upsert': 'true' },
      muteHttpExceptions: true
    });
    if (up.getResponseCode() >= 300) throw new Error('添付の保存に失敗 ' + up.getResponseCode() + ' ' + up.getContentText().slice(0, 200));
    atts.push({ name: f.getName(), mime: f.getContentType(), size: f.getSize(), storage_path: key });
  }

  // ---- 行を入れる ----
  var row = {
    id: id, org_id: 'seek',
    gmail_msg_id: msgId, thread_id: thread.getId(),
    received_at: msg.getDate().toISOString(),
    from_name: fname, from_email: fmail,
    subject: msg.getSubject() || '(件名なし)',
    // 件名を本文の1行目に置く。SEEK 側の読み取りは1行目を件名として扱うため
    body: (msg.getSubject() || '') + '\n' + body,
    attachments: atts, status: '未処理',
    data: { gmail_link: 'https://mail.google.com/mail/u/0/#inbox/' + thread.getId() }
  };
  var ins = UrlFetchApp.fetch(sbUrl + '/rest/v1/seek_inbox?on_conflict=id', {
    method: 'post', contentType: 'application/json',
    headers: hdr_(sbKey, 'resolution=merge-duplicates'),
    payload: JSON.stringify([row]), muteHttpExceptions: true
  });
  if (ins.getResponseCode() >= 300) {
    // 行が作れなかったら、置いた添付を消して元に戻す
    for (var k = 0; k < atts.length; k++) {
      try {
        UrlFetchApp.fetch(sbUrl + '/storage/v1/object/seek-files/' + atts[k].storage_path,
          { method: 'delete', headers: { Authorization: 'Bearer ' + sbKey }, muteHttpExceptions: true });
      } catch (e) {}
    }
    throw new Error('行の登録に失敗 ' + ins.getResponseCode() + ' ' + ins.getContentText().slice(0, 200));
  }
  return true;
}

function hdr_(key, prefer) {
  var h = { Authorization: 'Bearer ' + key, apikey: key };
  if (prefer) h.Prefer = prefer;
  return h;
}

/**
 * HTMLメールをテキストに。
 * ⚠ タグを落とすだけだと箇条書きの改行が消えて、SEEK 側の「1行ずつ読む」処理が効かなくなる。
 *   だからブロックの終わりを先に改行へ置き換える。
 */
function htmlToText_(html) {
  if (!html) return '';
  return String(html)
    .replace(/<(script|style)[^]*?<\/\1>/gi, '')
    .replace(/<br\s*\/?>/gi, '\n')
    // 表のセットはタブで区切る。入れないと「精算機設置工事1台」のように
    // 品名と数量がくっついて、数量が取れなくなる（2026-09-08 の点検で確認）
    .replace(/<\/(td|th)\s*>/gi, '\t')
    .replace(/<\/(p|div|li|tr|h[1-6])\s*>/gi, '\n')
    .replace(/<li[^>]*>/gi, '・')
    .replace(/<[^>]+>/g, '')
    .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/[ \t]+\n/g, '\n')
    .trim();
}
</script>

<script>
"use strict";
const APP_VERSION = 'SEEK-2026-09-01';
document.getElementById('verLabel').textContent = ' ' + APP_VERSION;

// 同じフォルダに seek_logo.png（SDマーク・正方形）を置くと、社名の左に出る。無ければ何も起きない。
// マークだけに差し替えてしまうと「見積〜請求 管理」が消えて何の画面か分からなくなるので、
// 文字は残して横に並べる。
(function(){
  const img = document.getElementById('logo');
  img.onload  = () => { img.hidden = false; };
  img.onerror = () => { img.remove(); };
})();

/* ============================================================
   接続設定
   publishable key は公開前提で安全（RLS でログイン必須にしている）。
   service_role キーはここにも他のどこにも置かない。
   プロジェクト作成前は空にしておき、ゲートの「接続先を設定」で入れる。
   ============================================================ */
/* 接続先の初期値。
   publishable key は「ブラウザに置いてよい鍵」として作られたもの（RLSでログイン必須にしている）。
   ここに書いておかないと、村山さんのPCやスマホで開くたびに URL と鍵を手で入れることになる。
   ★ Secret key（sb_secret_…）は絶対にここに書かない。あれは Edge Function の中だけ。 */
let SB_URL = 'https://qoblozsjcbtviviucubr.supabase.co';
let SB_KEY = 'sb_publishable_HAb_HlThhc4M8Vx2U9zwNQ_xhs6R1ta';
const LS = { cfg:'seek_sbCfg', session:'seek_sbSession', log:'seek_sbLog' };
try{
  const c = JSON.parse(localStorage.getItem(LS.cfg)||'null');
  if(c && c.url && c.key){ SB_URL=c.url; SB_KEY=c.key; }
}catch(e){}

function sbLog(entry){
  try{
    const log = JSON.parse(localStorage.getItem(LS.log)||'[]');
    // ローカル時刻で持つ（素の toISOString は9時間ずれて観察時に混乱する）
    log.push(Object.assign({t:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,19)}, entry));
    while(log.length>80) log.shift();
    localStorage.setItem(LS.log, JSON.stringify(log));
  }catch(e){}
}
function sbSession(){ try{ return JSON.parse(localStorage.getItem(LS.session)||'null'); }catch(e){ return null; } }
function sbSetSession(s){ try{ s? localStorage.setItem(LS.session,JSON.stringify(s)) : localStorage.removeItem(LS.session); }catch(e){} }

async function sbLogin(email, pw){
  const res = await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
    method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email, password:pw})
  });
  const j = await res.json().catch(()=>({}));
  if(!res.ok || !j.access_token){
    // 401 は「メール/パスワードが違う」ではなく「接続先のキーが届いていない」ことが多い。
    // 実物で確認: パスワード違い→400 invalid_credentials ／ キー無し→401 No API key found
    if(res.status===401){
      throw new Error('接続先のキーが正しくありません。「接続先を設定」を開いて、'
        + 'Supabase の URL と publishable key を入れ直してください。'
        + (j.message? '（サーバーの返答: '+j.message+'）' : ''));
    }
    if(j.error_code==='invalid_credentials' || /Invalid login credentials/i.test(j.msg||'')){
      throw new Error('メールアドレスかパスワードが違います。');
    }
    throw new Error(j.error_description || j.msg || j.message || ('ログインできませんでした（'+res.status+'）'));
  }
  sbSetSession({access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at: Math.floor(Date.now()/1000)+(Number(j.expires_in)||3600),
    email:(j.user&&j.user.email)||email});
  sbLog({login:1});
  return true;
}
function sbLogout(){ sbSetSession(null); sbLog({logout:1}); location.reload(); }

async function sbToken(){
  const s = sbSession(); if(!s) return null;
  if((s.expires_at||0) - Math.floor(Date.now()/1000) > 120) return s.access_token;
  try{
    const res = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token:s.refresh_token})
    });
    const j = await res.json().catch(()=>({}));
    if(res.ok && j.access_token){
      sbSetSession({access_token:j.access_token, refresh_token:j.refresh_token||s.refresh_token,
        expires_at: Math.floor(Date.now()/1000)+(Number(j.expires_in)||3600), email:s.email});
      return j.access_token;
    }
    if(res.status===400||res.status===401){ sbLog({ng:1,note:'refresh_'+res.status}); sbSetSession(null); }
    return null;
  }catch(e){ return null; }   // 一時的なネットワーク断ではセッションを捨てない
}
async function H(extra){
  const t = await sbToken();
  if(!t) throw new Error('セッションが切れています。ログインし直してください');
  return Object.assign({apikey:SB_KEY, Authorization:'Bearer '+t}, extra||{});
}

// 期限内のはずのトークンでもサーバーに拒否されることがある
// （セッション失効・鍵の入れ替え・プロジェクト再作成など）。
// そのときは技術的なエラーを出さずに、セッションを捨ててログイン画面へ戻す。
function expired(){
  sbSetSession(null);
  const e = new Error('セッションが切れています。ログインし直してください。');
  e.reauth = true;
  return e;
}

/* PostgREST は既定で最大1000行しか返さない。Range ヘッダでページングする */
async function sbFetchAll(table, qs){
  const PAGE = 1000; let off = 0; const out = [];
  for(;;){
    const res = await fetch(SB_URL+'/rest/v1/'+table+(qs?('?'+qs):''), {
      headers: await H({Range: off+'-'+(off+PAGE-1)}) });
    if(res.status===401 || res.status===403) throw expired();
    if(!res.ok) throw new Error(table+' 読込失敗 '+res.status+' '+(await res.text()).slice(0,160));
    const rows = await res.json();
    out.push(...rows);
    if(rows.length < PAGE) break;
    off += PAGE;
  }
  return out;
}
async function sbNext(counter){
  const res = await fetch(SB_URL+'/rest/v1/rpc/seek_next',{
    method:'POST', headers: await H({'Content-Type':'application/json'}),
    body: JSON.stringify({counter})
  });
  if(!res.ok) throw new Error('採番失敗 '+res.status+' '+(await res.text()).slice(0,160));
  return await res.json();
}

/* ============================================================
   添付ファイル（図面PDF・写真・納品書）
   ------------------------------------------------------------
   見積依頼はメールで来て図面がPDFで添付されている。
   いまはメールの中に埋もれていて、下請けに送るときに探し直している。
   → 案件に紐付けて残す。実体は Supabase Storage、DBにはメタ情報だけ。
   バケット seek-files は Public OFF。取り出しは毎回その場で署名付きURLを作る。
   ============================================================ */
const BUCKET = 'seek-files';
const MAX_FILE = 25 * 1024 * 1024;      // 1ファイル25MBまで（図面PDFなら十分）

async function uploadFile(jobId, file, kind){
  if(file.size > MAX_FILE) throw new Error(`${file.name} は ${(file.size/1048576).toFixed(1)}MB あります（上限25MB）`);
  const fid = 'f-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
  // Storage のパスに日本語やスペースをそのまま使うと事故るのでキーは安全な文字だけにし、
  // 元のファイル名は DB 側（file_name）に持つ
  const ext = (file.name.match(/\.[A-Za-z0-9]{1,8}$/)||[''])[0].toLowerCase();
  const key = `jobs/${jobId}/${fid}${ext}`;

  const up = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${key}`, {
    method:'POST',
    headers: await H({'Content-Type': file.type || 'application/octet-stream',
                      'x-upsert':'true', 'Cache-Control':'3600'}),
    body: file
  });
  if(!up.ok) throw new Error(`${file.name} のアップロードに失敗（${up.status}）${(await up.text()).slice(0,120)}`);

  // メタ情報。Storage には入ったが行が作れなかった場合は、置いたファイルを消して元に戻す
  const row = { id:fid, org_id:'seek', job_id:jobId, kind:kind||'図面',
                file_name:file.name, mime_type:file.type||null, byte_size:file.size,
                storage_path:key, uploaded_by:(sbSession()||{}).email||null };
  const ins = await fetch(`${SB_URL}/rest/v1/seek_files?on_conflict=id`, {
    method:'POST',
    headers: await H({'Content-Type':'application/json',
                      Prefer:'resolution=merge-duplicates,return=representation'}),
    body: JSON.stringify([row])
  });
  if(!ins.ok){
    try{ await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${key}`,{method:'DELETE',headers:await H()}); }catch(e){}
    throw new Error(`${file.name} の登録に失敗（${ins.status}）`);
  }
  sbLog({upload:1, job:jobId, name:file.name, size:file.size});
  return row;
}

async function fileUrl(f){
  const res = await fetch(`${SB_URL}/storage/v1/object/sign/${BUCKET}/${f.storage_path}`, {
    method:'POST', headers: await H({'Content-Type':'application/json'}),
    body: JSON.stringify({expiresIn:3600})
  });
  if(!res.ok) throw new Error('リンクの発行に失敗（'+res.status+'）');
  const j = await res.json();
  // Supabase は "/object/sign/<bucket>/<path>?token=..." を返す（/storage/v1 は含まれない）。
  // 実装によっては "/storage/v1/..." や絶対URLのこともあるので、どれでも通るようにする。
  let u = j.signedURL || j.signedUrl || '';
  if(!u) throw new Error('リンクを受け取れませんでした');
  if(/^https?:\/\//.test(u)) return u;
  u = u.replace(/^\/+/, '');
  if(!u.startsWith('storage/v1/')) u = 'storage/v1/' + u;
  return SB_URL + '/' + u;
}

  try{ await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${f.storage_path}`,
        {method:'DELETE', headers: await H()}); }catch(e){}
}

/* ============================================================
   保存（fail-closed・version 楽観ロック）
   すべての段が成功したときだけ「保存しました」と言う。
   ============================================================ */
// 保存は RPC 1本。案件・明細・原価・採番がすべて同じトランザクションに入る。
// 案件POST→明細POST→原価POST と分けると、途中で落ちたときに
// 「案件と採番だけ残って明細が無い」中途半端な行ができる（モックで実際に再現した）。
//
// 合計金額はクライアントから送らない。DB側が明細から計算した値を正とする（二重書きの食い違いを作らない）。
async function saveJob(job, items){
  const payloadItems = items.map(it=>({
    id: it.id || null,
    work_type_id: it.work_type_id || null,
    name: it.name || '(品名なし)',
    qty: num(it.qty), unit: it.unit || null,
    unit_price: num(it.unit_price), amount: num(it.amount),
    supply_type: it.supply_type || null,
    opt_gl_cut: !!it.opt_gl_cut, opt_pole: it.opt_pole || null,
    section: Number(it.section)===2 ? 2 : 1,
    memo: it.memo || null, data: it.data || {},
    cost_unit: num(it.cost_unit), cost_amount: num(it.cost_amount)
  }));
  const res = await fetch(SB_URL+'/rest/v1/rpc/seek_save_job',{
    method:'POST',
    headers: await H({'Content-Type':'application/json'}),
    body: JSON.stringify({ p_job: job, p_items: payloadItems })
  });
  const text = await res.text();
  if(!res.ok){
    let msg = text.slice(0,300);
    try{ const j = JSON.parse(text); msg = j.message || j.hint || msg; }catch(e){}
    const e = new Error(/CONFLICT/.test(msg)
      ? 'この案件は別の端末で更新されています。画面を読み直してから保存してください。'
      : ('保存に失敗しました（'+res.status+'）'+msg));
    e.conflict = /CONFLICT/.test(msg);
    throw e;
  }
  const saved = JSON.parse(text);
  const row = Array.isArray(saved) ? saved[0] : saved;
  M.itemCache.delete(row.id);
  sbLog({save:1, id:row.id, items:payloadItems.length});
  return row;
}

let costByJob = null;     // job_id -> 原価合計
let wtStats   = null;     // 工種ごとの 件数・売上・平均単価
let lastUse   = null;     // 単価表・原価が最後に使われた日（レビューの絞り込みに使う）
let recentPrice = null;   // 顧客|工種 -> 直近3件が同じだったときの「いまの単価」
/* 「直近1年」の境目。ここより後に使った実績があるものだけを、まず村山さんに見てもらう。
   1年使っていない単価は、次に使うときに画面が「未確定」と出すので、先に全部やる必要がない。 */
const RECENT_FROM = (()=>{ const d=new Date(); d.setFullYear(d.getFullYear()-1);
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); })();
// まだ明細を読み込んでいないうちは true（＝全部見せる）。
// ここで false を返すと「あと0件」と出てしまい、終わったように見えてしまう。
const usedRecently = k => !lastUse
  || (lastUse.byPair.get(k) || lastUse.byName.get(k) || '') >= RECENT_FROM;
// 直近1年に案件があった顧客か（顧客のレビューを絞るのに使う）
let recentClientSet = null;
const recentClient = id => {
  if(!recentClientSet) recentClientSet = new Set(
    (M.jobs||[]).filter(j=>(j.quoted_at||'') >= RECENT_FROM && j.client_id).map(j=>j.client_id));
  return recentClientSet.has(id);
};
/* 読み終わる前にもう一度呼ばれたら、同じ読み込みに相乗りさせる。
   これが無いと、マスタの絞り込みに文字を打つたびに drawMaster が走り、
   打鍵の数だけ明細9,162件の取得が並ぶ（読み終わるまで costByJob が空のため）。
   2026-09-08 の点検で発見。 */
let costsLoading = null;
async function loadCosts(){
  if(costByJob) return costByJob;
  if(!costsLoading) costsLoading = loadCostsNow().finally(()=>{ costsLoading = null; });
  return costsLoading;
}
async function loadCostsNow(){
  if(costByJob) return costByJob;
  const [items, costs] = await Promise.all([
    sbFetchAll('seek_job_items','select=id,job_id,work_type_id,name,amount,qty,unit,unit_price'),
    sbFetchAll('seek_job_item_costs','select=item_id,job_id,cost_amount')
  ]);
  costByJob = new Map();
  costs.forEach(r=>costByJob.set(r.job_id, (costByJob.get(r.job_id)||0) + Number(r.cost_amount||0)));

  /* 単価表・原価が「最後に使われたのはいつか」。
     村山さんのレビュー847件を、10/1から実際に使うものだけに絞るために要る。
     ・単価表は 顧客×工種 でぶら下がっている
     ・原価は工種の名前でぶら下がっている（work_type_id が入っていない行があるため） */
  const jobMap = new Map((M.jobs||[]).map(j=>[j.id,j]));
  lastUse = { byPair:new Map(), byName:new Map() };
  const bump = (map,k,d)=>{ if(!k) return; if((d||'') > (map.get(k)||'')) map.set(k,d||''); };
  const series = new Map();      // 顧客|工種 -> [{d, p}] 単価の履歴
  items.forEach(it=>{
    const j = jobMap.get(it.job_id); if(!j) return;
    const d = j.quoted_at || '';
    if(j.client_id && it.work_type_id) bump(lastUse.byPair, j.client_id+'|'+it.work_type_id, d);
    bump(lastUse.byName, (it.name||'').trim(), d);
    const p = Number(it.unit_price);
    if(j.client_id && it.work_type_id && d && p){
      const k = j.client_id+'|'+it.work_type_id;
      (series.get(k) || series.set(k,[]).get(k)).push({d, p});
    }
  });

  /* 「直近はいくらで出しているか」。
     最頻値（いちばん多かった金額）は、昔の金額に引きずられることがある。
     実データで、最頻値125,000／直近はずっと10,000 という行が見つかった（12.5倍のずれ）。
     まとめて確定でこれを通すと、新しい見積が桁違いの単価で出てしまう。
     → 直近3件が同じ金額なら「いまの単価」とみなして、最頻値と食い違うときに警告する。 */
  recentPrice = new Map();
  series.forEach((arr,k)=>{
    if(arr.length < 3) return;
    arr.sort((a,b)=>a.d.localeCompare(b.d));
    const last = arr.slice(-3);
    if(last.every(x=>x.p === last[0].p))
      recentPrice.set(k, {value:last[0].p, from:last[0].d, n:arr.length});
  });

  // 工種ごと。マスタに載っている工種だけを対象にする
  // （一過性の大型案件名が明細にそのまま入っていることがあり、混ぜると「稼ぎ頭」が歪む）
  // 失注・キャンセルの明細は入れない。稼いでいない工事を「稼ぎ頭」に混ぜないため。
  const lostIds = new Set((M.jobs||[]).filter(j=>['失注','キャンセル'].includes(j.status)).map(j=>j.id));
  const m = new Map();
  items.forEach(it=>{
    if(!it.work_type_id) return;
    if(lostIds.has(it.job_id)) return;
    const b = m.get(it.work_type_id) || {n:0, s:0, q:0, jobs:new Set()};
    b.n++; b.s += Number(it.amount||0); b.q += Number(it.qty||0); b.jobs.add(it.job_id);
    m.set(it.work_type_id, b);
  });
  wtStats = m;
  return costByJob;
}
/* 年度。SEEKは9月末決算なので期首は10月。設定で変えられる。
   暦年で並べると、決算をまたいだ数字を1本の棒で見ることになる。 */
const FY_START = () => Number((M.settings&&M.settings.fiscalStartMonth) || 10);
// その日が属する年度（2026-10-01 → 2027年度と呼ばず「2026年度」＝期首の年で呼ぶ）
function fiscalYearOf(d){
  const t = new Date(d); if(isNaN(t)) return null;
  return t.getMonth()+1 >= FY_START() ? t.getFullYear() : t.getFullYear()-1;
}

// 期首から並べた月の配列（10月始まりなら 10,11,12,1,…,9）

/* ============================================================
   予定表（ダッシュボードの先頭）
   ------------------------------------------------------------
   大嶺さん「ダッシュボードのトップはカレンダーがいいかな」（2026-09-07）

   全体フロー §1-2 は「駐車場オープン日から逆算して段取りする」流れなので、
   月のカレンダーに落とすと一番わかりやすい。
     オープン予定日 → 電力申請の提出〆 → 部品の発注〆 → 外注へ日程連絡 → 施工 → 請求 → 入金

   ⚠ 逆算の日数のうち、確定しているのは「外注へ日程連絡＝14日前」だけ。
     電力申請と部品は仮の30日なので、予定表でも「仮」と分かるようにする。

   ⚠ 移行した986件は open_date が1件も入っていない（Excelに無かった項目）。
     いまの予定表は過去の納期・支払期日しか出ない。10/1から受注するぶんで埋まっていく。
   ============================================================ */
let calYM = null;      // 表示中の年月 'YYYY-MM'。null なら今月
let calPick = null;    // 選んだ日
const CAL_KINDS = {
  open:  {icon:'🚗', label:'オープン',      color:'var(--brand)'},
  power: {icon:'📄', label:'電力申請の〆',   color:'var(--warn)'},
  parts: {icon:'📦', label:'部品の発注〆',   color:'var(--warn)'},
  sub:   {icon:'📞', label:'外注へ日程連絡', color:'var(--pri)'},
  build: {icon:'🔧', label:'施工・納品',     color:'var(--ok)'},
  pay:   {icon:'💰', label:'入金予定',       color:'var(--charcoal)'},
};
/* その月に関係する予定を日付ごとに集める。
   1件の案件から複数の予定が出る（オープン日1つから逆算3つ）。 */
function calEvents(){
  const map = new Map();                 // 'YYYY-MM-DD' -> [{kind, job}]
  const add = (d, kind, j, note) => {
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d||'')) return;
    (map.get(d) || map.set(d,[]).get(d)).push({kind, job:j, note});
  };
  const L = leadDays();
  (M.jobs||[]).forEach(j=>{
    if(['失注','キャンセル'].includes(j.status)) return;   // 流れていない案件は予定に出さない
    if(j.open_date){
      add(j.open_date, 'open', j);
      ['power','parts','sub'].forEach(k=>{
        const l = L[k]; if(!l || l.days==null) return;
        add(dateStr(new Date(new Date(j.open_date).getTime() - l.days*86400000)), k, j,
            l.fixed ? '' : '仮');
      });
    }
    if(j.delivered_at) add(j.delivered_at, 'build', j);
    // 入金予定は「請求済でまだ入金の記録が無いもの」だけ
    if(j.due_date && j.status==='請求済' && !j.paid_at) add(j.due_date, 'pay', j);
  });
  return map;
}

    `<span><i style="color:${k.color}">${k.icon}</i>${k.label}</span>`).join('')}</div>
  <div id="calDay"></div>
  ${!total ? `<div class="note" style="margin-top:10px">

    （Excelに無かった項目）。<br>
    <span class="small">案件に<b>オープン予定日</b>を入れると、そこから逆算して
      電力申請の〆・部品の発注〆・外注への日程連絡が自動でこの表に並びます。</span></div>`:''}`;

  document.getElementById('calPrev').onclick  = ()=>shift(-1);

let dashTab = 'now';
const DASH_GROUPS = [
  ['now',  'いまの仕事', /予定表|工程の進捗|売掛|フォロー状況|同じ現場/],
  ['biz',  '経営',       /月ごとの売上|お取引先|稼ぎ頭|季節性|請求まで進んだ/],
  ['data', 'データの点検', /原価データの点検/],
];
function groupOf(card){
  const h = (card.querySelector('h2')||{}).textContent || '';
  for(const [key,,re] of DASH_GROUPS) if(re.test(h)) return key;
  return null;                 // 見出しの無いもの（KPI帯・注記）は常に出す
}
function applyDashTabs(el){
  const kids=[...el.children];
  const groups={};
  kids.forEach(c=>{ const g=groupOf(c); if(g){ (groups[g]=groups[g]||[]).push(c); c.dataset.dgroup=g; } });
  // 分けるほどカードが無ければ、そのまま全部出す
  if(Object.keys(groups).length < 2) return;

  const bar=document.createElement('div');
  bar.className='row';
  bar.style.cssText='margin:0 0 14px';
  bar.innerHTML = `<div class="seg">${DASH_GROUPS
    .filter(([k])=>(groups[k]||[]).length)
    .map(([k,l])=>`<button data-dt="${k}" class="${dashTab===k?'on':''}">${l} ${(groups[k]||[]).length}</button>`)
    .join('')}</div>
    <span class="muted small" id="dashHint"></span>`;
  // KPI帯（見出しの無い先頭のブロック）のうしろに入れる
  const first=kids.find(c=>!c.dataset.dgroup);
  if(first && first.nextSibling) el.insertBefore(bar, first.nextSibling);
  else el.insertBefore(bar, el.firstChild);

  const HINT={ now:'今日どう動くか。ここが空なら手が空いています。',
               biz:'数字を見るところ。毎日見るものではありません。',
               data:'Excelから移したデータの状態です。' };
  const show=()=>{
    kids.forEach(c=>{ const g=c.dataset.dgroup; if(g) c.hidden = (g!==dashTab); });
    bar.querySelectorAll('[data-dt]').forEach(b=>b.classList.toggle('on', b.dataset.dt===dashTab));
    const hint=document.getElementById('dashHint'); if(hint) hint.textContent=HINT[dashTab]||'';
  };
  bar.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{ dashTab=b.dataset.dt; show(); window.scrollTo(0,0); });
  // KPI帯の「理由を見る」など、別のタブのカードを指しているボタン
  el.querySelectorAll('[data-godash]').forEach(b=>b.onclick=()=>{
    dashTab=b.dataset.godash; show(); window.scrollTo(0,0);
  });
  if(!(groups[dashTab]||[]).length) dashTab = DASH_GROUPS.find(([k])=>(groups[k]||[]).length)[0];
  show();
}

async function drawDash(){
  const el = document.getElementById('dashBody'); if(!el) return;
  let cost;
  try{ cost = await loadCosts(); }
  catch(e){ el.innerHTML = `<div class="card"><div class="err">${esc(e.message)}</div></div>`; return; }

  const J = M.jobs;
  const ex = j => Number(j.total_ex_tax||0);
  const billed = J.filter(j=>j.status==='請求済'||j.status==='入金済');
  const live   = J.filter(j=>['見積提出','受注','手配','施工中','施工完了'].includes(j.status));
  // 失注・キャンセルは「金額」には入れない。入れると総額も1件あたりの平均も膨らんで見える。
  const lostJ  = J.filter(j=>['失注','キャンセル'].includes(j.status));
  const activeJ= J.filter(j=>!['失注','キャンセル'].includes(j.status));
  const sum = a => a.reduce((x,j)=>x+ex(j),0);
  const costOf = j => cost.get(j.id)||0;

  // 粗利は「原価が入っている案件」だけで見る（入っていない案件を混ぜると嘘になる）
  const withCost = J.filter(j=>costOf(j)>0 && ex(j)>0);
  const gpSales = sum(withCost), gpCost = withCost.reduce((a,j)=>a+costOf(j),0);
  const gp = gpSales - gpCost, gpr = gpSales ? gp/gpSales*100 : 0;

  // ⚠ 現行Excelの原価は明細行と1:1で対応していない（機器代をまとめて1行に入れている等）。
  //   実測で 26% の案件が「原価 > 売上」になる。粗利は断定せず、根拠を並べて出す。
  const over = withCost.filter(j=>costOf(j) > ex(j));
  const rates = withCost.map(j=>costOf(j)/ex(j)).sort((a,b)=>a-b);
  const medRate = rates.length ? rates[Math.floor(rates.length/2)] : 0;

  // 月別（請求日ベース）。請求日が壊れている数件が混じるので、3件未満の月は出さない
  const byMonthAll = {};
  billed.forEach(j=>{ const m=(j.invoiced_at||'').slice(0,7); if(!/^\d{4}-\d{2}$/.test(m))return;
    const b=byMonthAll[m]||(byMonthAll[m]={n:0,s:0,c:0}); b.n++; b.s+=ex(j); b.c+=costOf(j); });
  const dropped = Object.entries(byMonthAll).filter(([,b])=>b.n<3);
  const byMonth = Object.fromEntries(Object.entries(byMonthAll).filter(([,b])=>b.n>=3));
  const months = Object.keys(byMonth).sort().slice(-14);
  const maxM = Math.max(1, ...months.map(m=>byMonth[m].s));

  // 顧客別。失注・キャンセルは「売上」ではないので入れない
  const byClient = new Map();
  activeJ.forEach(j=>{ if(!j.client_id)return;
    const b=byClient.get(j.client_id)||{n:0,s:0,c:0}; b.n++; b.s+=ex(j); b.c+=costOf(j);
    byClient.set(j.client_id,b); });
  const clients = [...byClient.entries()].sort((a,b)=>b[1].s-a[1].s).slice(0,10);
  const maxC = clients.length?clients[0][1].s:1;
  const top5 = [...byClient.values()].sort((a,b)=>b.s-a.s).slice(0,5).reduce((a,b)=>a+b.s,0);

  // ステータス別
  const byStatus = {};
  J.forEach(j=>{ const b=byStatus[j.status]||(byStatus[j.status]={n:0,s:0}); b.n++; b.s+=ex(j); });

  // 見積提出のまま止まっているもの（要件定義 D「見積提出後◯ヶ月でフォロー通知」）
  const daysOf = d => d ? Math.floor((Date.now()-new Date(d).getTime())/86400000) : null;
  const stale = J.filter(j=>j.status==='見積提出' && j.quoted_at)
    .map(j=>({j, d:daysOf(j.quoted_at)})).filter(x=>x.d!=null && x.d>=0);
  const recent = stale.filter(x=>x.d<=90);   // 直近90日＝実際にいま動いている見積

  // 季節性（見積日ベース）。請求日は実質1年分しか無いので同月比較に使えない。
  const MONTHS=fyMonths();   // 期首（10月）から並べる
  const yrs = J.map(j=>(j.quoted_at||'').slice(0,4)).filter(y=>/^\d{4}$/.test(y));
  const yrCount={}; yrs.forEach(y=>yrCount[y]=(yrCount[y]||0)+1);
  // 件数が少なすぎる年（黎明期の数件）は季節性の判断を歪めるので外す
  const useYears = Object.keys(yrCount).filter(y=>yrCount[y]>=20).sort();
  const seasonYears = useYears.length? [useYears[0], useYears[useYears.length-1]] : ['—','—'];
  const season={};
  J.forEach(j=>{ const y=(j.quoted_at||'').slice(0,4); if(!useYears.includes(y))return;
    const m=+j.quoted_at.slice(5,7); const b=season[m]||(season[m]={n:0,s:0}); b.n++; b.s+=ex(j); });
  const seasonMax=Math.max(1,...MONTHS.map(m=>(season[m]||{n:0}).n));
  const seasonAvg=MONTHS.reduce((a,m)=>a+(season[m]||{n:0}).n,0)/12;
  const busy = MONTHS.filter(m=>(season[m]||{n:0}).n>=seasonAvg*1.15);
  const quiet= MONTHS.filter(m=>{const n=(season[m]||{n:0}).n; return n>0 && n<=seasonAvg*0.75;});

  // 見積が請求まで進んだ割合（失注が記録されていないため、失注率の代わり）
  const wonRecent = (()=>{
    const a = J.filter(j=>j.quoted_at && daysOf(j.quoted_at)<=365 && daysOf(j.quoted_at)>=0);
    const w = a.filter(j=>j.status==='請求済'||j.status==='入金済');
    return {all:a.length, won:w.length, pct: a.length? w.length/a.length*100 : 0};
  })();

  // 同じ現場に複数の見積（要件定義 D「重複見積の警告」／課題「二重見積」）
  //  括弧の中身（第1・第2・ロック板／ロックレス）は現場や仕様を区別する情報なので落とさない。
  //  毎月くり返す費目（機器預かり費など）は重複ではないので除く。
  const normTitle = s => String(s||'').replace(/^仮\s*[）)]\s*/,'').replace(/[\s　]/g,'').trim();
  const periodic = /月分|レンタル|預かり|支援料|保守|管理費|応援/;
  const grp = new Map();
  J.forEach(j=>{ if(!j.client_id) return; const t=normTitle(j.title); if(t.length<4) return;
    if(periodic.test(t)) return;
    const k=j.client_id+''+t; const a=grp.get(k); a?a.push(j):grp.set(k,[j]); });
  const dupes = [...grp.entries()].filter(([,v])=>v.length>1)
    .map(([k,v])=>({client:(clientMap.get(k.split('')[0])||{}).name||'—',
                    title:v[0].title, jobs:v.slice().sort((a,b)=>String(a.quoted_at||'').localeCompare(String(b.quoted_at||'')))}))
    .sort((a,b)=>{
      const g=x=>{const m=x.jobs.map(j=>ex(j)); return Math.max(...m)-Math.min(...m);};
      return g(b)-g(a) || b.jobs.length-a.jobs.length;   // 金額差が大きいものから
    });

  el.innerHTML = `
  <div class="big">
    <div class="b"><div class="v">${J.length.toLocaleString()}<em>件</em></div><div class="l">案件</div>
      <div class="s">請求済 ${billed.length} ／ 進行中 ${live.length}</div></div>
    <div class="b"><div class="v">${oku(sum(activeJ))}<em>億円</em></div><div class="l">受注・見積の総額（税抜）</div>
      <div class="s">請求済 ${oku(sum(billed))}億 ／ 進行中 ${oku(sum(live))}億${
        lostJ.length?`<br>失注 ${lostJ.length}件 ${oku(sum(lostJ))}億は入れていません`:''}</div></div>
    <div class="b warn"><div class="v">${oku(gp)}<em>億円</em></div>
      <div class="l">粗利益（<b style="color:var(--warn)">参考値</b>）</div>
      <div class="s">利益率 ${gpr.toFixed(1)}%。<b>いまの原価データはそのままでは使えません</b>
        <button class="btn ghost sm" data-godash="data" style="margin-left:6px">理由を見る</button></div></div>
    <div class="b"><div class="v">${M.clients.length}<em>社</em></div><div class="l">お取引先</div>
      <div class="s">上位5社で ${(top5/Math.max(1,sum(activeJ))*100).toFixed(0)}% を占める</div></div>
    <div class="b"><div class="v">${man(sum(activeJ)/Math.max(1,activeJ.length))}<em>万円</em></div><div class="l">1案件あたりの平均</div>
      <div class="s">工種 ${M.wts.length}種 ／ 単価表 ${M.prices.length}行</div></div>
  </div>

  <div class="card">
    <h2>月ごとの売上（請求日ベース）</h2>
    <div class="chartwrap"><div class="bars">
      ${months.map(m=>{
        const b=byMonth[m];
        const h=Math.max(3, Math.round(b.s/maxM*128));
        const cr=b.s? b.c/b.s*100 : 0;
        return `<div class="col" title="${m}　売上 ${yen(b.s)}円 ／ 原価 ${yen(b.c)}円 ／ ${b.n}件">

  const mp = document.getElementById('migPaid');

      + `※ これから請求する分には触れません。1件ずつ戻せます。\n\nよろしいですか。`)) return;

        ok++;
      }catch(e){ ng++; }
    }
    mp.disabled = false;

/* 絞り込んだ案件の状態をまとめて変える。
   Excelから移した「見積提出のまま1年以上」の502件を仕分けるために要る。
   ⚠ まとめて書き換えるので、必ず件数を見せて確認を取ってから実行する
     （標準手順書 STOP 2 の考え方をアプリ側にも持ち込む）。 */
let bulkOpen=false;
function drawBulk(){
  const box=document.getElementById('fbulkbox'); if(!box) return;
  if(!bulkOpen){ box.innerHTML=''; return; }
  const hit=matchJobs();
  box.innerHTML=`<div class="note" style="margin-top:10px">
    <b>いま絞り込んでいる ${hit.length}件</b> の状態をまとめて変えます。
    絞り込みを効かせてから使ってください（例: 状態＝見積提出 ＋ 年＝2022）。
    <div class="row" style="margin-top:8px">
      <label class="f">変更後の状態<select id="bkTo">
        ${STATUSES.map(s=>`<option ${s==='失注'?'selected':''}>${s}</option>`).join('')}</select></label>
      <button class="btn sm" id="bkGo" ${hit.length?'':'disabled'}>${hit.length}件を変更する</button>
      <button class="btn ghost sm" id="bkCancel">やめる</button>
      <span class="muted small">元に戻すには、同じ絞り込みで状態を戻してください</span>
    </div>
    <div id="bkMsg"></div></div>`;
  document.getElementById('bkCancel').onclick=()=>{ bulkOpen=false; drawBulk(); };
  document.getElementById('bkGo').onclick=async()=>{
    const to=document.getElementById('bkTo').value;
    const list=matchJobs();
    if(!confirm(`${list.length}件の状態を「${to}」に変えます。よろしいですか。\n\n`
      + list.slice(0,5).map(j=>`  ${j.client_name||''} ${j.title||''}`).join('\n')
      + (list.length>5?`\n  ほか ${list.length-5}件`:''))) return;
    const btn=document.getElementById('bkGo'); btn.disabled=true;
    const msg=m=>document.getElementById('bkMsg').innerHTML=m;
    let ok=0; const ng=[];
    for(const j of list){
      btn.textContent=`変更中… ${ok+ng.length+1}/${list.length}`;
      try{
        const res=await fetch(SB_URL+'/rest/v1/seek_jobs?id=eq.'+encodeURIComponent(j.id)
          +'&version=eq.'+Number(j.version),{
          method:'PATCH',
          headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
          body: JSON.stringify({status:to})});
        if(!res.ok) throw new Error('HTTP '+res.status);
        const rows=await res.json();
        if(!rows.length) throw new Error('別の端末で更新されています');
        Object.assign(j, rows[0]); ok++;
      }catch(e){ ng.push((j.title||j.id)+'：'+e.message); }
    }
    btn.disabled=false; btn.textContent=`${matchJobs().length}件を変更する`;
    // できたものとできなかったものを両方はっきり出す
    msg(`<div class="${ng.length?'err':'ok'}" style="margin-top:8px">
      ${ok}件を「${esc(to)}」に変更しました。
      ${ng.length?`<br><b>${ng.length}件は変更できませんでした。</b><br>${ng.slice(0,5).map(esc).join('<br>')}`:''}</div>`);
    drawFind(); setMeta();
  };
}
function aFind(){
  const q=document.getElementById('fq'), c=document.getElementById('fc'), s=document.getElementById('fs');
  const run=()=>{ fq={q:q.value, client:c.value, status:s.value}; drawFind(); drawBulk(); };
  q.addEventListener('input',run); [c,s].forEach(e=>e.addEventListener('change',run));
  document.getElementById('fclear').onclick=()=>{ fq={q:'',client:'',status:''}; render(); };
  document.getElementById('fbulk').onclick=()=>{ bulkOpen=!bulkOpen; drawBulk(); };
  document.getElementById('freload').onclick=async()=>{

}
// いまの絞り込み条件に合う案件。一覧と「まとめて状態を変える」で同じものを使う
// （別々に書くと、画面に出ている件数と実際に書き換わる件数がずれる）
function matchJobs(){
  const q = fq.q.trim().toLowerCase();
  return M.jobs.filter(j=>{
    if(fq.client && j.client_id!==fq.client) return false;
    if(fq.status && j.status!==fq.status) return false;
    if(q){ const hay=((j.title||'')+' '+(j.client_name||'')+' '+(j.job_no||'')+' '+(j.source_file||'')).toLowerCase();
           if(!hay.includes(q)) return false; }
    return true;
  });
}

/* ============================================================
   現場をGoogleマップで見る
   ------------------------------------------------------------
   全体フロー §1-2 の課題「今日どこですか から始まる／現場位置が不明」に効く。

   ・住所は seek_jobs.site_address（Phase 1.5 で入力できるようにした）
   ・Excelから移した986件には住所が入っていない（当時のExcelに欄が無かった）。
     そこは案件名で探す。案件名は「ザ・パーク普天間第3」のように施設名なので
     マップで見つかることが多い。ただし**登録された住所ではない**ので、
     ボタンの文言を分けて、取り違えが起きないようにする。
   ・メール本文にマップのリンクが入っていることがあるが（実物③にあった）、
     受け取ったリンクをそのまま開くボタンにはしない。住所から自分で組み立てる。
   ============================================================ */
const mapHref = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);

// 沖縄県内の現場が大半なので、県名が無ければ足して精度を上げる
function mapQuery(j){
  const a = (j.site_address||'').trim();
  if(a) return /沖縄県|東京都|府|県/.test(a) ? a : ('沖縄県 ' + a);
  return '';
}
function openMap(q){
  if(!q) return;
  window.open(mapHref(q), '_blank', 'noopener,noreferrer');
}
/* 案件名から「現場の名前」だけを取り出す。
   「仮）DK中の町第8チケット設置工事」→「DK中の町第8チケット」
   「那覇市前島3丁目第4　機器入替え工事」→「那覇市前島3丁目第4」
   工種の語をそのままマップに投げると検索が当たらないので落とす。 */
function siteFromTitle(title){
  let t = String(title||'').replace(/^仮\s*[）)]\s*/,'')
                           .replace(/[（(]\s*\d{1,3}\s*台\s*[）)]/g,'')
                           .trim();
  const m = t.match(/^(.*?)\s*(?:機器\s*)?(?:設置|撤去|入替|入れ替|新設|補修|修繕|移設|工事)/);
  if(m && m[1].replace(/[\s　]/g,'').length >= 3) t = m[1];
  return t.replace(/[\s　]+$/,'').trim();
}
/* 案件の「現場」行。住所があれば地図ボタン、無ければ案件名で探すボタン。 */
function siteRow(j){
  const q = mapQuery(j);
  const zip = j.site_postal_code ? `〒${esc(j.site_postal_code)}　` : '';
  const bldg = j.site_building ? `　${esc(j.site_building)}` : '';
  if(q){
    return `<div class="row" style="gap:10px;margin-bottom:12px;align-items:center">
      <span class="muted small">現場</span>
      <b>${zip}${esc(j.site_address)}${bldg}</b>
      <button class="btn ghost sm" data-map="${esc(q)}">🗺 地図で見る</button>
      <button class="btn ghost sm" data-mapcopy="${esc(j.site_address)}">住所をコピー</button>
    </div>`;
  }
  const t = siteFromTitle(j.title);
  return `<div class="row" style="gap:10px;margin-bottom:12px;align-items:center">
    <span class="muted small">現場</span>
    <span class="muted">住所が入っていません（Excelから移した案件は住所を持っていません）</span>
    ${t?`<button class="btn ghost sm" data-map="沖縄県 ${esc(t)}">🗺 「${esc(t)}」で探す</button>
      <span class="muted small">※登録された住所ではありません</span>`:''}
  </div>`;
}
/* 地図ボタンの割り当て。ダイアログでも一覧でも同じものを使う */
function bindMap(root){
  (root||document).querySelectorAll('[data-map]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    openMap(b.dataset.map);
  });
  (root||document).querySelectorAll('[data-mapcopy]').forEach(b=>b.onclick=async ev=>{
    ev.stopPropagation();
    try{ await navigator.clipboard.writeText(b.dataset.mapcopy); setBar('住所をコピーしました'); }
    catch(e){ setBar('コピーできませんでした'); }
  });
}

/* 駐車場オープン予定日からの逆算
   ------------------------------------------------------------
   全体フロー §1-2 工程6。工程7以降（電力申請・部品発注・外注への日程連絡・施工）は
   すべてこの日からの逆算で動く。

   日数は seek_settings.data.leadDays に置いてある（DB側で直せる／コードを触らなくてよい）。
   ⚠ 確定しているのは1つだけ。
      ・外注業者への日程連絡 = 施工の約2週間前（要件定義 §1 工程5 に明記）
      電力申請と部品の納期は 2026-09-05 の「仮で入れてて」の指示で 30日 を置いている。
      **仮の値には画面に「仮」と出す。** 出た日付をそのまま信じて段取りされると困るため。 */
const LEAD_DEFAULT = {
  sub:   { days:14, fixed:true,  label:'外注業者へ日程連絡', src:'要件定義 §1工程5' },
  power: { days:30, fixed:false, label:'電力申請の提出',     src:'仮の値（未確認）' },
  parts: { days:30, fixed:false, label:'部品の発注',         src:'仮の値（未確認）' },
};
const leadDays = () => Object.assign({}, LEAD_DEFAULT, (M.settings&&M.settings.leadDays)||{});
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const dateStr = d => new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
function openSchedule(j){
  if(!j.open_date) return '';
  const left = daysBetween(today(), j.open_date);
  const tone = left<0 ? 'err' : (left<=14 ? 'note' : 'hint');
  const when = left<0 ? `<b>${-left}日 過ぎています</b>` : (left===0 ? '<b>今日です</b>' : `あと <b>${left}日</b>`);
  const L = leadDays();
  const order = ['power','parts','sub'];          // 前にやるものから並べる
  let anyProvisional = false;
  const rows = order.map(k=>{
    const l = L[k]; if(!l || l.days==null) return '';
    if(!l.fixed) anyProvisional = true;
    const ds = dateStr(new Date(new Date(j.open_date).getTime() - l.days*86400000));
    const over = daysBetween(today(), ds) < 0;
    return `${esc(l.label)}：<b${over?' style="color:var(--danger)"':''}>${ds}</b>`
         + `<span class="muted small">（${l.days}日前${over?'・過ぎています':''}${l.fixed?'':'・仮'}）</span>`;
  }).filter(Boolean);
  return `<div class="${tone}" style="margin-bottom:12px">
    <b>駐車場オープン予定日 ${esc(j.open_date)}</b>　${when}<br>
    <span class="small">${rows.join('　/　')}</span>
    ${anyProvisional?`<br><span class="muted small">「仮」は村山さんに確認できていない日数です
      （電力申請の代行業者のリードタイム、部品の納期）。確認できたらマスタの設定で直します。</span>`:''}
  </div>`;
}

  const btn=document.getElementById('gotoFiles');

  box.innerHTML = `<h2>図面・添付（${files.length}件）</h2>
    <div class="row" style="margin-bottom:10px">
      <label class="f">種類<select id="fkind">
        ${['図面','着工前写真','完了後写真','写真','納品書','見積書','その他'].map(k=>`<option>${k}</option>`).join('')}</select></label>
      <label class="f">ファイル<input type="file" id="fpick" multiple></label>
      <button class="btn sm" id="fup">追加する</button>
      <span class="muted small">メールに添付されてきた図面PDFをそのまま入れてください（1つ25MBまで）</span>
    </div>
    <div id="fmsg"></div>
    ${files.length ? `<div class="scroll"><table>
      <thead><tr><th>種類</th><th>ファイル名</th><th class="n">サイズ</th><th>追加日</th><th></th></tr></thead>
      <tbody>${files.map(f=>`<tr>
        <td><span class="tag q">${esc(f.kind)}</span></td>
        <td>${esc(f.file_name)}</td>
        <td class="n small">${fileSize(f.byte_size)}</td>
        <td class="small muted">${esc(String(f.created_at||'').slice(0,10))}</td>
        <td><button class="btn ghost sm" data-open="${esc(f.id)}">開く</button>
            <button class="btn ghost sm" data-del="${esc(f.id)}">削除</button></td></tr>`).join('')}
      </tbody></table></div>`
      : '<div class="muted small">まだ添付はありません。</div>'}`;

  const msg=m=>{ document.getElementById('fmsg').innerHTML=m; };
  document.getElementById('fup').onclick=async()=>{
    const inp=document.getElementById('fpick');
    if(!inp.files.length){ msg('<div class="err">ファイルを選んでください</div>'); return; }
    const kind=document.getElementById('fkind').value;

    for(const f of inp.files){

      catch(e){ ng.push(e.message); }
    }
    btn.disabled=false; btn.textContent='追加する';
    await drawFiles(jobId);
    // fail-closed: 入ったものと入らなかったものを両方はっきり出す
    msg((ok.length?`<div class="ok">${ok.length}件を追加しました（${ok.map(esc).join(' / ')}）</div>`:'')
      + (ng.length?`<div class="err">${ng.length}件は追加できませんでした<br>${ng.map(esc).join('<br>')}</div>`:''));
  };
  box.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{
    const f=files.find(x=>x.id===b.dataset.open);
    b.disabled=true;
    try{ window.open(await fileUrl(f),'_blank','noopener'); }
    catch(e){ msg(`<div class="err">${esc(e.message)}</div>`); }
    finally{ b.disabled=false; }
  });
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const f=files.find(x=>x.id===b.dataset.del);
    if(!confirm(`「${f.file_name}」を削除します。よろしいですか。`)) return;
    try{ await deleteFile(f); await drawFiles(jobId); }
    catch(e){ msg(`<div class="err">${esc(e.message)}</div>`); }
  });
}

  const paperRow = it => isHead(it)
    ? `<tr><td colspan="6" style="font-weight:700">${esc(it.name)}</td></tr>`

          ${j.job_no?`<div>案件番号：${esc(j.job_no)}</div>`:''}
          <div style="margin-top:14px;font-size:11px;color:#555">
            ${isQ?`納入場所：御社ご指定場所<br>納　　期：発注日より30日以内<br>見積有効期限：一ヶ月`
                 :`納　　期：${esc(j.delivered_at||'')}<br>支払条件：${esc(j.payment_terms||'現金')}<br>支払期日：${esc(j.due_date||'')}`}
          </div>
          <div style="margin-top:16px;font-size:15px">${isQ?'お見積り金額':'ご請求金額'}
            <b style="font-size:20px;margin-left:12px;border-bottom:2px solid #333">¥${yen(j.total_in_tax)}-</b></div>
        </div>
        <div style="text-align:right;font-size:11px">

          <div>${esc(S.address||'')}</div>

/* ============================================================
   引渡書（全体フロー §1-2 工程12「引き渡し書作成（写真つき ビフォーアフター）」）
   ------------------------------------------------------------
   写真は現場のスマホ（SEEK_mobile.html）から着工前・完了後として上げてもらう。
   Storage は Public OFF なので、そのままでは印刷に載らない
   （署名付きURLは1時間で切れる＋PDF化のときに読み直しに行けない）。
   → その場で data URL に焼いてから紙に載せる。
   ⚠ 引渡書に金額は出さない。お客様に渡す完了の証で、請求は別紙。
   ============================================================ */
async function toDataUrl(f){
  const url = await fileUrl(f);
  const res = await fetch(url);
  if(!res.ok) throw new Error(f.file_name+' を読めませんでした（'+res.status+'）');
  const blob = await res.blob();
  return await new Promise((ok,ng)=>{ const r=new FileReader();
    r.onload=()=>ok(r.result); r.onerror=()=>ng(new Error(f.file_name+' を変換できませんでした'));
    r.readAsDataURL(blob); });
}

async function printHandover(j, items){

  let files=[], logs=[];
  try{
    [files, logs] = await Promise.all([
      listFiles(j.id),
      sbFetchAll('seek_worklogs','select=*&job_id=eq.'+encodeURIComponent(j.id)+'&order=work_date.asc')
        .catch(()=>[])   // 日報がまだ無くても引渡書は出せる
    ]);
  }catch(e){
    document.getElementById('dlgB').innerHTML =
      `<div class="err">${esc(e.message)}</div>
       <button class="btn sm ghost" onclick="openJob('${esc(j.id)}')">案件に戻る</button>`;
    return;
  }

  const isPhoto = f => /写真/.test(f.kind) || /^image\//.test(f.mime_type||'');
  // listFiles は新しい順。引渡書は「撮った順」に並んでいるほうが読みやすいので古い順にする
  const old2new = a => a.slice().sort((x,y)=>String(x.created_at||'').localeCompare(String(y.created_at||'')));
  const before = old2new(files.filter(f=>/着工前/.test(f.kind)));
  const after  = old2new(files.filter(f=>/完了後/.test(f.kind)));
  const other  = old2new(files.filter(f=>isPhoto(f) && !/着工前|完了後/.test(f.kind)));

  // 1枚ずつ data URL に。読めなかったものは黙って飛ばさず、下に理由を出す
  const MAXP = 6;                        // 紙に載る枚数。多すぎると1件で何十枚も出てしまう
  const ng = [];
  const bake = async list => {
    const out=[];
    for(const f of list.slice(0,MAXP)){
      try{ out.push({f, src: await toDataUrl(f)}); }
      catch(e){ ng.push(e.message); }
    }
    return out;

  const [bB, bA, bO] = [await bake(before), await bake(after), await bake(other)];

  const start = logs.length ? logs[0].work_date : null;

  const row = (label, val) => `<tr><th style="width:130px;text-align:left;background:#f2f2f2;

        <div style="text-align:right;font-size:11px;line-height:1.7">

          <div>${esc(S.address||'')}</div>
          <div>TEL ${esc(S.tel||'')}　FAX ${esc(S.fax||'')}</div>
          <div>${esc(S.license||'')}</div>
        </div>
      </div>
      <div style="font-size:12px;margin-bottom:12px;line-height:1.9">
        下記の工事が完了いたしましたので、ここに引き渡しいたします。</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px">
        ${row('工事名', esc(j.title||''))}
        ${row('案件番号', esc(j.job_no||'—'))}
        ${row('施工場所', addr? esc(addr) : '<span style="color:#b3261e">（現場住所が入っていません）</span>')}

        ${row('引渡日', esc(j.delivered_at || new Date(Date.now()-new Date().getTimezoneOffset()*60000)

      <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px">
        <thead><tr>
          <th style="border:1px solid #999;padding:5px 8px;background:#f2f2f2;text-align:left">品名</th>

const EDGE = () => SB_URL + '/functions/v1/seek-users';
const ROLE_LABEL = {admin:'管理者（利用者を増やせる）', office:'事務所', field:'現場'};

async function edgeUsers(payload){
  let res;
  try{
    res = await fetch(EDGE(), { method:'POST',
      headers: await H({'Content-Type':'application/json'}), body: JSON.stringify(payload) });
  }catch(e){ const err=new Error('利用者の機能につながりませんでした'); err.notReady=true; throw err; }
  if(res.status===404){ const e=new Error('まだ設置されていません'); e.notReady=true; throw e; }
  const j = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(j.error || ('うまくいきませんでした（'+res.status+'）'));
  return j;
}
// 覚えやすくて強い作り。紛らわしい文字（0 O 1 l I）は使わない。
function makePassword(){
  const A='abcdefghijkmnopqrstuvwxyz', B='ABCDEFGHJKLMNPQRSTUVWXYZ', N='23456789', S='#$%+=?';
  const all=A+B+N+S, need=[A,B,N,S];
  const buf=new Uint32Array(16); crypto.getRandomValues(buf);
  let out = need.map((set,i)=>set[buf[i]%set.length]);
  for(let i=4;i<16;i++) out.push(all[buf[i]%all.length]);
  // 並びも混ぜる
  const mix=new Uint32Array(out.length); crypto.getRandomValues(mix);
  for(let i=out.length-1;i>0;i--){ const j=mix[i]%(i+1); [out[i],out[j]]=[out[j],out[i]]; }
  return out.join('');
}

// 帳票だけを印刷する。ダイアログの中身をそのまま印刷すると崩れるので複製してから。
function printPaper(title){
  const paper = document.querySelector('#dlgB .paper');
  if(!paper){ alert('印刷する帳票が見つかりません'); return; }
  const area = document.getElementById('printArea');
  area.innerHTML = '';
  area.appendChild(paper.cloneNode(true));
  const prev = document.title;
  document.title = title || prev;      // 「PDFとして保存」の既定ファイル名になる
  const cleanup = () => { area.innerHTML=''; document.title = prev;
    window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  window.print();
  setTimeout(cleanup, 3000);           // afterprint が来ないブラウザ向けの保険
}

/* ============================================================
   見積依頼メールの読み取り
   ------------------------------------------------------------
   実データ（案件986件・明細9,162行）から出した事実に基づく:
    ・案件名の「(12台)」は 95% の確率でそのまま明細の数量になっていた（183件中174件）
    ・工種の組合せは574通りあり「まるごと同じ型」はほぼ無い（上位3パターンで12〜23%）
    ・一方で「その種類の案件によく入る工種」は安定している
      （設置357件: 精算機78% / 諸経費67% / テント41% …）
   → だから「型のコピー」ではなく「候補を出現率順に出して✓を付ける」形にする。
   ============================================================ */
/* 種類の判定語。「入替」を先に見るのは、撤去と設置が両方書いてあるメールが
   実物では「入替え工事」だったため（2026-09-05 実物3通で確認）。 */
const KIND_RE = [['入替',/入替|入れ替|入換|えかえ|交換|更新|差し替|差替/],
                 ['撤去',/撤去|処分|解体|取外|取り外|取りはず|撤収/],
                 ['設置',/設置|新設|取付|取り付|据付|据え付/],
                 ['補修',/補修|修繕|修理/]];
/* 数量の単位。実物メールは「7台」「4本」「普通車３台」「63M」のように単位がばらばら。 */
const UNIT_RE = '台|本|枚|個|基|面|セット|式|箇所|ヶ所|カ所|車室|m|M|ｍ|Ｍ';
/* 材料を誰が出すか。単価表の supply_type に直結する（材工／材料支給／施工費別）。 */
const SUPPLY_RE = [['材料支給',/支給|貸与|お客様手配|客先手配|施主支給/],
                   ['材工',/当社手配|当社対応|SEEK様手配|SEEK様対応|ＳＥＥＫ様手配|ＳＥＥＫ様対応|弊社手配/i]];

// 全角の英数字だけ半角にする。カタカナの長音「ー」は触らない（ロープ→ロ-プ を防ぐ）。
function han(s){
  return String(s||'').replace(/[Ａ-Ｚａ-ｚ０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}
const flatten = s => han(s).replace(/[\s　]/g,'');

/* 工事の種類を決める。
   件名（1行目）を本文より優先する。実物3通で、本文だけ見ると
   ①「１０月中解体予定」→撤去、②「取り外し」×3→撤去 と、2通とも取り違えた。
   件名に撤去語と設置語が両方あるとき、および本文で両方が拮抗するときは「入替」。 */
function kindOf(text){
  const count = s => KIND_RE.map(([k,re])=>{
    const m = String(s).match(new RegExp(re.source,'g')); return [k, m?m.length:0]; });
  const decide = (c, where) => {
    const g = Object.fromEntries(c);
    if(g['入替']) return {kind:'入替', why:where+'の「入替」'};
    if(g['撤去'] && g['設置']) return {kind:'入替', why:where+'に撤去と設置の両方'};
    const top = c.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0];
    return top ? {kind:top[0], why:where+'の「'+top[0]+'」'} : null;
  };
  const lines = String(text).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  return decide(count(lines[0]||''), '件名') || decide(count(text), '本文') || {kind:'', why:''};
}

/* 案件名。件名から【】や「見積依頼」の定型を落とす。
   実物: 「【見積り依頼】那覇市前島3丁目第4　機器入替え工事」→「那覇市前島3丁目第4 機器入替え工事」 */
function titleOf(text){
  const first = String(text).split(/\r?\n/).map(s=>s.trim()).filter(Boolean)[0] || '';
  return first
    .replace(/^(re|fw|fwd)\s*[:：]\s*/i,'')
    .replace(/^(件名|標題|表題|Subject)\s*[:：]\s*/i,'')
    .replace(/[【［\[](?:.*?見積.*?|ご?依頼|至急|再送)[】］\]]/g,'')
    .replace(/^[【［\[]([^】］\]]*)[】］\]]\s*/,'$1 ')        // 【ザ・パーク普天間第３】設置工事 → 中身を残す
    .replace(/\s*[（(].*[：:].*[）)]\s*$/,'')                 // 「((株)おきなわブレイク：福島知幸)」
    // 「お見積り**を**お願いします」のように助詞が挟まる書き方も落とす
    .replace(/(お?見積(書|り|もり)?)?\s*(作成)?\s*[をのはも]?\s*(依頼|お願い(いた|致)?します?)\s*$/,'')
    // 「〜設置工事のお見積り依頼」→ 上で「お見積り依頼」が落ちて「〜設置工事の」が残る。
    // 助詞や読点で終わる案件名は無いので、末尾の1文字を落とす。
    .replace(/[のをにへとがはや、，,・\-–—]+$/,'')
    .trim().slice(0,120);
}

/* 本文の箇条書きから「品目・数量・単位・支給区分」を1行ずつ拾う。
   実物②は全行がこの形（・精算機　1台 / ・バリカー設置　4本）、
   実物③は「・精算機　サニカ中古(前払い用) 支給」のように支給区分だけが付く。 */
const SKIP_LINE = /^(TEL|FAX|Mobile|E-?mail|URL|http|携帯|〒|住所|案件地|所在地|現場住所|運営方式|施設名|駐車場名|台数|件名|標題|表題|Subject|To|Cc|From)\b|^(TEL|FAX|携帯|住所|案件地|所在地|運営方式|施設名|駐車場名|台数)\s*[:：]/i;
function readLines(text){
  const out=[];
  const all=String(text).split(/\r?\n/);
  for(let i=0;i<all.length;i++){
    if(i===0) continue;                                   // 1行目は件名。品目ではない
    const s = han(all[i]).trim();
    if(!s) continue;
    /* 箇条書き／「項目：値」／表の行 だけを見る。
       表の行＝タブを含む行。HTMLメールの <table> と、Excelから貼り付けた表が同じ形になる。
       これが無いと、表で書かれた依頼メールは1行も拾えない（2026-09-08 の点検で確認）。 */
    const isRow = all[i].includes('\t');
    if(!/^[・･•\-*＊○◇◆■]/.test(s) && !/[:：]/.test(s) && !isRow) continue;
    // 表の見出し行（品名／数量／単位…）は品目ではない
    if(isRow && s.split('\t').map(x=>x.trim()).filter(Boolean)
                 .every(x=>/^(品名|品目|項目|工事名|工種|内容|名称|数量|数|単位|単価|金額|備考|摘要|no\.?|№|#)$/i.test(x))) continue;
    let body = s.replace(/^[・･•\-*＊○◇◆■]\s*/,'');
    if(isRow) body = body.replace(/\t+/g,' ').trim();
    if(SKIP_LINE.test(body)) continue;                     // 署名・現場情報の行
    if(/^\(?\d[\d\-()\s]{7,}$/.test(body)) continue;       // 電話番号だけの行
    let supply='';
    for(const [k,re] of SUPPLY_RE){ if(re.test(body)){ supply=k; break; } }
    // 括弧の中（「中古(2本足)」の 2本 など）は数量ではないので先に落とす
    const nop = body.replace(/[（(][^（()）]*[）)]/g,' ');
    const qs=[...nop.matchAll(new RegExp('(\\d+(?:\\.\\d+)?)\\s*('+UNIT_RE+')(?![0-9])','g'))];
    // 同じ単位が並ぶ行（「普通車3台、軽自動車5台」）は足す
    const unit = qs.length ? qs[0][2].replace(/[ｍＭM]/,'m') : '';
    const qty  = qs.length ? qs.filter(q=>q[2].replace(/[ｍＭM]/,'m')===unit)
                               .reduce((a,q)=>a+Number(q[1]),0) : null;
    const name = nop.replace(new RegExp('\\s*\\d+(?:\\.\\d+)?\\s*('+UNIT_RE+')(?![0-9]).*$'),'')
                    .replace(/(支給|貸与|SEEK様手配|SEEK様対応|当社手配|当社対応|弊社手配)/gi,' ')
                    .replace(/\s+/g,' ').trim();
    if(!name || name.length<2) continue;
    out.push({ raw:all[i].trim(), name, qty, unit, supply });
  }
  return out;
}

function readRequest(text){
  const t = String(text||'');
  const flat = flatten(t);
  const r = { kind:'', kind_why:'', client_id:'', client_name:'', title:'', qty:null,
              hits:[], numbers:[], items:[], site:'' };

  // 1) 種類（件名優先）
  const k = kindOf(t); r.kind=k.kind; r.kind_why=k.why;

  // 2) 顧客（マスタの正規名＋Excelでの表記ゆれ全部で照合。長い名前を優先）
  const cands=[];
  activeClients().forEach(c=>{
    const names=[c.name, c.formal_name].concat(c.name_variants||[]).filter(Boolean);
    names.forEach(n=>{ const key=flatten(n);
      if(key.length>=2 && flat.includes(key)) cands.push({c, len:key.length}); });
  });
  if(cands.length){ cands.sort((a,b)=>b.len-a.len); r.client_id=cands[0].c.id; r.client_name=cands[0].c.name; }

  // 3) 案件名・現場住所
  r.title = titleOf(t);
  const sm = han(t).match(/^[\s　]*[・･•\-*＊○◇◆■]?[\s　]*(?:住所|案件地|所在地|現場住所|所在)[\s　]*[:：][\s　]*(.+)$/m);
  if(sm) r.site = sm[1].replace(/[（(][^）)]*[）)]\s*$/,'').trim().slice(0,120);
  else {
    const sm2 = han(t).match(/^[^\n]{0,8}[市郡][^\n]{2,40}\d[^\n]{0,20}$/m);
    if(sm2) r.site = sm2[0].trim().slice(0,120);
  }

  // 4) 箇条書きの品目（数量・単位・支給区分つき）
  r.items = readLines(t);

  // 5) 台数。ここに入れた値は「単位が台の明細ぜんぶ」に効くので、
  //    はっきり駐車場全体の台数だと分かる書き方のときだけ採る。
  //    （箇条書きの「防犯カメラ 2台」を全体台数と取り違えないため）
  for(const m of han(t).matchAll(/(\d{1,3})\s*台/g)) r.numbers.push(+m[1]);
  const decl = han(t).match(/台\s*数\s*[:：]\s*(\d{1,3})/)          // 「台数：7台」
            || r.title.match(/[（(](\d{1,3})\s*台[）)]/);          // 「…設置工事（20台）」
  r.qty = decl ? +decl[1] : null;

  // 6) 工種の照合。まず箇条書きの1行ずつ、次に本文全体。
  const byId = new Map();
  const add = (w, why, it) => {
    const cur = byId.get(w.id);
    if(cur && !(it && !cur.qty)) return;
    byId.set(w.id, {id:w.id, name:w.name, why, qty:it?it.qty:null, unit:it?it.unit:'',
                    supply:it?it.supply:'', raw:it?it.raw:''});
  };
  const kindOk = w => {
    const f=(w.data&&w.data.freq)||{};
    return !r.kind || (f[r.kind]||0) >= 0.05;
  };
  // その行そのものに書いてある「設置／撤去」を優先する。
  // 行に書いていなければ案件全体の種類を使う。（「入替」の依頼でも
  // 個々の行は「ロック板設置」「精算機・テント取り外し」と分かれている）
  const lineKind = s => { for(const [k,re] of KIND_RE) if(re.test(s)) return k; return ''; };
  r.items.forEach(it=>{
    const key = flatten(it.name);
    if(key.length<2) return;
    const want = lineKind(it.raw) || r.kind;
    let best=null;
    M.wts.forEach(w=>{
      const core = flatten((w.data&&w.data.core)||'');
      const nameKey = flatten(w.name);
      let score=0;
      if(nameKey===key) score=100;
      else if(key.length>=3 && nameKey.includes(key)) score=60+key.length;
      else if(core.length>=2 && key.includes(core)) score=40+core.length;
      if(!score) return;
      // お客様が名指しで書いてきた行なので、種類が合わなくても落とさない。
      // 合っているものを上に持ち上げるだけにする（実測: 種類で切ると
      // 「入替」の依頼から「車止め設置」「場内照明柱」が丸ごと消えた）
      if(want && w.category===want) score += 12;
      // 設置の依頼に撤去の工種を当てない。実測: 「料金看板 支給」に
      // 「料金看板撤去工事」が当たってしまった（設置側の工種がマスタに無いため）
      else if(/^(設置|撤去)$/.test(want||'') && /^(設置|撤去)$/.test(w.category||'')) score -= 25;
      score += Math.min(6, (w.sample_count||0)/100);
      if(!best || score>best.score) best={w,score};
    });
    // 反対の種類しか無いなど、確信が持てないものは当てない。
    // 「依頼の行」には残るので、村山さんが手で足せる。
    if(best && best.score>=25) add(best.w, '依頼の行', it);
  });
  M.wts.forEach(w=>{
    const core = flatten((w.data&&w.data.core)||'');
    if(core.length < 2) return;      // 「設置工事」の3文字ではどのメールにも当たってしまう
    const nameKey = flatten(w.name);
    if(nameKey.length>=3 && flat.includes(nameKey)) add(w,'名称',null);
    else if(flat.includes(core) && kindOk(w)) add(w,'核語',null);
  });
  r.hits = [...byId.values()];
  return r;
}
// 種類ごとの候補（出現率順）。本文でヒットしたものは最初から✓
function candidatesFor(kind, hitIds){
  return M.wts.map(w=>{
    const f=(w.data&&w.data.freq)||{};
    const p=kind?(f[kind]||0):0;
    return {w, p, hit:hitIds.has(w.id)};
  }).filter(x=>x.hit || x.p>=0.05)
    .sort((a,b)=> (b.hit?1:0)-(a.hit?1:0) || b.p-a.p);
}

  const patch = { status, updated_at: new Date().toISOString() };
  if(jobId) patch.job_id = jobId;
  const res = await fetch(`${SB_URL}/rest/v1/seek_inbox?id=eq.`+encodeURIComponent(row.id), {
    method:'PATCH', headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify(patch)
  });
  if(!res.ok) throw new Error('受信箱の更新に失敗（'+res.status+'）');
  inbox = inbox.filter(x=>x.id!==row.id);
  return true;
}

/* 受信箱の1件を見積作成に流し込む。

  mk.paste = [(row.subject||'').trim(), row.body || ''].filter(Boolean).join('\n');

/* 案件を保存したあと、受信箱の添付を案件へ移す。
   Storage の中では inbox/... のまま置いておき、seek_files の行だけ作る
   （コピーし直すと同じものが2つできて容量を食う）。 */
async function attachInboxFiles(jobId, row){
  const atts = row.attachments||[];
  if(!atts.length) return 0;
  // 実物のメールでは 図面PDF と 現地写真のzip の両方が来る（2026-09-04 の2通で確認）
  const kindOf = a => {
    const t = (a.mime||'') + ' ' + (a.name||'');
    if(/pdf/i.test(t)) return '図面';
    if(/zip|image|png|jpe?g|heic|写真/i.test(t)) return '写真';
    return 'その他';
  };
  const rows = atts.map((a,i)=>({
    id: 'f-' + row.id + '-' + i, org_id:'seek', job_id:jobId, kind:kindOf(a),
    file_name: a.name || ('添付'+(i+1)), mime_type: a.mime||null, byte_size: a.size||null,
    storage_path: a.storage_path, uploaded_by:'メール自動取込'
  }));
  const res = await fetch(`${SB_URL}/rest/v1/seek_files?on_conflict=id`, {
    method:'POST',
    headers: await H({'Content-Type':'application/json',
                      Prefer:'resolution=merge-duplicates,return=representation'}),
    body: JSON.stringify(rows)
  });
  if(!res.ok) throw new Error('メールの添付を案件に付けられませんでした（'+res.status+'）');
  return rows.length;
}
