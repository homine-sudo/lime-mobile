/* ============================================================
   現場をGoogleマップで見る
   ------------------------------------------------------------
   全体フロー §1-2 の課題「今日どこですか から始まる／現場位置が不明」に効く。

   ・住所は seek_jobs.site_address（Phase 1.5 で入力できるようにした）
   ・Excelから移した986件には住所が入っていない（当時のExcelに欄が無かった）。
     そこは案件名で探す。案件名は「ザ・パーク普天間第3」のように施設名なので
     マップで見つかることが多い。ただし**登録された住所ではない**ので、
     ボタンの文言を分けて、取り違えが起きないようにする。
   ・メール本文にマップのリンクが入っていることがあるが（実物③にあった）、
     受け取ったリンクをそのまま開くボタンにはしない。住所から自分で組み立てる。
   ============================================================ */
const mapHref = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);

// 沖縄県内の現場が大半なので、県名が無ければ足して精度を上げる
function mapQuery(j){
  const a = (j.site_address||'').trim();
  if(a) return /沖縄県|東京都|府|県/.test(a) ? a : ('沖縄県 ' + a);
  return '';
}
function openMap(q){
  if(!q) return;
  window.open(mapHref(q), '_blank', 'noopener,noreferrer');
}
/* 案件名から「現場の名前」だけを取り出す。
   「仮）DK中の町第8チケット設置工事」→「DK中の町第8チケット」
   「那覇市前島3丁目第4　機器入替え工事」→「那覇市前島3丁目第4」
   工種の語をそのままマップに投げると検索が当たらないので落とす。 */
function siteFromTitle(title){
  let t = String(title||'').replace(/^仮\s*[）)]\s*/,'')
                           .replace(/[（(]\s*\d{1,3}\s*台\s*[）)]/g,'')
                           .trim();
  const m = t.match(/^(.*?)\s*(?:機器\s*)?(?:設置|撤去|入替|入れ替|新設|補修|修繕|移設|工事)/);
  if(m && m[1].replace(/[\s　]/g,'').length >= 3) t = m[1];
  return t.replace(/[\s　]+$/,'').trim();
}
/* 案件の「現場」行。住所があれば地図ボタン、無ければ案件名で探すボタン。 */
function siteRow(j){
  const q = mapQuery(j);
  const zip = j.site_postal_code ? `〒${esc(j.site_postal_code)}　` : '';
  const bldg = j.site_building ? `　${esc(j.site_building)}` : '';
  if(q){
    return `<div class="row" style="gap:10px;margin-bottom:12px;align-items:center">
      <span class="muted small">現場</span>
      <b>${zip}${esc(j.site_address)}${bldg}</b>
      <button class="btn ghost sm" data-map="${esc(q)}">🗺 地図で見る</button>
      <button class="btn ghost sm" data-mapcopy="${esc(j.site_address)}">住所をコピー</button>
    </div>`;
  }
  const t = siteFromTitle(j.title);
  return `<div class="row" style="gap:10px;margin-bottom:12px;align-items:center">
    <span class="muted small">現場</span>
    <span class="muted">住所が入っていません（Excelから移した案件は住所を持っていません）</span>
    ${t?`<button class="btn ghost sm" data-map="沖縄県 ${esc(t)}">🗺 「${esc(t)}」で探す</button>
      <span class="muted small">※登録された住所ではありません</span>`:''}
  </div>`;
}
/* 地図ボタンの割り当て。ダイアログでも一覧でも同じものを使う */
function bindMap(root){
  (root||document).querySelectorAll('[data-map]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    openMap(b.dataset.map);
  });
  (root||document).querySelectorAll('[data-mapcopy]').forEach(b=>b.onclick=async ev=>{
    ev.stopPropagation();
    try{ await navigator.clipboard.writeText(b.dataset.mapcopy); setBar('住所をコピーしました'); }
    catch(e){ setBar('コピーできませんでした'); }
  });
}

/* 駐車場オープン予定日からの逆算
   ------------------------------------------------------------
   全体フロー §1-2 工程6。工程7以降（電力申請・部品発注・外注への日程連絡・施工）は
   すべてこの日からの逆算で動く。

   日数は seek_settings.data.leadDays に置いてある（DB側で直せる／コードを触らなくてよい）。
   ⚠ 確定しているのは1つだけ。
      ・外注業者への日程連絡 = 施工の約2週間前（要件定義 §1 工程5 に明記）
      電力申請と部品の納期は 2026-09-05 の「仮で入れてて」の指示で 30日 を置いている。
      **仮の値には画面に「仮」と出す。** 出た日付をそのまま信じて段取りされると困るため。 */
const LEAD_DEFAULT = {
  sub:   { days:14, fixed:true,  label:'外注業者へ日程連絡', src:'要件定義 §1工程5' },
  power: { days:30, fixed:false, label:'電力申請の提出',     src:'仮の値（未確認）' },
  parts: { days:30, fixed:false, label:'部品の発注',         src:'仮の値（未確認）' },
};
const leadDays = () => Object.assign({}, LEAD_DEFAULT, (M.settings&&M.settings.leadDays)||{});
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
const dateStr = d => new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
function openSchedule(j){
  if(!j.open_date) return '';
  const left = daysBetween(today(), j.open_date);
  const tone = left<0 ? 'err' : (left<=14 ? 'note' : 'hint');
  const when = left<0 ? `<b>${-left}日 過ぎています</b>` : (left===0 ? '<b>今日です</b>' : `あと <b>${left}日</b>`);
  const L = leadDays();
  const order = ['power','parts','sub'];          // 前にやるものから並べる
  let anyProvisional = false;
  const rows = order.map(k=>{
    const l = L[k]; if(!l || l.days==null) return '';
    if(!l.fixed) anyProvisional = true;
    const ds = dateStr(new Date(new Date(j.open_date).getTime() - l.days*86400000));
    const over = daysBetween(today(), ds) < 0;
    return `${esc(l.label)}：<b${over?' style="color:var(--danger)"':''}>${ds}</b>`
         + `<span class="muted small">（${l.days}日前${over?'・過ぎています':''}${l.fixed?'':'・仮'}）</span>`;
  }).filter(Boolean);
  return `<div class="${tone}" style="margin-bottom:12px">
    <b>駐車場オープン予定日 ${esc(j.open_date)}</b>　${when}<br>
    <span class="small">${rows.join('　/　')}</span>
    ${anyProvisional?`<br><span class="muted small">「仮」は村山さんに確認できていない日数です
      （電力申請の代行業者のリードタイム、部品の納期）。確認できたらマスタの設定で直します。</span>`:''}
  </div>`;
}

    ${flowHtml(j)}

    <div class="scroll"><table class="mktbl tight">
      <thead><tr><th colspan="6" class="gq">見積書<span>お客様に出る</span></th>

        <tr><th style="min-width:240px">品名</th><th class="n">数量</th><th>単位</th><th class="n">単価</th>
        <th class="n">金額</th><th>摘要</th>${hasItemCost?'<th class="n c c1">原価</th>':''}</tr></thead>
      <tbody>${items.map(it=>`<tr>

        <td class="n">${Number(it.unit_price)?yen(it.unit_price):''}</td>
        <td class="n">${Number(it.amount)?yen(it.amount):''}</td>

    ${String(j.note||'').trim()?`<div class="small" style="margin-top:8px;white-space:pre-wrap"><b>備考</b>　${esc(j.note)}</div>`:''}

    <div class="mksplit">
      <div class="mkq"><div class="ptot">

        <div><span>合計（税抜）</span><span>${yen(j.total_ex_tax)}</span></div>
        <div><span>消費税（${Math.round(Number(j.tax_rate||0)*100)}%）</span><span>${yen(j.tax_amount)}</span></div>
        <div class="g"><span>総合計</span><span>${yen(j.total_in_tax)}</span></div>
      </div></div>
      <div class="mkc">${hasCost?`<div class="profit">
        <div class="phead">原価と粗利</div>
        <div class="ptot" style="margin:0;width:auto">
          <div><span>売上（税抜）</span><span>${yen(ex)}</span></div>
          <div><span>原価（明細）</span><span>${yen(itemCost)}</span></div>
          ${lDays||lCost?`<div><span>原価（人工 ${lDays}人日${lUnit?' × '+yen(lUnit):''}${lVendor?'・'+esc(lVendor):''}）</span><span>${yen(lCost)}</span></div>`:''}
          <div class="g"><span>粗利</span><span style="color:${gcol}">${yen(ex-cost)}（${gpr.toFixed(1)}%）</span></div>
        </div></div>`:`<div class="muted small" style="padding-top:10px">この案件には原価が入っていません。</div>`}</div>
    </div>

    <div id="workBox"></div>
    <div class="card" style="margin-top:16px" id="billsBox"></div>

    <div class="card" style="margin-top:16px" id="filesBox">
      <h2>図面・添付</h2><div class="muted small">読み込み中…</div></div>
    <div class="small muted" style="margin-top:10px">version ${j.version}${j.source_file?' ／ 元Excel: '+esc(j.source_file):''}</div>`;
  document.querySelectorAll('#dlgB [data-print]').forEach(b=>b.onclick=()=>printDoc(j, items, b.dataset.print));
  const go=document.getElementById('gotoFiles');
  if(go) go.onclick=()=>{ const box=document.getElementById('filesBox');
    if(box) document.getElementById('dlgB').scrollTop = box.offsetTop - 30; };
  const ej=document.getElementById('editJob');
  if(ej) ej.onclick=()=>editJob(j.id);
  const hd=document.getElementById('handoverDoc');
  if(hd) hd.onclick=()=>printHandover(j, items);

/* ============================================================
   外注からの請求 ― 見込みの原価と照合する（2026-09-29 大嶺さん「①すすめて」）
   ------------------------------------------------------------
   置き場所: seek_jobs.data.vendor_bills = [{ id, vendor, billed_at, kind, amount_in, tax_mode,
             amount_ex, memo, file:{path,name,size,mime}, at, by }]
   ・DBの形は変えない（10/1に間に合わせるため）。data は事務だけが読める
     （現場のスマホが読む seek_field_jobs には data を出していない）
   ・★請求書のPDFは seek_files に入れない。入れると現場のスマホの「資料」に出る＝原価が見える。
     Storage の office/bills/ に置き、場所は data にだけ持つ
   ・比べるのは税抜。見込みの原価（明細の原価＋人工）が税抜なので、税込で入れたら10%を除く
   ・書くときは「最新を読む → 足す → version付きで書く」。取り合いになったら読み直す
   ============================================================ */
const BILL_KINDS = ['人工','外注工事','材料','その他'];
const billsOf = j => ((j && j.data && j.data.vendor_bills) || []).slice();
async function patchJobData(jobId, mutate){
  for(let n=0; n<3; n++){
    const r = await fetch(`${SB_URL}/rest/v1/seek_jobs?id=eq.${encodeURIComponent(jobId)}&select=id,version,data`,
                          {headers: await H()});
    if(!r.ok) throw new Error('案件を読めませんでした（'+r.status+'）');
    const cur = (await r.json())[0];
    if(!cur) throw new Error('案件が見つかりません');
    const data = Object.assign({}, cur.data||{});
    mutate(data);
    const p = await fetch(`${SB_URL}/rest/v1/seek_jobs?id=eq.${encodeURIComponent(jobId)}&version=eq.${cur.version}`, {
      method:'PATCH', headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
      body: JSON.stringify({data}) });
    if(!p.ok) throw new Error('保存できませんでした（'+p.status+'）'+(await p.text()).slice(0,120));
    const rows = await p.json();
    if(rows.length){
      const i = M.jobs.findIndex(x=>x.id===jobId);
      if(i>=0) M.jobs[i] = Object.assign({}, M.jobs[i], rows[0]);
      return rows[0];
    }
    // version が変わっていた＝その間に誰かが直した。読み直してもう一度
  }
  throw new Error('ほかの人が同時にこの案件を直していたため保存できませんでした。もう一度押してください');
}
async function uploadBillFile(jobId, billId, file){
  if(file.size > MAX_FILE) throw new Error(`${file.name} は ${(file.size/1048576).toFixed(1)}MB あります（上限25MB）`);
  const ext = (file.name.match(/\.[A-Za-z0-9]{1,8}$/)||[''])[0].toLowerCase();
  const key = `office/bills/${jobId}/${billId}${ext}`;
  const up = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${key}`, {
    method:'POST', headers: await H({'Content-Type': file.type || 'application/octet-stream', 'x-upsert':'true'}),
    body: file });
  if(!up.ok) throw new Error(`${file.name} のアップロードに失敗（${up.status}）${(await up.text()).slice(0,120)}`);
  return { path:key, name:file.name, size:file.size, mime:file.type||'' };
}
function drawBills(jobId, plan){
  const box = document.getElementById('billsBox'); if(!box) return;
  const j = M.jobs.find(x=>x.id===jobId) || {};
  const bills = billsOf(j).sort((a,b)=>String(a.billed_at||'').localeCompare(String(b.billed_at||'')));
  const actual = bills.reduce((a,b)=>a+Number(b.amount_ex||0),0);
  const diff = actual - plan.cost;
  const tone = v => v>0 ? 'var(--danger)' : v<0 ? 'var(--ok)' : 'var(--ink)';
  const sgn = v => v>0 ? '＋'+yen(v) : v<0 ? '−'+yen(-v) : '±0';
  const gp = plan.ex - actual, gpr = plan.ex ? gp/plan.ex*100 : null;
  // 人工は外注先がはっきりしているので、その外注先の請求だけで見込みと比べられる
  const lv = String(plan.lVendor||'').trim();
  const lActual = lv ? bills.filter(b=>String(b.vendor).trim()===lv).reduce((a,b)=>a+Number(b.amount_ex||0),0) : 0;
  const defVendor = lv && !bills.some(b=>String(b.vendor).trim()===lv) ? lv : '';
  box.innerHTML = `
    <div class="row" style="align-items:baseline"><h2 style="margin:0">外注からの請求</h2>
      <span class="muted small">届いた請求書をここに入れると、見込みの原価と比べます（社内だけ・現場のスマホには出ません）</span></div>
    ${bills.length ? `
    <div class="bill-sum">
      <div><div class="k">見込みの原価</div><div class="v">${plan.cost ? yen(plan.cost) : '—'}</div></div>
      <div><div class="k">請求の合計</div><div class="v">${yen(actual)}</div></div>
      <div><div class="k">差（請求 − 見込み）</div>
        <div class="v" style="color:${plan.cost?tone(diff):'var(--muted)'}">${plan.cost ? sgn(diff) : '—'}</div>
        <div class="s">${!plan.cost ? '見込みの原価が入っていないので比べられません'
          : diff>0 ? '見込みより高い' : diff<0 ? '見込みより安い' : '見込みどおり'}</div></div>
      <div><div class="k">実際の粗利</div>
        <div class="v" style="color:${gpr==null?'inherit':gpr>=20?'var(--ok)':gpr>=0?'var(--warn)':'var(--danger)'}">${yen(gp)}</div>
        <div class="s">${gpr==null?'':gpr.toFixed(1)+'%'}</div></div>
    </div>
    ${lv && plan.lCost ? `<div class="small" style="margin:6px 0 2px">人工（${esc(lv)}）：見込み ${yen(plan.lCost)} → 請求 ${yen(lActual)}
      <b style="color:${tone(lActual-plan.lCost)}">（${sgn(lActual-plan.lCost)}）</b></div>`:''}
    <div class="small muted" style="margin-top:4px">税抜で比べています。まだ届いていない請求があれば、その分だけ「請求の合計」は少なく出ます。</div>
    <div class="scroll" style="margin-top:8px"><table class="tight">
      <thead><tr><th>請求日</th><th>外注先</th><th>内容</th><th class="n">金額（税抜）</th><th>メモ</th><th>請求書</th><th></th></tr></thead>
      <tbody>${bills.map(b=>`<tr>
        <td>${esc(b.billed_at||'')}</td><td>${esc(b.vendor||'')}</td><td class="small">${esc(b.kind||'')}</td>
        <td class="n">${yen(b.amount_ex)}${b.tax_mode==='税込'?`<div class="small muted">税込 ${yen(b.amount_in)}</div>`:''}</td>
        <td class="small muted">${esc(b.memo||'')}</td>
        <td>${b.file?`<button class="btn ghost sm" data-bopen="${esc(b.id)}">開く</button>`:'<span class="muted small">なし</span>'}</td>
        <td><button class="btn ghost sm" data-bdel="${esc(b.id)}" title="この請求を消す">×</button></td></tr>`).join('')}</tbody></table></div>`
    : `<div class="muted small" style="margin:6px 0 2px">まだ請求は入っていません。${plan.cost?`見込みの原価は <b>${yen(plan.cost)}</b>（税抜）です。`:''}</div>`}
    <div class="bill-form">
      <label class="f">外注先<input id="bVendor" list="bVendorList" value="${esc(defVendor)}" placeholder="選ぶか打つ" style="width:150px"></label>
      <datalist id="bVendorList">${laborVendorNames().map(v=>`<option value="${esc(v.name)}">`).join('')}</datalist>
      <label class="f">請求日<input id="bDate" type="date" value="${today()}"></label>
      <label class="f">内容<select id="bKind">${BILL_KINDS.map(k=>`<option ${k===(defVendor?'人工':'外注工事')?'selected':''}>${k}</option>`).join('')}</select></label>
      <label class="f">金額<span class="row" style="gap:4px;flex-wrap:nowrap">
        <input id="bAmt" placeholder="0" style="width:110px;text-align:right">
        <select id="bTax"><option>税込</option><option>税抜</option></select></span></label>
      <label class="f">メモ<input id="bMemo" placeholder="任意" style="width:140px"></label>
      <label class="f">請求書（PDF・写真）<input id="bFile" type="file" accept="application/pdf,image/*"></label>
      <button class="btn sm" id="bAdd">追加する</button>
    </div>
    <div id="bMsg"></div>`;

  const msg = m => { document.getElementById('bMsg').innerHTML = m; };
  document.getElementById('bAdd').onclick = async () => {
    const vendor = document.getElementById('bVendor').value.trim();
    const billed_at = document.getElementById('bDate').value;
    const amt = numIn(document.getElementById('bAmt').value);
    const tax_mode = document.getElementById('bTax').value;
    if(!vendor) return msg('<div class="err">外注先を入れてください</div>');
    if(!billed_at) return msg('<div class="err">請求日を入れてください</div>');
    if(!(amt>0)) return msg('<div class="err">金額を入れてください</div>');
    const btn = document.getElementById('bAdd'); btn.disabled = true; btn.textContent = '保存中…';
    const id = 'vb-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const f = (document.getElementById('bFile').files||[])[0];
    let file = null;
    try{
      if(f) file = await uploadBillFile(jobId, id, f);
      const bill = { id, vendor, billed_at, kind: document.getElementById('bKind').value,
        amount_in: amt, tax_mode, amount_ex: tax_mode==='税込' ? Math.round(amt/1.1) : amt,
        memo: document.getElementById('bMemo').value.trim(), file,
        at: new Date().toISOString(), by: (sbSession()||{}).email||'' };
      await patchJobData(jobId, d => { d.vendor_bills = (d.vendor_bills||[]).concat([bill]); });
      drawBills(jobId, plan);
      document.getElementById('bMsg').innerHTML = `<div class="ok">${esc(vendor)} の請求（税抜 ${yen(bill.amount_ex)}）を入れました。</div>`;
    }catch(e){
      // 請求は入らなかったのに PDF だけ残らないよう、置いたファイルを消す
      if(file) try{ await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${file.path}`,{method:'DELETE',headers:await H()}); }catch(_){}
      btn.disabled = false; btn.textContent = '追加する';
      msg(`<div class="err">${esc(e.message)}</div>`);
    }
  };
  box.querySelectorAll('[data-bopen]').forEach(b=>b.onclick = async () => {
    const x = bills.find(y=>y.id===b.dataset.bopen); b.disabled = true;
    try{ window.open(await fileUrl({storage_path: x.file.path}), '_blank', 'noopener'); }
    catch(e){ msg(`<div class="err">${esc(e.message)}</div>`); }
    finally{ b.disabled = false; }
  });
  box.querySelectorAll('[data-bdel]').forEach(b=>b.onclick = async () => {
    const x = bills.find(y=>y.id===b.dataset.bdel);
    if(!confirm(`${x.vendor} の請求（${x.billed_at}・税抜 ${yen(x.amount_ex)}）を消します。よろしいですか。`)) return;
    try{
      await patchJobData(jobId, d => { d.vendor_bills = (d.vendor_bills||[]).filter(y=>y.id!==x.id); });
      if(x.file) try{ await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${x.file.path}`,{method:'DELETE',headers:await H()}); }catch(_){}
      drawBills(jobId, plan);
    }catch(e){ msg(`<div class="err">${esc(e.message)}</div>`); }
  });
}

/* ============================================================
   案件の進み具合（2026-09-30 村山さん「状況変更みたいなのがない」
   「見積 → 受注 → 着工 → 完工 → 請求 → 入金 と、どんどん下に降りていく」）
   ------------------------------------------------------------
   ・案件の画面の上に6つの段を並べ、次の段のボタンを1つだけ目立たせる。押すとその日付も入る
     受注=data.ordered_at／着工=data.started_at（施工 開始が空なら入れる＝予定表に出る）／
     完工=delivered_at（納期）と data.completed_at（施工 終了が空なら入れる）／
     請求=invoiced_at と 支払期日（翌月末）／入金=paid_at
   ・日付は今日が入っているが、変えてから押せる。押し間違いは「ひとつ戻す」（日付は消さない）
   ・受注になったら「次にやること」（施工予定を入れる＝予定表に出る／電力申請の必要事項）を出す
   ・書くときは最新を読んで version 付きで（外注請求と同じ）
   ============================================================ */
const JFLOW = [
  { st:'見積提出', label:'見積提出', date:j=>j.quoted_at },
  { st:'受注',     label:'受注',     date:j=>(j.data||{}).ordered_at },
  { st:'施工中',   label:'着工',     date:j=>(j.data||{}).started_at || (j.data||{}).build_start },
  { st:'施工完了', label:'完工',     date:j=>(j.data||{}).completed_at || j.delivered_at },
  { st:'請求済',   label:'請求',     date:j=>j.invoiced_at },
  { st:'入金済',   label:'入金',     date:j=>j.paid_at },
];
const flowIndex = st => st==='手配' ? 1 : JFLOW.findIndex(f=>f.st===st);
const endOfNextMonth = d => { const x=new Date(d); const e=new Date(x.getFullYear(), x.getMonth()+2, 0);
  return new Date(e.getTime()-e.getTimezoneOffset()*60000).toISOString().slice(0,10); };
function flowPatch(step, d, j){
  const D = j.data||{};
  switch(step){
    case 1: return { cols:{status:'受注'}, data:{ordered_at:d} };
    case 2: return { cols:{status:'施工中'}, data:Object.assign({started_at:d}, D.build_start?{}:{build_start:d}) };
    case 3: return { cols:Object.assign({status:'施工完了'}, j.delivered_at?{}:{delivered_at:d}),
                     data:Object.assign({completed_at:d}, D.build_end?{}:{build_end:d}, D.build_start?{}:{build_start:d}) };
    case 4: return { cols:{status:'請求済', invoiced_at:d, due_date: j.due_date || endOfNextMonth(d)}, data:{} };
    case 5: return { cols:{status:'入金済', paid_at:d}, data:{} };
  }
  return null;
}
// 列と data を一緒に書く。最新を読んで、version が変わっていなければ書く（取り合いは3回まで読み直す）
async function patchJobFields(jobId, cols, dataPatch){
  for(let n=0; n<3; n++){
    const r = await fetch(`${SB_URL}/rest/v1/seek_jobs?id=eq.${encodeURIComponent(jobId)}&select=id,version,data`, {headers: await H()});
    if(!r.ok) throw new Error('案件を読めませんでした（'+r.status+'）');
    const cur = (await r.json())[0]; if(!cur) throw new Error('案件が見つかりません');
    const body = Object.assign({}, cols||{});
    if(dataPatch && Object.keys(dataPatch).length) body.data = Object.assign({}, cur.data||{}, dataPatch);
    const p = await fetch(`${SB_URL}/rest/v1/seek_jobs?id=eq.${encodeURIComponent(jobId)}&version=eq.${cur.version}`, {
      method:'PATCH', headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
      body: JSON.stringify(body) });
    if(!p.ok) throw new Error('保存できませんでした（'+p.status+'）'+(await p.text()).slice(0,120));
    const rows = await p.json();
    if(rows.length){ const i=M.jobs.findIndex(x=>x.id===jobId); if(i>=0) M.jobs[i]=Object.assign({}, M.jobs[i], rows[0]); return rows[0]; }
  }
  throw new Error('ほかの人が同時にこの案件を直していたため保存できませんでした。もう一度押してください');
}

function bindFlow(j){
  const root = document.getElementById('dlgB');
  const after = async (fn) => { try{ await fn(); await openJob(j.id); } catch(e){ alert(e.message); } };
  root.querySelectorAll('[data-flowgo]').forEach(b=>b.onclick=()=>{
    const step=+b.dataset.flowgo, d=(document.getElementById('flowDate')||{}).value || today();
    const p=flowPatch(step, d, j); if(!p) return; b.disabled=true;
    after(()=>patchJobFields(j.id, p.cols, p.data));
  });
  root.querySelectorAll('[data-flowto]').forEach(b=>b.onclick=()=>{
    const f=JFLOW[+b.dataset.flowto]; if(!confirm(`状態を「${f.st}」に戻します。入れた日付はそのまま残ります。よろしいですか。`)) return;
    b.disabled=true; after(()=>patchJobFields(j.id, {status:f.st}, null));
  });
  root.querySelectorAll('[data-flowcancel]').forEach(b=>b.onclick=()=>{
    if(!confirm('この案件を「キャンセル」にします。よろしいですか。（あとで戻せます）')) return;
    b.disabled=true; after(()=>patchJobFields(j.id, {status:'キャンセル'}, null));
  });
  const dj=document.getElementById('delJob'); if(dj) dj.onclick=async()=>{
    const billed = /請求済|入金済/.test(j.status||'');
    if(!confirm(`「${j.title||''}」（${j.job_no||'番号なし'}）を削除します。\n`
      + (billed?'⚠ 請求済みの案件です。売上の集計からも外れます。\n':'')
      + `\n一覧・予定表・現場のスマホから消えます。\n「案件を探す」→「ゴミ箱」からいつでも戻せます。よろしいですか。`)) return;
    dj.disabled=true;
    try{
      const row = await patchJobFields(j.id, {status:'キャンセル'},
        {deleted_at:new Date().toISOString(), deleted_by:(sbSession()||{}).email||'', deleted_prev_status:j.status});
      const k=M.jobs.findIndex(x=>x.id===j.id); const moved = k>=0 ? M.jobs.splice(k,1)[0] : row;
      (M.trash=M.trash||[]).unshift(Object.assign({}, moved, row));
      try{ dlg.close(); }catch(e){}
      render(); setBar(`削除しました（${j.job_no||j.title||''}）。「案件を探す」→「ゴミ箱」から戻せます`);
    }catch(e){ dj.disabled=false; alert(e.message); }
  };
  root.querySelectorAll('[data-flowlost]').forEach(b=>b.onclick=()=>{
    if(!confirm('この案件を「失注」にします。よろしいですか。（あとで戻せます）')) return;
    b.disabled=true; after(()=>patchJobFields(j.id, {status:'失注'}, null));
  });
  const bs=document.getElementById('flowBsave'); if(bs) bs.onclick=()=>{
    const s=document.getElementById('flowBs').value, e=document.getElementById('flowBe').value||s,
          o=document.getElementById('flowOd').value;
    if(!s && !e && !o) return alert('施工開始・完工予定日・オープン予定日のどれかを入れてください');
    if(s && e && e < s) return alert('完工予定日が施工開始より前になっています');
    bs.disabled=true;
    const dataP = {}; if(s) dataP.build_start=s; if(e) dataP.build_end=e; if(!s && e) dataP.build_start=e;
    after(()=>patchJobFields(j.id, o ? {open_date:o} : null, dataP));
  };
  const pw=document.getElementById('flowPower'); if(pw) pw.onclick=()=>printPower(j);
  const fsb=document.getElementById('flowSub'); if(fsb) fsb.onclick=()=>openSubMail(j);
}

/* ============================================================
   帳票をメールで送る（2026-09-30 村山さん「プレビューを見て、そのままメールに添付」）
   ------------------------------------------------------------
   ・帳票をPDFファイルにする。印刷の「PDFに保存」は手元に保存するだけでファイルを受け取れないので、
     html2pdf（html2canvas＋jsPDF）で画面の帳票を画像にしてPDFにする。使うときだけ読み込む
   ・html2canvas は mix-blend-mode と縦書きを描けない → PDFにする写しでだけ
     会社印の白を透明にし、担当者印（村山）を絵に描いて差し替える（画面と印刷はそのまま）
   ・PDFは Storage の office/outbox/ に置き（seek_files には入れない＝現場に出ない）、
     seek_outbox に1行入れる。メール取込のGAS（5分おき）が村山さんのGmailに下書きを作る
   ============================================================ */
let _h2p = null;
function loadHtml2pdf(){
  if(window.html2pdf) return Promise.resolve();
  if(_h2p) return _h2p;
  _h2p = new Promise((ok,ng)=>{ const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js';
    s.onload=ok; s.onerror=()=>{ _h2p=null; ng(new Error('PDFを作る部品を読み込めませんでした（インターネットにつながっているか確認してください）')); };
    document.head.appendChild(s); });
  return _h2p;
}
function whiteToClear(src){
  return new Promise(ok=>{ const im=new Image(); im.onload=()=>{
    const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight;
    const g=c.getContext('2d'); g.drawImage(im,0,0); const d=g.getImageData(0,0,c.width,c.height), p=d.data;
    for(let k=0;k<p.length;k+=4) if(p[k]>235&&p[k+1]>235&&p[k+2]>235) p[k+3]=0;
    g.putImageData(d,0,0); ok(c.toDataURL('image/png')); }; im.onerror=()=>ok(src); im.src=src; });
}
function stampImage(name, w, h){
  const s=4, c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
  const g=c.getContext('2d'), lw=1.25*96/72*s;
  g.strokeStyle='#f00'; g.lineWidth=lw; g.beginPath();
  g.ellipse(c.width/2, c.height/2, c.width/2-lw/2, c.height/2-lw/2, 0, 0, Math.PI*2); g.stroke();
  const ch=[...String(name||'')], fs=Math.min(c.height*0.34, c.height*0.8/Math.max(1,ch.length));
  g.fillStyle='#f00'; g.textAlign='center'; g.textBaseline='middle';
  g.font=`${fs}px 'HGP行書体','HGPGyoshotai','HG行書体',serif`;
  ch.forEach((x,k)=>g.fillText(x, c.width/2, c.height/2 + (k-(ch.length-1)/2)*fs*1.02));
  return c.toDataURL('image/png');
}
// 帯の縦書き（QUOTATION・SEEK DENSO）を絵にする。html2canvas は縦書き＋回転を描けないため
function vtextImage(el){
  const r=el.getBoundingClientRect(), cs=getComputedStyle(el), s=3;
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(r.width*s)); c.height=Math.max(1,Math.round(r.height*s));
  const g=c.getContext('2d'); g.fillStyle=cs.color; g.textBaseline='middle'; g.textAlign='center';
  g.font=`${cs.fontWeight} ${parseFloat(cs.fontSize)*s}px ${cs.fontFamily}`;
  const ls=parseFloat(cs.letterSpacing)||0; if('letterSpacing' in g) g.letterSpacing=(ls*s)+'px';
  g.translate(c.width/2, c.height/2);
  g.rotate(/rotate\(180deg\)|matrix\(-1/.test(cs.transform) ? -Math.PI/2 : Math.PI/2);   // 下から上／上から下
  g.fillText(el.textContent, 0, 0);
  const im=document.createElement('img'); im.src=c.toDataURL('image/png');
  im.style.cssText=`position:absolute;left:${el.offsetLeft}px;top:${el.offsetTop}px;width:${r.width}px;height:${r.height}px`;
  return im;
}
async function paperToPdfBlob(paperEl){
  await loadHtml2pdf();
  const box=document.createElement('div');
  box.style.cssText='position:fixed;left:-12000px;top:0;width:210mm;background:#fff';
  const clone=paperEl.cloneNode(true); box.appendChild(clone); document.body.appendChild(box);
  try{
    for(const img of clone.querySelectorAll('img.xseal, img.seal')) img.src = await whiteToClear(img.src);
    for(const st of clone.querySelectorAll('.xstamp, .stamp')){
      const r=st.getBoundingClientRect(), im=document.createElement('img');
      im.src=stampImage(st.textContent.trim(), r.width, r.height);
      im.style.cssText = st.style.cssText; im.style.width=r.width+'px'; im.style.height=r.height+'px';
      im.style.border='0'; if(getComputedStyle(st).position==='absolute') im.style.position='absolute';
      st.replaceWith(im);
    }
    for(const v of clone.querySelectorAll('.band .vt, .band .vs')) v.replaceWith(vtextImage(v));
    const page = clone.querySelector('.xpage, .apage');
    if(page.classList.contains('xpage')) page.style.height='296mm'; else page.style.minHeight='296mm';   // 端数で白紙の2枚目が出ないように
    await new Promise(r=>setTimeout(r,100));
    return await html2pdf().set({ margin:0, image:{type:'jpeg', quality:0.95},
      html2canvas:{scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false},
      jsPDF:{unit:'mm', format:'a4', orientation:'portrait'}, pagebreak:{mode:['css','legacy']} })
      .from(page).outputPdf('blob');
  } finally { box.remove(); }
}

  try{ files = await listFiles(jobId); }
  catch(e){ box.innerHTML=`<h2>図面・添付</h2><div class="err">${esc(e.message)}</div>`; return; }
  const btn=document.getElementById('gotoFiles');
  if(btn) btn.textContent = files.length ? `図面・添付 ${files.length}` : '図面を添付';
  box.innerHTML = `<h2>図面・添付（${files.length}件）</h2>
    <div class="row" style="margin-bottom:10px">
      <label class="f">種類<select id="fkind">
        ${['図面','着工前写真','完了後写真','写真','納品書','見積書','その他'].map(k=>`<option>${k}</option>`).join('')}</select></label>
      <label class="f">ファイル<input type="file" id="fpick" multiple></label>
      <button class="btn sm" id="fup">追加する</button>
      <span class="muted small">メールに添付されてきた図面PDFをそのまま入れてください（1つ25MBまで）</span>
    </div>
    <div id="fmsg"></div>
    ${files.length ? `<div class="scroll"><table>
      <thead><tr><th>種類</th><th>ファイル名</th><th class="n">サイズ</th><th>追加日</th><th></th></tr></thead>
      <tbody>${files.map(f=>`<tr>
        <td><span class="tag q">${esc(f.kind)}</span></td>
        <td>${esc(f.file_name)}</td>
        <td class="n small">${fileSize(f.byte_size)}</td>
        <td class="small muted">${esc(String(f.created_at||'').slice(0,10))}</td>
        <td><button class="btn ghost sm" data-open="${esc(f.id)}">開く</button>
            <button class="btn ghost sm" data-del="${esc(f.id)}">削除</button></td></tr>`).join('')}
      </tbody></table></div>`
      : '<div class="muted small">まだ添付はありません。</div>'}`;

  const msg=m=>{ document.getElementById('fmsg').innerHTML=m; };
  document.getElementById('fup').onclick=async()=>{
    const inp=document.getElementById('fpick');
    if(!inp.files.length){ msg('<div class="err">ファイルを選んでください</div>'); return; }
    const kind=document.getElementById('fkind').value;
    const btn=document.getElementById('fup'); btn.disabled=true; btn.textContent='追加中…';
    const ok=[], ng=[];
    for(const f of inp.files){
      try{ await uploadFile(jobId, f, kind); ok.push(f.name); }
      catch(e){ ng.push(e.message); }
    }
    btn.disabled=false; btn.textContent='追加する';
    await drawFiles(jobId);
    // fail-closed: 入ったものと入らなかったものを両方はっきり出す
    msg((ok.length?`<div class="ok">${ok.length}件を追加しました（${ok.map(esc).join(' / ')}）</div>`:'')
      + (ng.length?`<div class="err">${ng.length}件は追加できませんでした<br>${ng.map(esc).join('<br>')}</div>`:''));
  };
  box.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{
    const f=files.find(x=>x.id===b.dataset.open);
    b.disabled=true;
    try{ window.open(await fileUrl(f),'_blank','noopener'); }
    catch(e){ msg(`<div class="err">${esc(e.message)}</div>`); }
    finally{ b.disabled=false; }
  });
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    const f=files.find(x=>x.id===b.dataset.del);
    if(!confirm(`「${f.file_name}」を削除します。よろしいですか。`)) return;
    try{ await deleteFile(f); await drawFiles(jobId); }
    catch(e){ msg(`<div class="err">${esc(e.message)}</div>`); }
  });
}

/* 帳票の様式は、村山さんが実際にお客様へ出している紙の御見積書に合わせている

/* どの行が「小計②の下」に来るか。

const EXPENSE_RE = /諸経費|福利/;
const inSection2 = it => (it.section!=null ? Number(it.section)===2 : EXPENSE_RE.test(it.name||''));
/* ==== XFORM START ====
   帳票（御見積書・請求書）― Excelの様式をそのまま再現する
   ------------------------------------------------------------
   2026-09-29 大嶺さん「見積書と請求書の様式は忠実に再現して。印鑑も」。
   寸法は、Excelが出したPDF（2026　8月/AP牧志コインPゲート処分費.pdf ＝ 見積、SEEk.pdf ＝ 請求）を
   150dpiで画像にし、罫線と文字の位置を mm で測ったもの。フォントも Excel と同じ HG丸ゴシックM-PRO。
   ・明細の行数も Excel と同じ（見積 26行・請求 22行、経費 2行）。上2行を空けて書き始めるのも実物どおり。
     行があふれたときは表を下へ伸ばす（2ページ目に続く）。
   ・会社印は画像。★SEEK.html には入れない（公開ページなので誰でも持ち出せてしまう）。
     ログイン後に seek_settings.data.sealCompany（data URL）から読む。未登録なら押さない。
   ・担当者印（村山）は、Excel と同じく「赤い丸 ＋ HGP行書体の縦書き」を描いている（画像ではない）。
   ============================================================ */
const XF_PT = 0.3528;                          // 1pt = 0.3528mm
const XF_GRAY = '#d9d9d9';                     // Excelの灰色の行（実測 217/255）
function xfReiwa(iso){
  const m = String(iso||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(!m) return String(iso||'');
  const y = +m[1]-2018; return `令和${y===1?'元':y}年${+m[2]}月${+m[3]}日`;
}
function xfNum(v){ if(v===''||v==null) return ''; const n=Number(v); return isFinite(n) ? n.toLocaleString('ja-JP') : ''; }
// 長い文字は縮める（Excelの「縮小して全体を表示」と同じ）。全角1・半角0.55で幅を見積もる
function xfFit(text, pt, maxMm){
  let w=0; for(const ch of String(text||'')) w += /[\x20-\x7e｡-ﾟ]/.test(ch) ? 0.55 : 1;
  const need = w*pt*XF_PT; return (maxMm && need>maxMm) ? Math.max(5, pt*maxMm/need) : pt;
}
// 文字。y は PDF で測った「文字の枠の上端」。a = l/c/r（x は左端／中心／右端）
function xfT(x, y, text, o={}){
  const pt = xfFit(text, o.pt||9, o.max), a=o.a||'l', w=o.w||150;
  const left = a==='l' ? x : a==='c' ? x-w/2 : x-w;
  // HG丸ゴシックの字面は行の上端から少し下にある。元PDFと重ねて測った補正（文字の大きさに比例）
  return `<div class="xt" style="left:${left.toFixed(2)}mm;top:${(y+pt*XF_PT*0.03).toFixed(2)}mm;width:${w}mm;`
    + `text-align:${a==='l'?'left':a==='c'?'center':'right'};font-size:${pt.toFixed(2)}pt${o.css?';'+o.css:''}">${esc(text)}</div>`;
}
const xfH = (x1,y,x2,t=0.17,c='#000') =>
  `<div class="xl" style="left:${x1}mm;top:${(y-t/2).toFixed(3)}mm;width:${(x2-x1).toFixed(2)}mm;height:${t}mm;background:${c}"></div>`;
const xfV = (x,y1,y2,t=0.17,c='#000') =>
  `<div class="xl" style="left:${(x-t/2).toFixed(3)}mm;top:${y1}mm;width:${t}mm;height:${(y2-y1).toFixed(2)}mm;background:${c}"></div>`;
const xfR = (x1,y1,x2,y2,fill) =>
  `<div class="xl" style="left:${x1}mm;top:${y1}mm;width:${(x2-x1).toFixed(2)}mm;height:${(y2-y1).toFixed(2)}mm;background:${fill}"></div>`;
const xfBox = (x1,y1,x2,y2,t=0.34,c='#000') =>
  xfH(x1,y1,x2,t,c)+xfH(x1,y2,x2,t,c)+xfV(x1,y1,y2,t,c)+xfV(x2,y1,y2,t,c);
// 担当者印：赤い丸（1.25pt）の中に HGP行書体 12pt の縦書き。Excelの図形と同じ作り
function xfStamp(x1,y1,x2,y2,name){
  const n = String(name||'').trim(); if(!n) return '';
  const pt = n.length<=2 ? 12 : Math.max(7, 24/n.length);
  return `<div class="xstamp" style="left:${x1}mm;top:${y1}mm;width:${(x2-x1).toFixed(2)}mm;height:${(y2-y1).toFixed(2)}mm;font-size:${pt}pt"><span>${esc(n)}</span></div>`;
}
const xfSeal = (x1,y1,x2,y2,src) => src
  ? `<img class="xseal" alt="" src="${esc(src)}" style="left:${x1}mm;top:${y1}mm;width:${(x2-x1).toFixed(2)}mm;height:${(y2-y1).toFixed(2)}mm">` : '';

/* 様式ごとの寸法（mm）。PDFの実測値 */
const XF = {

/* 見積書・請求書のプレビュー → 印刷／PDF。
   opt.draft … 「見積を作る」の途中（まだ保存していない）から開いたとき。 */
let docStyleNow = null;    // プレビューで切り替えた様式（このあと開く帳票にも使う）
function printDoc(j, items, kind, opt={}){
  const isQ = kind==='quote';
  const bank = M.banks.find(b=>b.id===j.bank_account_id) || M.banks.find(b=>b.is_default) || M.banks[0] || {};
  const S = M.settings || {};
  const c = clientMap.get(j.client_id);
  // 宛名：Excelから移行した案件は、当時の紙に書いた宛名（client_name）をそのまま出す。
  // 画面で作った案件の client_name は短い呼び名（アップルパーク）なので、正式名（株式会社アップルパーク）を出す。
  const client = (j.client_name && c && j.client_name!==c.name) ? j.client_name
               : ((c && c.formal_name) || j.client_name || '');
  // Excelに空行がそのまま残っている明細がある（品名も金額も無い）。帳票には出さない。
  // ⚠ 金額か数量か単価が入っているものは、品名が空でも必ず残す
  //    （移行の初期に品名だけ見て落として 35,500円 を1件飛ばしたことがある）
  const printable = items.filter(it => Number(it.amount) || Number(it.unit_price) || Number(it.qty)
                                    || (it.name||'').trim().replace('(品名なし)',''));
  const work = printable.filter(it=>!inSection2(it)), expense = printable.filter(inSection2);
  const sum = a => a.reduce((t,it)=>t+Number(it.amount||0),0);
  const sub1 = sum(work), sub2 = sum(expense);
  const ex = Number(j.total_ex_tax||0);
  // 移行した案件は当時の金額を凍結しているので、明細を足した値と合わないことがある（実データで3件）
  const gap = (sub1+sub2) - (ex - Number(j.discount||0));
  const date = isQ ? (j.quoted_at || today()) : (j.invoiced_at || today());
  const seal = S.sealCompany || '';
  // 様式：前衛（既定）／Excelと同じ。プレビューの切り替え → 設定の既定 → 前衛 の順
  const style = opt.style || docStyleNow || (M.settings||{}).docStyle || 'avant';
  const html = (style==='excel' ? xformHtml : xformAvantHtml)({
    kind, date, client, title: j.title||'', no: j.job_no||'',
    total: Number(j.total_in_tax||0), sub1, sub2, discount: Number(j.discount||0), ex,
    taxRate: Number(j.tax_rate||0), tax: Number(j.tax_amount||0),
    work, expense,
    delivered: j.delivered_at || '', payTerms: j.payment_terms || S.paymentTerms || '現金', due: j.due_date || '',
    site: [j.site_address, j.site_building].filter(Boolean).join(' '),
    bank, S, seal, stamp: S.stampName || '村山', note: String(j.note||'').trim() });
  const warn = [];
  if(opt.draft) warn.push('<b>まだ保存していない見積です。</b>画面で入れている内容をそのまま見積書にしています。');
  if(!seal) warn.push('会社印がまだ登録されていないので、印鑑なしで出ています。マスタ →「帳票・印鑑」で登録できます。');
  if(!isQ && !j.invoiced_at) warn.push('請求日が入っていないので、発行日は今日の日付で出しています。');
  if(!isQ && !S.regNo) warn.push('登録番号（インボイス）が未登録なので出していません。マスタ →「帳票・印鑑」で登録できます。');
  if(style==='excel' && work.length > XF[kind].work[1]) warn.push(`明細が${work.length}行あり、1枚（${XF[kind].work[1]}行）に入りきらないので2枚目に続きます。`);
  if(gap) warn.push(`明細の合計（${yen(sub1+sub2)}）と、この案件に記録されている合計（${yen(ex-Number(j.discount||0))}）が
    ${yen(Math.abs(gap))} ちがいます。Excelから移行した当時の金額をそのまま出しています。`);
  document.getElementById('dlgT').textContent = isQ?'見積書プレビュー':'請求書プレビュー';
  document.getElementById('dlgB').innerHTML = `
    ${warn.length?`<div class="note" style="margin-top:0">${warn.join('<br>')}</div>`:''}
    <div class="row" style="margin:0 0 12px">
      <div class="seg" title="マスタ → 帳票・印鑑 で、いつもの様式を決められます">
        <button data-dstyle="avant" class="${style!=='excel'?'on':''}">前衛</button>
        <button data-dstyle="excel" class="${style==='excel'?'on':''}">Excelと同じ</button></div>
      <button class="btn" id="doPrint">印刷 / PDFで保存</button>
      <button class="btn ghost" id="doMail" ${opt.draft?'disabled title="保存してから送れます"':''}>メールで送る</button>
      <span class="muted small">印刷画面で「PDFに保存」を選ぶとPDFになります（用紙 A4・余白なし）</span>
    </div>
    <div style="overflow:auto;background:var(--bg);padding:10px;border-radius:8px">
      <div class="paper xpaper">${html}</div></div>
    <div id="mailBox" style="margin-top:12px"></div>
    <div class="note" style="margin-top:10px">取引先に送る前に、必ずこの内容を目で確認してください
      （標準手順書 G2「外部送信は人間の最終確認を通す」）。</div>`;
  if(!dlg.open) dlg.showModal();
  document.querySelectorAll('#dlgB [data-dstyle]').forEach(b=>b.onclick=()=>{
    docStyleNow=b.dataset.dstyle; printDoc(j, items, kind, Object.assign({}, opt, {style:docStyleNow})); });
  const fname = [isQ?'見積書':'請求書', j.job_no, (client||'').replace(/[\\/:*?"<>|]/g,''),
     (j.title||'').replace(/^仮\s*[）)]\s*/,'').replace(/[\\/:*?"<>|]/g,'').slice(0,30)].filter(Boolean).join('_');
  const pb=document.getElementById('doPrint');
  if(pb) pb.onclick=()=>printPaper(fname);
  const mb=document.getElementById('doMail');
  if(mb && !opt.draft) mb.onclick=()=>openMailForm(j, kind, fname);
}

/* ============================================================
   引渡書（全体フロー §1-2 工程12「引き渡し書作成（写真つき ビフォーアフター）」）
   ------------------------------------------------------------
   写真は現場のスマホ（SEEK_mobile.html）から着工前・完了後として上げてもらう。
   Storage は Public OFF なので、そのままでは印刷に載らない
   （署名付きURLは1時間で切れる＋PDF化のときに読み直しに行けない）。
   → その場で data URL に焼いてから紙に載せる。
   ⚠ 引渡書に金額は出さない。お客様に渡す完了の証で、請求は別紙。
   ============================================================ */
async function toDataUrl(f){
  const url = await fileUrl(f);
  const res = await fetch(url);
  if(!res.ok) throw new Error(f.file_name+' を読めませんでした（'+res.status+'）');
  const blob = await res.blob();
  return await new Promise((ok,ng)=>{ const r=new FileReader();
    r.onload=()=>ok(r.result); r.onerror=()=>ng(new Error(f.file_name+' を変換できませんでした'));
    r.readAsDataURL(blob); });
}

async function printHandover(j, items){
  const S = M.settings || {};
  document.getElementById('dlgT').textContent = '引渡書プレビュー';
  document.getElementById('dlgB').innerHTML = '<div class="muted small">写真を読み込んでいます…</div>';

  let files=[], logs=[];
  try{
    [files, logs] = await Promise.all([
      listFiles(j.id),
      sbFetchAll('seek_worklogs','select=*&job_id=eq.'+encodeURIComponent(j.id)+'&order=work_date.asc')
        .catch(()=>[])   // 日報がまだ無くても引渡書は出せる
    ]);
  }catch(e){
    document.getElementById('dlgB').innerHTML =
      `<div class="err">${esc(e.message)}</div>
       <button class="btn sm ghost" onclick="openJob('${esc(j.id)}')">案件に戻る</button>`;
    return;
  }

  const isPhoto = f => /写真/.test(f.kind) || /^image\//.test(f.mime_type||'');
  // listFiles は新しい順。引渡書は「撮った順」に並んでいるほうが読みやすいので古い順にする
  const old2new = a => a.slice().sort((x,y)=>String(x.created_at||'').localeCompare(String(y.created_at||'')));
  const before = old2new(files.filter(f=>/着工前/.test(f.kind)));
  const after  = old2new(files.filter(f=>/完了後/.test(f.kind)));
  const other  = old2new(files.filter(f=>isPhoto(f) && !/着工前|完了後/.test(f.kind)));

  // 1枚ずつ data URL に。読めなかったものは黙って飛ばさず、下に理由を出す
  const MAXP = 6;                        // 紙に載る枚数。多すぎると1件で何十枚も出てしまう
  const ng = [];
  const bake = async list => {
    const out=[];
    for(const f of list.slice(0,MAXP)){
      try{ out.push({f, src: await toDataUrl(f)}); }
      catch(e){ ng.push(e.message); }
    }
    return out;
  };
  const [bB, bA, bO] = [await bake(before), await bake(after), await bake(other)];

  const start = logs.length ? logs[0].work_date : null;
  const end   = logs.length ? logs[logs.length-1].work_date : (j.delivered_at||null);
  const nin   = logs.reduce((a,l)=>a+Number(l.workers||0),0);
  const addr  = [j.site_postal_code?('〒'+j.site_postal_code):'', j.site_address||'', j.site_building||'']
                  .filter(Boolean).join(' ');
  // 引渡書には金額を出さない。何をどれだけ納めたかだけ。
  const done = items.filter(it => (it.name||'').trim() && !inSection2(it)
                                && (Number(it.qty) || !Number(it.amount)===false));
  const cell = p => `<td style="width:50%;padding:4px;vertical-align:top">
    <img src="${p.src}" style="width:100%;height:auto;border:1px solid #999;display:block">
    <div style="font-size:10px;color:#555;margin-top:2px">${esc(p.f.file_name)}</div></td>`;
  const pairRows = (a,b) => {
    const n=Math.max(a.length,b.length); let h='';
    for(let i=0;i<n;i++){
      h += '<tr>' + (a[i]?cell(a[i]):'<td style="width:50%"></td>')
                  + (b[i]?cell(b[i]):'<td style="width:50%"></td>') + '</tr>';
    }
    return h;
  };
  const row = (label, val) => `<tr><th style="width:130px;text-align:left;background:#f2f2f2;
    border:1px solid #999;padding:6px 8px;font-weight:normal">${label}</th>
    <td style="border:1px solid #999;padding:6px 8px">${val}</td></tr>`;

  document.getElementById('dlgB').innerHTML = `
    <div class="paper">
      <h3 style="text-align:center;letter-spacing:.5em;margin-bottom:14px">工事完了引渡書</h3>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">

   パスワードはこの画面に表示するだけで、DBにもログにも残さない。

const EDGE = () => SB_URL + '/functions/v1/seek-users';
const ROLE_LABEL = {admin:'管理者（利用者を増やせる）', office:'事務所', field:'現場'};

async function edgeUsers(payload){
  let res;
  try{
    res = await fetch(EDGE(), { method:'POST',
      headers: await H({'Content-Type':'application/json'}), body: JSON.stringify(payload) });
  }catch(e){ const err=new Error('利用者の機能につながりませんでした'); err.notReady=true; throw err; }
  if(res.status===404){ const e=new Error('まだ設置されていません'); e.notReady=true; throw e; }
  const j = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(j.error || ('うまくいきませんでした（'+res.status+'）'));
  return j;
}
// 覚えやすくて強い作り。紛らわしい文字（0 O 1 l I）は使わない。
function makePassword(){
  const A='abcdefghijkmnopqrstuvwxyz', B='ABCDEFGHJKLMNPQRSTUVWXYZ', N='23456789', S='#$%+=?';
  const all=A+B+N+S, need=[A,B,N,S];
  const buf=new Uint32Array(16); crypto.getRandomValues(buf);
  let out = need.map((set,i)=>set[buf[i]%set.length]);
  for(let i=4;i<16;i++) out.push(all[buf[i]%all.length]);
  // 並びも混ぜる
  const mix=new Uint32Array(out.length); crypto.getRandomValues(mix);
  for(let i=out.length-1;i>0;i--){ const j=mix[i]%(i+1); [out[i],out[j]]=[out[j],out[i]]; }
  return out.join('');
}

// 帳票だけを印刷する。ダイアログの中身をそのまま印刷すると崩れるので複製してから。
function printPaper(title){
  const paper = document.querySelector('#dlgB .paper');
  if(!paper){ alert('印刷する帳票が見つかりません'); return; }
  const area = document.getElementById('printArea');
  area.innerHTML = '';
  area.appendChild(paper.cloneNode(true));
  const prev = document.title;
  document.title = title || prev;      // 「PDFとして保存」の既定ファイル名になる
  const cleanup = () => { area.innerHTML=''; document.title = prev;
    window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  window.print();
  setTimeout(cleanup, 3000);           // afterprint が来ないブラウザ向けの保険
}

/* ============================================================
   見積依頼メールの読み取り
   ------------------------------------------------------------
   実データ（案件986件・明細9,162行）から出した事実に基づく:
    ・案件名の「(12台)」は 95% の確率でそのまま明細の数量になっていた（183件中174件）
    ・工種の組合せは574通りあり「まるごと同じ型」はほぼ無い（上位3パターンで12〜23%）
    ・一方で「その種類の案件によく入る工種」は安定している
      （設置357件: 精算機78% / 諸経費67% / テント41% …）
   → だから「型のコピー」ではなく「候補を出現率順に出して✓を付ける」形にする。
   ============================================================ */
/* 種類の判定語。「入替」を先に見るのは、撤去と設置が両方書いてあるメールが
   実物では「入替え工事」だったため（2026-09-05 実物3通で確認）。 */
const KIND_RE = [['入替',/入替|入れ替|入換|えかえ|交換|更新|差し替|差替/],
                 ['撤去',/撤去|処分|解体|取外|取り外|取りはず|撤収/],
                 ['設置',/設置|新設|取付|取り付|据付|据え付/],
                 ['補修',/補修|修繕|修理/]];
/* 数量の単位。実物メールは「7台」「4本」「普通車３台」「63M」のように単位がばらばら。 */
const UNIT_RE = '台|本|枚|個|基|面|セット|式|箇所|ヶ所|カ所|車室|m|M|ｍ|Ｍ';
/* 材料を誰が出すか。単価表の supply_type に直結する（材工／材料支給／施工費別）。 */
const SUPPLY_RE = [['材料支給',/支給|貸与|お客様手配|客先手配|施主支給/],
                   ['材工',/当社手配|当社対応|SEEK様手配|SEEK様対応|ＳＥＥＫ様手配|ＳＥＥＫ様対応|弊社手配/i]];

// 全角の英数字だけ半角にする。カタカナの長音「ー」は触らない（ロープ→ロ-プ を防ぐ）。
function han(s){
  return String(s||'').replace(/[Ａ-Ｚａ-ｚ０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
}
const flatten = s => han(s).replace(/[\s　]/g,'');

/* 工事の種類を決める。
   件名（1行目）を本文より優先する。実物3通で、本文だけ見ると
   ①「１０月中解体予定」→撤去、②「取り外し」×3→撤去 と、2通とも取り違えた。
   件名に撤去語と設置語が両方あるとき、および本文で両方が拮抗するときは「入替」。 */
function kindOf(text){
  const count = s => KIND_RE.map(([k,re])=>{
    const m = String(s).match(new RegExp(re.source,'g')); return [k, m?m.length:0]; });
  const decide = (c, where) => {
    const g = Object.fromEntries(c);
    if(g['入替']) return {kind:'入替', why:where+'の「入替」'};
    if(g['撤去'] && g['設置']) return {kind:'入替', why:where+'に撤去と設置の両方'};
    const top = c.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0];
    return top ? {kind:top[0], why:where+'の「'+top[0]+'」'} : null;
  };
  const lines = String(text).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  return decide(count(lines[0]||''), '件名') || decide(count(text), '本文') || {kind:'', why:''};
}

/* 案件名。件名から【】や「見積依頼」の定型を落とす。
   実物: 「【見積り依頼】那覇市前島3丁目第4　機器入替え工事」→「那覇市前島3丁目第4 機器入替え工事」 */
function titleOf(text){
  const first = String(text).split(/\r?\n/).map(s=>s.trim()).filter(Boolean)[0] || '';
  return first
    .replace(/^(re|fw|fwd)\s*[:：]\s*/i,'')
    .replace(/^(件名|標題|表題|Subject)\s*[:：]\s*/i,'')
    .replace(/[【［\[](?:.*?見積.*?|ご?依頼|至急|再送)[】］\]]/g,'')
    .replace(/^[【［\[]([^】］\]]*)[】］\]]\s*/,'$1 ')        // 【ザ・パーク普天間第３】設置工事 → 中身を残す
    .replace(/\s*[（(].*[：:].*[）)]\s*$/,'')                 // 「((株)おきなわブレイク：福島知幸)」
    // 「お見積り**を**お願いします」のように助詞が挟まる書き方も落とす
    .replace(/(お?見積(書|り|もり)?)?\s*(作成)?\s*[をのはも]?\s*(依頼|お願い(いた|致)?します?)\s*$/,'')
    // 「〜設置工事のお見積り依頼」→ 上で「お見積り依頼」が落ちて「〜設置工事の」が残る。
    // 助詞や読点で終わる案件名は無いので、末尾の1文字を落とす。
    .replace(/[のをにへとがはや、，,・\-–—]+$/,'')
    .trim().slice(0,120);
}

/* 本文の箇条書きから「品目・数量・単位・支給区分」を1行ずつ拾う。
   実物②は全行がこの形（・精算機　1台 / ・バリカー設置　4本）、
   実物③は「・精算機　サニカ中古(前払い用) 支給」のように支給区分だけが付く。 */
const SKIP_LINE = /^(TEL|FAX|Mobile|E-?mail|URL|http|携帯|〒|住所|案件地|所在地|現場住所|運営方式|施設名|駐車場名|台数|件名|標題|表題|Subject|To|Cc|From)\b|^(TEL|FAX|携帯|住所|案件地|所在地|運営方式|施設名|駐車場名|台数)\s*[:：]/i;
function readLines(text){
  const out=[];
  const all=String(text).split(/\r?\n/);
  for(let i=0;i<all.length;i++){
    if(i===0) continue;                                   // 1行目は件名。品目ではない
    const s = han(all[i]).trim();
    if(!s) continue;
    /* 箇条書き／「項目：値」／表の行 だけを見る。
       表の行＝タブを含む行。HTMLメールの <table> と、Excelから貼り付けた表が同じ形になる。
       これが無いと、表で書かれた依頼メールは1行も拾えない（2026-09-08 の点検で確認）。 */
    const isRow = all[i].includes('\t');
    if(!/^[・･•\-*＊○◇◆■]/.test(s) && !/[:：]/.test(s) && !isRow) continue;
    // 表の見出し行（品名／数量／単位…）は品目ではない
    if(isRow && s.split('\t').map(x=>x.trim()).filter(Boolean)
                 .every(x=>/^(品名|品目|項目|工事名|工種|内容|名称|数量|数|単位|単価|金額|備考|摘要|no\.?|№|#)$/i.test(x))) continue;
    let body = s.replace(/^[・･•\-*＊○◇◆■]\s*/,'');
    if(isRow) body = body.replace(/\t+/g,' ').trim();
    if(SKIP_LINE.test(body)) continue;                     // 署名・現場情報の行
    if(/^\(?\d[\d\-()\s]{7,}$/.test(body)) continue;       // 電話番号だけの行
    let supply='';
    for(const [k,re] of SUPPLY_RE){ if(re.test(body)){ supply=k; break; } }
    // 括弧の中（「中古(2本足)」の 2本 など）は数量ではないので先に落とす
    const nop = body.replace(/[（(][^（()）]*[）)]/g,' ');
    const qs=[...nop.matchAll(new RegExp('(\\d+(?:\\.\\d+)?)\\s*('+UNIT_RE+')(?![0-9])','g'))];
    // 同じ単位が並ぶ行（「普通車3台、軽自動車5台」）は足す
    const unit = qs.length ? qs[0][2].replace(/[ｍＭM]/,'m') : '';
    const qty  = qs.length ? qs.filter(q=>q[2].replace(/[ｍＭM]/,'m')===unit)
                               .reduce((a,q)=>a+Number(q[1]),0) : null;
    const name = nop.replace(new RegExp('\\s*\\d+(?:\\.\\d+)?\\s*('+UNIT_RE+')(?![0-9]).*$'),'')
                    .replace(/(支給|貸与|SEEK様手配|SEEK様対応|当社手配|当社対応|弊社手配)/gi,' ')
                    .replace(/\s+/g,' ').trim();
    if(!name || name.length<2) continue;
    out.push({ raw:all[i].trim(), name, qty, unit, supply });
  }
  return out;
}

function readRequest(text){
  const t = String(text||'');
  const flat = flatten(t);
  const r = { kind:'', kind_why:'', client_id:'', client_name:'', title:'', qty:null,
              hits:[], numbers:[], items:[], site:'' };

  // 1) 種類（件名優先）
  const k = kindOf(t); r.kind=k.kind; r.kind_why=k.why;

  // 2) 顧客（マスタの正規名＋Excelでの表記ゆれ全部で照合。長い名前を優先）
  const cands=[];
  activeClients().forEach(c=>{
    const names=[c.name, c.formal_name].concat(c.name_variants||[]).filter(Boolean);
    names.forEach(n=>{ const key=flatten(n);
      if(key.length>=2 && flat.includes(key)) cands.push({c, len:key.length}); });
  });
  if(cands.length){ cands.sort((a,b)=>b.len-a.len); r.client_id=cands[0].c.id; r.client_name=cands[0].c.name; }

  // 3) 案件名・現場住所
  r.title = titleOf(t);
  const sm = han(t).match(/^[\s　]*[・･•\-*＊○◇◆■]?[\s　]*(?:住所|案件地|所在地|現場住所|所在)[\s　]*[:：][\s　]*(.+)$/m);
  if(sm) r.site = sm[1].replace(/[（(][^）)]*[）)]\s*$/,'').trim().slice(0,120);
  else {
    const sm2 = han(t).match(/^[^\n]{0,8}[市郡][^\n]{2,40}\d[^\n]{0,20}$/m);
    if(sm2) r.site = sm2[0].trim().slice(0,120);
  }

  // 4) 箇条書きの品目（数量・単位・支給区分つき）
  r.items = readLines(t);

  // 5) 台数。ここに入れた値は「単位が台の明細ぜんぶ」に効くので、
  //    はっきり駐車場全体の台数だと分かる書き方のときだけ採る。
  //    （箇条書きの「防犯カメラ 2台」を全体台数と取り違えないため）
  for(const m of han(t).matchAll(/(\d{1,3})\s*台/g)) r.numbers.push(+m[1]);
  const decl = han(t).match(/台\s*数\s*[:：]\s*(\d{1,3})/)          // 「台数：7台」
            || r.title.match(/[（(](\d{1,3})\s*台[）)]/);          // 「…設置工事（20台）」
  r.qty = decl ? +decl[1] : null;

  // 6) 工種の照合。まず箇条書きの1行ずつ、次に本文全体。
  const byId = new Map();
  const add = (w, why, it) => {
    const cur = byId.get(w.id);
    if(cur && !(it && !cur.qty)) return;
    byId.set(w.id, {id:w.id, name:w.name, why, qty:it?it.qty:null, unit:it?it.unit:'',
                    supply:it?it.supply:'', raw:it?it.raw:''});
  };
  const kindOk = w => {
    const f=(w.data&&w.data.freq)||{};
    return !r.kind || (f[r.kind]||0) >= 0.05;
  };
  // その行そのものに書いてある「設置／撤去」を優先する。
  // 行に書いていなければ案件全体の種類を使う。（「入替」の依頼でも
  // 個々の行は「ロック板設置」「精算機・テント取り外し」と分かれている）
  const lineKind = s => { for(const [k,re] of KIND_RE) if(re.test(s)) return k; return ''; };
  r.items.forEach(it=>{
    const key = flatten(it.name);
    if(key.length<2) return;
    const want = lineKind(it.raw) || r.kind;
    let best=null;
    M.wts.forEach(w=>{
      const core = flatten((w.data&&w.data.core)||'');
      const nameKey = flatten(w.name);
      let score=0;
      if(nameKey===key) score=100;
      else if(key.length>=3 && nameKey.includes(key)) score=60+key.length;
      else if(core.length>=2 && key.includes(core)) score=40+core.length;
      if(!score) return;
      // お客様が名指しで書いてきた行なので、種類が合わなくても落とさない。
      // 合っているものを上に持ち上げるだけにする（実測: 種類で切ると
      // 「入替」の依頼から「車止め設置」「場内照明柱」が丸ごと消えた）
      if(want && w.category===want) score += 12;
      // 設置の依頼に撤去の工種を当てない。実測: 「料金看板 支給」に
      // 「料金看板撤去工事」が当たってしまった（設置側の工種がマスタに無いため）
      else if(/^(設置|撤去)$/.test(want||'') && /^(設置|撤去)$/.test(w.category||'')) score -= 25;
      score += Math.min(6, (w.sample_count||0)/100);
      if(!best || score>best.score) best={w,score};
    });
    // 反対の種類しか無いなど、確信が持てないものは当てない。
    // 「依頼の行」には残るので、村山さんが手で足せる。
    if(best && best.score>=25) add(best.w, '依頼の行', it);
  });
  M.wts.forEach(w=>{
    const core = flatten((w.data&&w.data.core)||'');
    if(core.length < 2) return;      // 「設置工事」の3文字ではどのメールにも当たってしまう
    const nameKey = flatten(w.name);
    if(nameKey.length>=3 && flat.includes(nameKey)) add(w,'名称',null);
    else if(flat.includes(core) && kindOk(w)) add(w,'核語',null);
  });
  r.hits = [...byId.values()];
  return r;
}
// 種類ごとの候補（出現率順）。本文でヒットしたものは最初から✓
function candidatesFor(kind, hitIds){
  return M.wts.map(w=>{
    const f=(w.data&&w.data.freq)||{};
    const p=kind?(f[kind]||0):0;
    return {w, p, hit:hitIds.has(w.id)};
  }).filter(x=>x.hit || x.p>=0.05)
    .sort((a,b)=> (b.hit?1:0)-(a.hit?1:0) || b.p-a.p);
}

/* ============================================================
   受信箱（見積依頼メールの自動取込）
   ------------------------------------------------------------
   Gmail のラベル → GAS → seek_inbox。設計は
   Phase2設計相談_メール自動取込_2026-09-05.md

   GAS は「読んで入れる」だけ。ここで
     ・どれが見積依頼か（見積依頼でないメールも来る）
     ・どの顧客・どの工種か
   を人が決める。読み取り結果は最初から入れておくが、確定はさせない。
   ============================================================ */
let inbox = [];            // 未処理のメール
let inboxOpen = true;      // 受信箱を開いているか

async function loadInbox(){
  try{
    inbox = await sbFetchAll('seek_inbox',
      'select=*&status=eq.' + encodeURIComponent('未処理') + '&order=received_at.desc');
  }catch(e){
    inbox = [];            // テーブルがまだ無いDBでも画面は動く
  }
  return inbox;
}
async function setInboxStatus(row, status, jobId){
  const patch = { status, updated_at: new Date().toISOString() };
  if(jobId) patch.job_id = jobId;
  const res = await fetch(`${SB_URL}/rest/v1/seek_inbox?id=eq.`+encodeURIComponent(row.id), {
    method:'PATCH', headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify(patch)
  });
  if(!res.ok) throw new Error('受信箱の更新に失敗（'+res.status+'）');
  inbox = inbox.filter(x=>x.id!==row.id);
  return true;
}

/* 受信箱の1件を見積作成に流し込む。
   本文はそのまま readRequest に通し、添付は「保存したら案件に付ける」ものとして持っておく。
   ＝ この時点ではまだ案件が無い（案件番号はサーバー側で採番される）ので、
     ファイルの移動は保存が成功したあとに行う。 */
function useInbox(row){
  resetMake();
  // ★ readRequest は「1行目＝件名」として読む（案件名も工事の種類も件名から取る）。
  //   受信箱の行は件名と本文が別の列に分かれているので、貼り付けたときと同じ形に戻してから渡す。
  //   これを忘れると、案件名が本文の1行目（「◯◯の△△です。」）になり、
  //   工事の種類も「不明」になる。実物で確認した（2026-09-07）。
  mk.paste = [(row.subject||'').trim(), row.body || ''].filter(Boolean).join('\n');
  mk.fromInbox = row;                       // 保存後に添付を移し、受信箱を「案件にした」にする
  view = 'make'; render();
  const pa = document.getElementById('mkpaste');
  if(pa){ pa.value = mk.paste; }
  const btn = document.getElementById('mkread');
  if(btn) btn.click();                      // 読み取りまで走らせる
  setBar('受信箱から取り込みました');
}

function drawInbox(){
  const el = document.getElementById('inboxBox'); if(!el) return;

  const att = r => (r.attachments||[]).length;
  el.innerHTML = `

    <button class="btn ghost sm" id="inboxToggle" style="float:right">${inboxOpen?'たたむ ▴':`届いたメールを見る（${inbox.length}件） ▾`}</button>

    <table><thead><tr><th>受信</th><th>差出人</th><th>件名</th><th class="n">図面</th><th></th></tr></thead>
    <tbody>${inbox.map(r=>{
      // 同じスレッドに複数あるものは、図面の差し替えの可能性がある（実物①で発生）
      const same = inbox.filter(x=>x.thread_id && x.thread_id===r.thread_id);
      return `<tr>

    if(!confirm(`「${r.subject||''}」を受信箱から外します。よろしいですか。\n（Gmailのメールは消えません）`)) return;
    b.disabled=true;

    catch(e){ alert(e.message); b.disabled=false; }

}

/* 案件を保存したあと、受信箱の添付を案件へ移す。
   Storage の中では inbox/... のまま置いておき、seek_files の行だけ作る
   （コピーし直すと同じものが2つできて容量を食う）。 */
async function attachInboxFiles(jobId, row){
  const atts = row.attachments||[];
  if(!atts.length) return 0;
  // 実物のメールでは 図面PDF と 現地写真のzip の両方が来る（2026-09-04 の2通で確認）
  const kindOf = a => {
    const t = (a.mime||'') + ' ' + (a.name||'');
    if(/pdf/i.test(t)) return '図面';
    if(/zip|image|png|jpe?g|heic|写真/i.test(t)) return '写真';
    return 'その他';
  };
  const rows = atts.map((a,i)=>({
    id: 'f-' + row.id + '-' + i, org_id:'seek', job_id:jobId, kind:kindOf(a),
    file_name: a.name || ('添付'+(i+1)), mime_type: a.mime||null, byte_size: a.size||null,
    storage_path: a.storage_path, uploaded_by:'メール自動取込'
  }));
  const res = await fetch(`${SB_URL}/rest/v1/seek_files?on_conflict=id`, {
    method:'POST',
    headers: await H({'Content-Type':'application/json',
                      Prefer:'resolution=merge-duplicates,return=representation'}),
    body: JSON.stringify(rows)
  });
  if(!res.ok) throw new Error('メールの添付を案件に付けられませんでした（'+res.status+'）');
  return rows.length;
}

/* 法定福利費と端数値引き
   ------------------------------------------------------------
   紙の御見積書3枚（2026-09-05 受領）はいずれも ちょうど4.00% だった:
     DP古島 1,426,000→57,040 ／ DP首里寒川 1,745,000→69,800 ／ DP名護 1,881,500→75,260
   さらに Excel実データ全件で確かめた（福利費の行がある案件 199件）:
     ちょうど4.00%  173件（86.9%）／ 中央値 4.00%・四分位も 4.00%
     ちょうど1.00%    7件  ← この率で出している案件もある。ボタンの値は手で直せる
   基準は「諸経費・法定福利費を除いた工事の小計」。
   値引きは端数落とし（1,553,040→▲40 / 2,041,760→▲1,760）だった。
   ------------------------------------------------------------ */
const WELFARE_RATE = 0.04;
const isExpenseLine = l => {
  if(l.section!=null) return Number(l.section)===2;
  const w = l.work_type_id ? wtMap.get(l.work_type_id) : null;
  return (w && w.category==='経費') || EXPENSE_RE.test(l.name||'');
};
function addWelfare(){
  const wt = M.wts.find(w=>/^法定福利費$/.test(w.name)) || M.wts.find(w=>/福利/.test(w.name));
  const base = mk.lines.filter(l=>!isExpenseLine(l)).reduce((a,l)=>a+Number(l.amount||0),0);
  if(base<=0){ alert('先に工事の明細を入れてください。\n法定福利費は「諸経費を除いた工事の小計」の4%です。'); return; }
  const amt = Math.round(base*WELFARE_RATE);
  const at = mk.lines.findIndex(l=>/福利/.test(l.name||''));
  const line = { work_type_id: wt?wt.id:null, name: wt?wt.name:'法定福利費', section:2,
                 supply_type:'材工', opt_gl_cut:false, opt_pole:'',
                 qty:1, unit:'式', unit_price:amt, amount:amt, cost_unit:null, cost_amount:null,
                 memo:'工事小計 '+yen(base)+' の4%' };
  if(at>=0){ line.id = mk.lines[at].id; mk.lines[at]=line; } else mk.lines.push(line);
  drawMake();
}
function roundDown(){
  const sub = mk.lines.reduce((a,l)=>a+Number(l.amount||0),0);
  if(sub<=0) return;
  const target = Math.floor(sub/1000)*1000;          // 千円未満を落とす
  const d = target - sub;                             // 実データと同じくマイナス値で入れる
  if(d===0){ alert('すでに千円単位です（端数はありません）。'); return; }
  mk.discount = d; drawMake();
}
/* 「この見積が通れば何％残るか」を出す欄 */
function drawProfit(){
  const unit = mkLaborUnit();
  const p = profitOf(mk.lines, mk.discount, mk.labor_days, unit);
  const yenc = n => yen(Math.round(n));
  const days = Number(mk.labor_days||0);
  // 人工の外注先と単価（2026-09-29 大嶺さん「人工の外注先の名前を設定できるように」「外注先によって人工単価は違う」）。

  const gpr = p.gpr===null?0:p.gpr*100;

function applyPicks(){
  if(!mk.client_id){ alert('先に顧客を選んでください'); return; }
  const qty = mk.read && mk.read.qty;
  const hitOf = id => (mk.read && mk.read.hits.find(h=>h.id===id)) || null;
  const order = candidatesFor(mk.read?mk.read.kind:'', new Set()).map(x=>x.w.id);
  [...mk.picks].sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(id=>{
    if(mk.lines.some(l=>l.work_type_id===id)) return;      // 二重に足さない
    const w = wtMap.get(id); if(!w) return;
    const h = hitOf(id);
    const l = { work_type_id:id, name:w.name, section: w.category==='経費' ? 2 : 1,
                supply_type:(h&&h.supply)||'材工', opt_gl_cut:false, opt_pole:'',
                qty:1, unit:w.default_unit||'台', unit_price:0, amount:0, cost_unit:null, cost_amount:null };
    applyPrice(l);                                          // 支給区分まで見て単価表を引く
    // 数量は「依頼の箇条書きに書いてあった数」を最優先。
    // 箇条書きが1行も無いメールのときだけ、単位が「台」の行に全体台数を入れる
    //   （実測95%で案件名の台数＝明細の数量。ただし箇条書きがあるのに
    //     そこに書いていない行へ入れると、精算機やP看板まで7台にしてしまう）
    const hasList = !!(mk.read && mk.read.items && mk.read.items.length);
    if(h && h.qty){ l.qty = h.qty; if(h.unit) l.unit = h.unit; }
    else if(qty && l.unit==='台' && !hasList) l.qty = qty;
    l.amount = Number(l.qty||0)*Number(l.unit_price||0);
    mk.lines.push(l);
  });
  mk.picks.clear();
  // 明細に落としたら①はもう用済み。畳んで②を画面に出す
  mkFolded = true; render();
  document.getElementById('mkbody').scrollIntoView({behavior:'smooth', block:'start'});
}
/* 同じ現場に既に見積が無いか、作っている最中に知らせる
   （要件定義 D「重複見積の警告」／課題「二重見積」。
     ダッシュボードの一覧は"後から気づく"ためのもので、本来はここで止めたい） */
function findDupes(clientId, title){
  if(!clientId || !title) return [];
  const norm = s => String(s||'').replace(/^仮\s*[）)]\s*/,'').replace(/[\s　]/g,'').trim();
  const t = norm(title);
  if(t.length < 4) return [];
  if(/月分|レンタル|預かり|支援料|保守|管理費|応援/.test(t)) return [];   // 毎月くり返す費目は対象外
  return M.jobs.filter(j=> j.client_id===clientId && norm(j.title)===t && j.id!==(mk.job&&mk.job.id));
}
function drawDup(){
  const el = document.getElementById('mkdup'); if(!el) return;
  const hits = findDupes(mk.client_id, (document.getElementById('mkt')||{}).value || mk.title);
  if(!hits.length){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="err" style="margin-top:10px">
    <b>同じ現場の見積が ${hits.length}件 すでにあります。</b>作り直しになっていないかご確認ください。<br>
    ${hits.slice(0,5).map(j=>`<span style="display:inline-block;margin-top:4px">
      ${esc(j.quoted_at||'—')}　<b>${yen(j.total_ex_tax)}円</b>　${esc(j.status)}
      <button class="btn ghost sm" data-open="${esc(j.id)}">開く</button></span>`).join('<br>')}
    ${hits.length>5?`<br><span class="muted small">ほか ${hits.length-5}件</span>`:''}
  </div>`;
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openJob(b.dataset.open));
}

  const pa=document.getElementById('mkpaste');

  pa.onpaste=()=>setTimeout(()=>{ if(pa.value.trim().length>=30) doRead(); }, 0);

  };

  loadInbox().then(drawInbox);

function priceFor(cid, wid, supply, gl, pole){
  const list = priceIdx.get(cid+'/'+wid) || [];
  return list.find(p=>p.supply_type===supply && !!p.opt_gl_cut===!!gl && (p.opt_pole||'')===(pole||''))
      || list.find(p=>p.supply_type===supply)
      || list.slice().sort((a,b)=>b.sample_count-a.sample_count)[0] || null;
}
/* 原価マスタ（実績の最頻値）から、その工種の直接原価単価を引く。
   村山さんが手で入れた原価があれば触らない。入っていない行だけ埋める。 */
function costFor(l){
  const nm = (l.name || (wtMap.get(l.work_type_id)||{}).name || '').trim();
  return nm ? costIdx.get(nm) || null : null;
}
function applyPrice(l){
  if(!l.work_type_id) return;
  const w = wtMap.get(l.work_type_id);
  // 単価表に載せていない費目（諸経費など、案件ごとに金額が変わるもの）は
  // 過去実績の中央値を「参考」として添えるだけにする。自動では入れない。
  l._median = (w && w.data && w.data.median) || null;
  const p = priceFor(mk.client_id, l.work_type_id, l.supply_type, l.opt_gl_cut, l.opt_pole);
  if(p){ l.unit_price=Number(p.unit_price); l.unit=p.unit||l.unit; l._sample=p.sample_count;
         l._exact = (p.supply_type===l.supply_type && !!p.opt_gl_cut===!!l.opt_gl_cut && (p.opt_pole||'')===(l.opt_pole||'')); }
  else { l._sample=0; l._exact=false; }
  // 原価マスタの値を入れる。ただし入れてよいものだけ。
  //
  // ⚠ 現行Excelは「機器代を工事の行にまとめて入れている」ことがある。
  //   例: 精算機撤去工事 …… 売価 16,500 に対して原価 200,000（原価率1212%）
  //   これを自動で入れると、粗利が -115% のような数字になって使いものにならない。
  //   （実際に実物のメールから作った見積で再現した）
  //   だから **その工種の過去の原価率の中央値が100%を超えるものは自動で入れない。**
  //   参考として画面に出すだけにして、村山さんに入れてもらう。
  //   もう1つ、行ごとの歯止め: マスタの原価がこの行の単価より高いなら入れない。
  //   工種としての原価率が正常でも、お客様ごとの単価が低いと逆転することがある
  //   （例: ロック板設置工事 原価54,000 に対し 大和ハウスの単価32,000）。
  // 顧客別単価表に「その顧客のときの原価」があれば、工種の原価マスタより先に使う（2026-09-29）。
  // 例: 一次電源設置工事 … 原価マスタ150,000 ／ アップルパークは125,000（実績12件中9件）
  const cq = (p && p.cost_unit!=null && p.cost_unit!=='')
    ? { cost_unit: Number(p.cost_unit), sample_count: p.sample_count, is_stable: true, median_rate: null, _client: true }
    : costFor(l);
  l._costMaster = cq || null;
  const price = Number(l.unit_price||0);
  l._costOverRate = !!(cq && (
        (cq.median_rate!=null && Number(cq.median_rate) > 1)
     || (price > 0 && Number(cq.cost_unit) > price)));
  const empty = (l.cost_unit===null || l.cost_unit===undefined || l.cost_unit==='' || Number(l.cost_unit)===0);
  // 自動で入れた原価は、顧客や条件を変えたら入れ直す（手で入れた原価には触らない）
  if(cq && (empty || l._costGuess) && !l._costOverRate){
    l.cost_unit = Number(cq.cost_unit);
    l._costGuess = true;              // 実績からの推定。手で入れた値と見分ける
  } else if(l._costGuess){
    l.cost_unit = null; l._costGuess = false;   // 前の顧客の原価を残さない
  }
}
/* この見積が通ったら、いくら残るか
   ------------------------------------------------------------
   売上（税抜）− 原価 = 粗利。原価は次の2つ。
     ・明細ごとの原価単価 × 数量（原価マスタから入るか、村山さんが手で入れる）
     ・人工 ＝ 人日 × 15,000円（実データ487件中472件が15,000の倍数で裏が取れている）
   採算の目安は 要件定義 §1工程10「粗利20%超で良し」。
   ⚠ 原価が1行も入っていない見積では粗利を出さない。0円を原価として
      「粗利100%」と出すと嘘になる（移行データで実際にそうなる案件が多い）。 */
// 外注先を入れないときの人工単価（既定）。外注先ごとの単価は settings.labor.vendors
const LABOR_UNIT = () => Number((M.settings&&M.settings.labor&&M.settings.labor.unit_price) || 15000);
const laborVendors = () => ((M.settings&&M.settings.labor&&M.settings.labor.vendors)||[])
  .filter(v=>v && String(v.name||'').trim());
const laborRateOf = name => { const n=String(name||'').trim(); if(!n) return 0;
  const v=laborVendors().find(x=>String(x.name).trim()===n); return v ? Number(v.unit_price)||0 : 0; };
const mkLaborUnit = () => mk.labor_unit!=null && mk.labor_unit!=='' ? Number(mk.labor_unit)
                        : (laborRateOf(mk.labor_vendor) || LABOR_UNIT());
// 保存済みの案件で使った単価。9/29 より前の案件と移行データは単価を持っていないので、金額÷人日で戻す
function laborUnitOfJob(j){
  const d=(j&&j.data)||{}, days=Number(d.labor_person_days||0);
  if(d.labor_unit_price) return Number(d.labor_unit_price);
  if(days && d.labor_cost!=null) return Math.round(Number(d.labor_cost)/days);
  return laborRateOf(d.labor_vendor) || LABOR_UNIT();
}
function laborVendorNames(){
  const out=[], seen=new Set(), add=(name,rate)=>{ const n=String(name||'').trim();
    if(n && !seen.has(n)){ seen.add(n); out.push({name:n, rate:rate||0}); } };
  laborVendors().forEach(v=>add(v.name, Number(v.unit_price)||0));
  const cnt = new Map();
  (M.jobs||[]).forEach(j=>{ const v=String((j.data&&j.data.labor_vendor)||'').trim(); if(v) cnt.set(v,(cnt.get(v)||0)+1); });
  [...cnt.entries()].sort((a,b)=>b[1]-a[1]).forEach(([n])=>add(n, 0));
  (M.suppliers||[]).filter(s=>s.active!==false).forEach(s=>add(s.name, 0));
  return out;
}
function profitOf(lines, discount, laborDays, laborUnit){
  const sales = lines.reduce((a,l)=>a+Number(l.amount||0),0) + Number(discount||0);
  const itemCost = lines.reduce((a,l)=>a+Number(l.cost_unit||0)*Number(l.qty||0),0);
  const labor = Number(laborDays||0) * (laborUnit!=null ? Number(laborUnit) : LABOR_UNIT());
  const cost = itemCost + labor;
  const filled = lines.filter(l=>Number(l.cost_unit||0)>0).length;
  return { sales, itemCost, labor, cost, filled, total:lines.length,
           gp: sales-cost, gpr: sales>0 ? (sales-cost)/sales : null,
           cr: sales>0 ? cost/sales : null,
           known: filled>0 || labor>0 };
}

/* 画面を作り直すと、いま打っている入力欄が「別の要素」に差し替わる。
   ブラウザはフォーカスを body に落とすので、2文字目からどこにも入らなくなる。
   　例）人工に「12」と打つ → 「1」で作り直しが走る → 「2」は body へ → 欄は空のまま
   2026-09-07 大嶺さん「見積に人工を入れたら、反映されず別のとこに飛ぶ」で発覚。
   人工だけでなく、明細の数量・単価・原価単価・品名すべてが同じ作りだった。

   → 作り直しの前に「どこを触っていたか」と「カーソルの位置」を覚えて、作り直したあとに戻す。 */
/* 人が打った数字を読む。
   Excelを8年使ってきた人は「12,000」とカンマを打つ。日本語入力のままだと「１２０００」になる。
   素の Number() はどちらも NaN になるので、村山さんには
   「単価は0以上の数字で入れてください」としか出ない（カンマが原因だと分からない）。
   単価表343行・原価190行を1行ずつ見てもらうので、ここで弾くと作業が止まる。
   2026-09-08 の点検で実測（12,000 と打つ → 拒否されて元の値に戻る）。 */
const ZEN = '０１２３４５６７８９．，－';
function numIn(v){
  const s = String(v == null ? '' : v)
    .replace(/[０-９．，－]/g, c => '0123456789.,-'[ZEN.indexOf(c)])
    .replace(/[,\s¥￥円]/g, '');
  return s === '' ? NaN : Number(s);
}
function keepFocus(redraw){
  const a = document.activeElement;
  const id = a && a.id;
  const li = (a && a.dataset) ? a.dataset.li : null;
  const f  = (a && a.dataset) ? a.dataset.f  : null;
  /* 打っている「文字そのもの」を覚えておく。
     作り直しは値を数字に直してから書き戻すので、途中の "1." が "1" に化ける。
     　例）人工に 1.5 と打つ → "1." が "1" にされる → 次の "5" で "15" ＝ 10倍
     　　　15,000円/人日なので 22,500円 のつもりが 225,000円 になる。黙って間違う。
     2026-09-08 村山さんとの打合せ前の点検で発見。数量・単価・原価単価も同じだった。
     チェックボックスは value が "on" なので触らない。 */
  const raw = (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')
               && a.type !== 'checkbox' && a.type !== 'radio') ? a.value : null;
  let s = null, e = null;
  try{ s = a.selectionStart; e = a.selectionEnd; }catch(_){}

  redraw();

  let n = null;
  if(id) n = document.getElementById(id);
  else if(li != null && f) n = document.querySelector(`[data-li="${li}"][data-f="${f}"]`);
  if(n && n !== a && typeof n.focus === 'function'){
    if(raw != null && n.value !== raw) n.value = raw;
    n.focus();
    // select には selectionStart が無い。数値欄でも例外になるブラウザがあるので握りつぶす
    try{ if(s != null) n.setSelectionRange(s, e); }catch(_){}
  }
}
/* 「明細を追加」は、工種を選んでいない空の行を足す（2026-09-29 大嶺さん「明細を追加を押すと選択されて出てくる」）。
   前は一覧の先頭（2400×1200片面 支給）が入った行が出ていた。 */
// いまの見積の「台数」：案件名の「（12台）」、無ければ単位が台の行でいちばん多い数量（2以上）
function carCountOf(){
  const t=((document.getElementById('mkt')||{}).value||mk.title||'').normalize('NFKC'), m=t.match(/(\d+)台/);
  if(m) return Number(m[1]);
  const c={}; mk.lines.forEach(l=>{ if(l.unit==='台' && Number(l.qty)>1) c[l.qty]=(c[l.qty]||0)+1; });
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
  return top ? Number(top[0]) : 0;
}
function newLine(){
  return { work_type_id:null, _pick:true, name:'', section:1,
           supply_type:'材工', opt_gl_cut:false, opt_pole:'',
           qty:1, unit:'台', unit_price:0, amount:0, cost_unit:null, cost_amount:null };
}
/* 工種を選ぶ（2026-09-29 大嶺さん「ドロップリストもリストが多すぎて選びにくい」）
   ・空のときは「この顧客の単価表で よく使う順」に15個。打つと絞り込む
   ・打ったときは、この顧客の単価表に無い工種も「ほかの工種」として出す
   ・↑↓で選んで Enter、Esc でやめる。見つからなければ、打った文字で「自由入力の行」にできる
   ・選んだら数量の欄へ進む */
const wtNorm = s => String(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();
function wtCandidates(q){
  const nq = wtNorm(q), mine = new Map();
  if(priceIdx) for(const [k,list] of priceIdx){
    if(!k.startsWith(mk.client_id+'/')) continue;
    mine.set(k.slice(k.indexOf('/')+1), list.slice().sort((a,b)=>(b.sample_count||0)-(a.sample_count||0))[0]);
  }
  const hit = w => !nq || wtNorm(w.name).includes(nq);
  const a = [...mine.entries()].map(([wid,p])=>({w:wtMap.get(wid), p})).filter(x=>x.w && hit(x.w))
             .sort((x,y)=>(y.p.sample_count||0)-(x.p.sample_count||0));
  const b = nq ? (M.wts||[]).filter(w=>w.active!==false && !mine.has(w.id) && hit(w))
                   .sort((x,y)=>(y.sample_count||0)-(x.sample_count||0)) : [];
  return { a: a.slice(0, nq?30:15), aAll: a.length, b: b.slice(0,20) };
}
let wtp = null;                                  // いま開いている候補 {i, sel, items, inp}
function wtpPop(){ let el=document.getElementById('wtpop');
  if(!el){ el=document.createElement('div'); el.id='wtpop'; el.className='wtpop'; document.body.appendChild(el); } return el; }
function closeWtp(){ wtp=null; const el=document.getElementById('wtpop'); if(el) el.hidden=true; }
function openWtp(inp){
  const i=+inp.dataset.wtp, q=inp.value.trim(), c=wtCandidates(q);
  const items=[...c.a.map(x=>({id:x.w.id, name:x.w.name, g:'a',
                  sub: yen(x.p.unit_price)+(x.p.unit?'／'+x.p.unit:''), n:x.p.sample_count||0})),
               ...c.b.map(w=>({id:w.id, name:w.name, g:'b', sub:'この顧客の単価表に無い', n:0}))];
  if(q) items.push({free:true, name:q});
  wtp = {i, items, inp, sel: items.length ? 0 : -1};
  drawWtp();
}
function drawWtp(){
  if(!wtp) return;
  const el=wtpPop(), r=wtp.inp.getBoundingClientRect(), it=wtp.items;
  let h='', g='';
  it.forEach((x,k)=>{
    if(!x.free && x.g!==g){ g=x.g; h+=`<div class="h">${g==='a'?'この顧客の単価表（よく使う順）':'ほかの工種'}</div>`; }
    h+= x.free
      ? `<div class="o free${k===wtp.sel?' on':''}" data-k="${k}">「${esc(x.name)}」を自由入力の行にする</div>`
      : `<div class="o${k===wtp.sel?' on':''}" data-k="${k}"><b>${esc(x.name)}</b>
           <span class="s">${esc(x.sub)}${x.n?`・実績${x.n}件`:''}</span></div>`;
  });
  if(!it.length) h='<div class="none">この顧客の単価表はまだありません。工種名を打つと全部から探せます</div>';
  else if(!wtp.inp.value.trim()) h+='<div class="none small">打つと絞り込めます（単価表に無い工種も探せます）</div>';
  el.innerHTML=h; el.hidden=false;
  el.style.left=Math.round(r.left)+'px'; el.style.top=Math.round(r.bottom+2)+'px';
  el.style.width=Math.max(r.width, 420)+'px';
  const on=el.querySelector('.o.on'); if(on) on.scrollIntoView({block:'nearest'});
  el.querySelectorAll('[data-k]').forEach(o=>o.onmousedown=e=>{ e.preventDefault(); pickWt(wtp.items[+o.dataset.k]); });
}
function pickWt(it){
  if(!wtp || !it) return;
  const i=wtp.i, l=mk.lines[i]; closeWtp(); if(!l) return;

function bindWtPicker(root){
  root.querySelectorAll('.wtp-in').forEach(inp=>{
    inp.onfocus=()=>{ inp.select(); openWtp(inp); };
    inp.oninput=()=>openWtp(inp);
    inp.onkeydown=e=>{
      if(!wtp || wtp.inp!==inp) return;
      const n=wtp.items.length;
      if(e.key==='ArrowDown'){ e.preventDefault(); if(n){ wtp.sel=(wtp.sel+1)%n; drawWtp(); } }
      else if(e.key==='ArrowUp'){ e.preventDefault(); if(n){ wtp.sel=(wtp.sel-1+n)%n; drawWtp(); } }
      else if(e.key==='Enter'){ e.preventDefault(); if(wtp.sel>=0) pickWt(wtp.items[wtp.sel]); }
      else if(e.key==='Escape'){ e.preventDefault(); closeWtp(); inp.blur(); }
    };
    // 選ばずに離れたら、元の工種名に戻す（打ちかけの文字を残さない）
    inp.onblur=()=>setTimeout(()=>{ if(wtp && wtp.inp===inp) closeWtp();

  });

    // 人工は見積の明細ではない（お客様に出す見積書には載せない）ので data に持つ。
    // 移行データも同じ場所に入れてある（_SEEK_05_labor.sql）
    // 0のときも必ず送る。送らないと、DB側は合成（||）なので
    // 「人工を消したのに前の値が残る」ことになる。

    data: { labor_person_days: Number(mk.labor_days||0),

            labor_vendor: String(mk.labor_vendor||'').trim(),     // 空でも送る（消したのに前の名前が残らないように）
            build_start: mk.build_start || null,

  if(mk.job){ job.id = mk.job.id; job.version = mk.job.version; }
  else { job.amounts_locked = false; }
  const wasEdit = !!mk.job;
  const picked = Array.from((document.getElementById('mkfiles')||{}).files || []);
  try{
    const saved = await saveJob(job, mk.lines);
    lastSaved = saved;                    // 画面のいちばん上に「保存しました」と見積書・案件への入口を出す
    const at = M.jobs.findIndex(x=>x.id===saved.id);

    const msg = `<div class="${picked.length && fileMsg.includes('できませんでした')?'note':'ok'}">

      合計（税抜） <b>${yen(saved.total_ex_tax)}</b> 円　総合計 <b>${yen(saved.total_in_tax)}</b> 円
      <span class="muted">（合計はサーバーが明細から計算した値です）</span>${fileMsg}</div>`;
    if(wasEdit){
      // 編集を続けられるように、保存後の姿（新しい version）で持ち直す
      mk.job = saved; mk.status = saved.status;
      const fresh = await loadItems(saved.id, true);
      mk.lines = fresh.map(it=>({ id:it.id, work_type_id:it.work_type_id, name:it.name,
        supply_type:it.supply_type||'材工', opt_gl_cut:!!it.opt_gl_cut, opt_pole:it.opt_pole||'',
    section:Number(it.section)===2?2:1,
        qty:Number(it.qty||0), unit:it.unit||'', unit_price:Number(it.unit_price||0),
        amount:Number(it.amount||0), memo:it.memo||'',
        cost_unit:it._cost_unit, cost_amount:it._cost_amount,
        _median:(wtMap.get(it.work_type_id)||{}).data?.median||null }));
    }else{
      copiedFrom = null;
      resetMake();
      savedNew = true;       // 新しく保存した → 画面ぜんぶを描き直す（上の欄に前の顧客・案件名が残っていた）
    }
    mk.msg = msg;
    setBar(wasEdit?'更新しました':'保存しました'); setMeta();
    setTimeout(()=>{ const b=document.getElementById('savedbar'); if(b) b.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
  }catch(e){
    mk.msg = `<div class="err">保存できませんでした。<b>${esc(e.message)}</b><br>
      入力内容はこの画面に残っています。もう一度お試しください。</div>`;
    sbLog({ng:1, note:String(e.message).slice(0,120)});
    setBar('保存に失敗しました');
  }finally{
    mk.saving=false;
    if(savedNew) render(); else drawMake();
  }
}

async function savePrice(row, patch){
  const res = await fetch(SB_URL+'/rest/v1/seek_price_lists?id=eq.'+encodeURIComponent(row.id),{
    method:'PATCH',
    headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify(patch)
  });
  if(!res.ok) throw new Error('保存できませんでした（'+res.status+'）'+(await res.text()).slice(0,120));
  const rows = await res.json();
  if(!rows.length) throw new Error('対象の行が見つかりませんでした');
  Object.assign(row, rows[0]);
  return row;
}
/* 単価表の行を足す（2026-09-30 村山さん「消したり打ち込んだりして登録して、見積に反映してくれれば」）。
   同じ組合せの行があれば（消した行も含めて）それを生き返らせて直す。工種マスタに無い名前なら工種も作る */
async function addPriceRow(clientId, name, unit, price, cost){
  const nm = String(name||'').trim();
  let w = (M.wts||[]).find(x=>String(x.name).trim()===nm);
  if(!w){
    const res = await fetch(SB_URL+'/rest/v1/seek_work_types', { method:'POST',
      headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
      body: JSON.stringify([{ id:'w-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), org_id:'seek',
        name:nm, category:'工事', default_unit:unit||'式', sort_no:9999, sample_count:0, active:true }]) });
    if(!res.ok) throw new Error('工種を作れませんでした（'+res.status+'）'+(await res.text()).slice(0,120));
    w = (await res.json())[0]; M.wts.push(w);
  }
  const same = M.prices.find(p=>p.client_id===clientId && p.work_type_id===w.id && (p.supply_type||'材工')==='材工' && !p.opt_gl_cut && !(p.opt_pole||''));
  const vals = { unit: unit||w.default_unit||'式', unit_price: price, cost_unit: cost, source:'手入力',
                 active:true, confirmed_at: new Date().toISOString() };
  if(same){ await savePrice(same, vals); reindex(); return {row:same, w, revived:true}; }
  const res = await fetch(SB_URL+'/rest/v1/seek_price_lists', { method:'POST',
    headers: await H({'Content-Type':'application/json', Prefer:'return=representation'}),
    body: JSON.stringify([Object.assign({ id:'p-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), org_id:'seek',
      client_id: clientId||null, work_type_id: w.id, supply_type:'材工', opt_gl_cut:false, opt_pole:'', sample_count:0 }, vals)]) });
  if(!res.ok) throw new Error('単価表に足せませんでした（'+res.status+'）'+(await res.text()).slice(0,120));
  const row = (await res.json())[0]; M.prices.push(row); reindex();
  return {row, w, revived:false};
}
